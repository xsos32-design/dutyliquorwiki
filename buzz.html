<script>
(function(){

function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ago(d){var m=Math.round((now-Date.parse(d))/(30.4*864e5));return m<1?'本月':m+' 個月前';}
function href(id){var p=D.P[id];return p&&p[2]==='c'?'../chocolatewiki/#'+id:'./#'+id;}
function site(x){var w=0,c=0;x.ids.forEach(function(i){var p=D.P[i];if(p&&p[2]==='c')c++;else w++;});return c&&!w?'c':w&&!c?'w':'b';}
var st={r:'全部',s:'全部',k:'全部',q:''};try{var sv=JSON.parse(localStorage.getItem('xw_bzui')||'{}');for(var k in sv)if(k!=='q')st[k]=sv[k];}catch(e){}
var KS=['全部'];I.forEach(function(x){if(KS.indexOf(x.k)<0)KS.push(x.k);});
function btns(id,arr,key){var h='';arr.forEach(function(v){h+='<button type="button" data-k="'+key+'" data-v="'+E(v)+'"'+(st[key]===v?' class="on"':'')+'>'+E(v)+'</button>';});document.getElementById(id).innerHTML=h;}
function tile(x,open){
 var ps=x.ids.filter(function(i){return D.P[i];}),pic;
 if(x.img) pic='<img class="hero" src="'+E(x.img)+'" alt="'+E(x.t)+'" loading="lazy" onerror="this.parentNode.classList.add(\'nf\');this.remove()"><span class="cr">圖：'+E(x.imgSrc||x.src)+'</span>';
 else pic='<div class="col">'+ps.slice(0,3).map(function(i){return '<img src="'+E(D.P[i][1])+'" alt="" loading="lazy">';}).join('')+'</div><span class="cr">圖：本店商品主圖</span>';
 var lim=open?99:8,h='';
 ps.slice(0,lim).forEach(function(i){var p=D.P[i];h+='<a class="p" href="'+href(i)+'"><span class="im"><img src="'+E(p[1])+'" alt="" loading="lazy"></span><i>'+E(p[0])+'</i></a>';});
 if(ps.length>lim) h+='<span class="more" data-open="'+E(x.id)+'">另 '+(ps.length-lim)+' 支 ›</span>';
 return '<article class="bz" id="bz-'+E(x.id)+'"><div class="pic">'+pic+'<span class="rg'+(x.region==='國外'?'':' tw')+'">'+E(x.region||'國內')+'</span></div><div class="bd">'+
  '<div class="m"><span class="k">'+E(x.k)+'</span>'+(x.who?'<span class="who">'+E(x.who)+'</span>':'')+'<span class="d">'+E(x.d.replace(/-/g,'/'))+'・'+ago(x.d)+'</span></div>'+
  '<div class="t">'+E(x.t)+'</div><p class="why"><b>為什麼有話題</b>'+E(x.body)+'</p>'+
  (x.note?'<p class="note"><b>本店</b>'+E(x.note)+'</p>':'')+(x.say?'<p class="say"><b>跟客人這樣說</b>'+E(x.say)+'</p>':'')+
  '<div class="lbl">本店相關商品 '+ps.length+' 支・點圖開商品卡</div><div class="ps">'+h+'</div>'+
  (x.u?'<a class="src" href="'+E(x.u)+'" target="_blank" rel="noopener">來源：'+E(x.src||'新聞')+' ›</a>':'')+'</div></article>';
}
var OPEN={};
function draw(){
 btns('fr',['全部','國內','國外'],'r');btns('fs',['全部','酒類','巧克力'],'s');btns('fk',KS,'k');
 var q=st.q.trim().toLowerCase();
 var L=I.filter(function(x){if(st.r!=='全部'&&(x.region||'國內')!==st.r)return false;var s=site(x);if(st.s==='酒類'&&s==='c')return false;if(st.s==='巧克力'&&s==='w')return false;if(st.k!=='全部'&&x.k!==st.k)return false;
  if(q){var t=[x.t,x.body,x.who,x.note,x.src,x.k].concat(x.ids.map(function(i){return D.P[i]?D.P[i][0]:'';})).join(' ');if(t.toLowerCase().indexOf(q)<0&&!(window.XS&&XS.match&&XS.match(q,t)))return false;}return true;});
 L.sort(function(a,b){return a.d<b.d?1:-1;});
 document.getElementById('out').innerHTML=L.length?'<div class="grid">'+L.map(function(x){return tile(x,OPEN[x.id]);}).join('')+'</div>':'<p class="empty">找不到符合的話題。</p>';
 document.getElementById('cnt').textContent='顯示 '+L.length+' 則（國內 '+L.filter(function(x){return (x.region||'國內')==='國內';}).length+'・國外 '+L.filter(function(x){return x.region==='國外';}).length+'）';
 try{localStorage.setItem('xw_bzui',JSON.stringify({r:st.r,s:st.s,k:st.k}));}catch(e){}
}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.row button');if(b){st[b.dataset.k]=b.dataset.v;draw();return;}
 var m=e.target.closest&&e.target.closest('.more');if(m){OPEN[m.dataset.open]=1;draw();}});
var qi=document.getElementById('q'),tm;qi.addEventListener('input',function(e){if(e.isComposing)return;clearTimeout(tm);tm=setTimeout(function(){st.q=qi.value;draw();},120);});
qi.addEventListener('compositionend',function(){st.q=qi.value;draw();});
if(KS.indexOf(st.k)<0)st.k='全部';
draw();
if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)setTimeout(function(){t.scrollIntoView({block:'start'});},60);}
})();
