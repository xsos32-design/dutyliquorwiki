ws-detail.php?id=56","imgSrc":"ORIGIN 官網","subj":"70% 輕焙咖啡風味＝本店有（c2732704200040）；70% 貢布椒鹽花＝本店的是「貢布粉紅胡椒」，名稱不同，可能不是同一款","praise":"輕焙咖啡款：「結合輕焙咖啡的果香與可可，風味層次綿長」；貢布椒鹽花：「以頂級貢布胡椒與鹽之花點綴，呈現成熟的鹹甜滋味」。","hit":{"c2732704200040":"官網點名這款拿到 ICA 2026 亞太區銅獎，說它有輕焙咖啡的果香、層次綿長。"},"img":"img/buzz/origin-2026-ica.webp","ids":["c2732704200040","c2732704200060","c2732704200010"]},{"id":"ornellaia-2026-abramovic","d":"2026-06-10","k":"限量","region":"國外","who":"Tenuta dell'Ornellaia 歐尼拉雅","t":"歐尼拉雅 2023：Abramović 畫酒標","body":"歐尼拉雅 2023 年份主題「La Vitalità（活力）」，第 18 屆「藝術家年份」由行為藝術家 Marina Abramović 設計酒標：750ml 是她化身梅杜莎的線條畫，3 公升（100 瓶）、6 公升（10 瓶）、9 公升各有不同作品。14 組大瓶在 Bonhams 線上拍賣（2026/6/11–23），收入全捐古根漢基金會。","fame":"Marina Abramović：塞爾維亞裔行為藝術家，被稱為「行為藝術之母」。","note":"本店有 2023 年份；店裡的 750ml 酒標可能是 Abramović 梅杜莎版（藝術酒標通常只在部分瓶或禮盒），請看實品。","say":"歐尼拉雅每年請一位藝術家設計酒標，2023 年份請到 Marina Abramović，主題叫「活力」，酒廠說這年葡萄熟得很穩、酸度很好。","pitch":"義大利紅酒送禮直接推本款；想要同產區入門可推本店其他托斯卡納紅酒（Luce、Lucente）。","src":"Wine Industry Advisor 2026-06-10；wein.plus","u":"https://wineindustryadvisor.com/2026/06/10/marina-abramovic-interprets-ornellaia-2023-la-vitalita/","imgSrc":"Wine Industry Advisor（攝影 Marco Anelli）","subj":"歐尼拉雅 2023（本店有）","praise":"技術總監 Marco Balsimelli：夏天熱但沒有極端高溫、葡萄沒有缺水，8 月底的雨與 9 月涼夜帶來香氣層次並保留好酸度，「這是歐尼拉雅的招牌」。","hit":{"ornellaia-2023":"新聞介紹的就是 2023 年份：主題「La Vitalità」、Marina Abramović 酒標、年份天候說明。"},"img":"img/buzz/ornellaia-2026-abramovic.webp","ids":["ornellaia-2023"]},{"id":"yushan-2026-20y-jar","d":"2026-06-08","k":"新聞","region":"國內","who":"台灣菸酒／工商時報","t":"台酒嘉義酒廠開甕：玉山二十年窖藏原漿","body":"台酒嘉義酒廠 2006 年封存的兩甕「玉山二十年窖藏原漿陳高」（每甕十公石，陳年約 7,300 天）在 2026 年 6 月 5 日由董事長湯期安開甕，兩甕分別叫「乾」（第一次蒸餾酒液）與「坤」（第二次蒸餾酒液），並封存下一批二十、三十、四十年甕酒。現場售出八甕。","note":"本店沒有二十年原漿；可介紹本店陳年款。","say":"台酒嘉義酒廠今年剛開了封存二十年的高粱原漿，本店的陳高也是同樣固態發酵、陳年的做法。","pitch":"要陳年感推十年火神釀；送禮推八年潛龍爭輝；入門推六年。","src":"工商時報 2026-06-08（記者黃志懋）","u":"https://www.ctee.com.tw/news/20260608700713-431207","imgSrc":"工商時報","subj":"玉山二十年窖藏原漿陳高（本店沒有；本店有玉山六年、八年、十年陳高）","praise":"湯期安：嘉義酒廠「傳承了台灣高粱釀造的歷史文化」，開甕代表台酒的永續傳承。新聞強調固態發酵、固態蒸餾、三蒸三釀工 :"https://www.ctee.com.tw/news/20251216700585-431207","imgSrc":"工商時報","subj":"永恆系列 56 年（本店沒有）","praise":"報導強調瓶身由 Fredrikson Stallard 設計，以石楠花枯枝為靈感，用純 24K 鍍金與訂製水晶寶石。","img":"img/buzz/glenlivet-2025-eternal56.webp","ids":["glenlivet-sc-25y","glenlivet-25y-sampleroom","glenlivet-1990-31y","glenlivet-sc-23y"]},{"id":"lindt-2025-tokyo-style","d":"2025-12-16","k":"限量","region":"國外","who":"瑞士蓮全球旅遊零售（GTR Magazine、Moodie Davitt Report 報導）","t":"瑞士蓮東京風抹茶草莓：歐洲機場限量首發","body":"瑞士蓮在杜拜風之後推出「Tokyo Style 東京風」抹茶草莓白巧克力，2025/12/4–5 先在蘇黎世、日內瓦、法蘭克福機場首發，第一波是 300 片手工、逐片編號的限量版。成分是瑞士蓮白巧克力、茶名（Chamei Minami）儀式級抹茶、草莓塊和日式烘烤玄米；之後 2 月再到新加坡樟宜、巴黎戴高樂機場。","note":"本店有東京風抹茶草莓；首發的 300 片手工編號版與一般 145g 片裝不同，本店是一般版（以包裝為準）。","say":"這是瑞士蓮繼杜拜巧克力之後的新口味，白巧克力加抹茶、草莓和烤玄米，脆脆的。","pitch":"喜歡杜拜風的客人加推東京風，兩片一起當伴手禮；不愛太甜的改推杜拜風黑巧。","src":"GTR Magazine 2025-12-16；Moodie Davitt Report","u":"https://www.gtrmag.com/blog/lindt-sprungli-debuts-tokyo-style-chocolade---matcha-strawberry-across-key-european-airport-hubs","subj":"東京風抹茶草莓白巧克力；本店有 145g 片裝","praise":"Peter Zehnder：抹茶熱潮已變成「對正宗、高級風味的真正渴望」；德國免稅商 Heinemann 採購主管 Christina Werner：這片巧克力是「旅客的一大亮點」。","hit":{"c2732713001300":"新聞主角：東京風抹茶草莓，白巧克力＋儀式級抹茶＋草莓塊＋烘烤玄米，145g（後續報導）。"},"th":"../chocolatewiki/p/cb/c2732713001300.webp","ids":["c2732713001300","c2732713001250"]},{"id":"suntory-2025-umeshu-sakura","d":"2025-12-16","k":"限量","region":"國外","who":"三得利／グルメ Watch","t":"三得利山崎貯藏梅酒出「櫻花桶」限定版","body":"三得利宣布推出〈山崎蒸溜所貯蔵梅酒〉リッチアンバー桜樽ブレンド，把梅酒放進山崎蒸餾所熟成過威士忌的櫻木桶貯藏，再調入麥芽威士忌。18%、750ml，2026 年 2 月 10 日日本數量限定發售，日本參考價約 7,000 日圓（未稅）。","note":"本店是 Rich Amber 焙煎樽（20%）；新聞是 2026 年日本限定的櫻木桶版（18%）。","say":"三得利這款梅酒是放在山崎蒸餾所威士忌桶裡熟成的，日本今年還出了櫻花桶限定版。","pitch":"喜歡威士忌的客人推 Rich Amber 焙煎樽梅酒，跟一般梅酒比更有桶香。","src":"グルメ Watch（Impress）2025-12-16","u":"https://gourmet.watch.impress.co.jp/docs/news/2071792.html","imgSrc":"グルメ Watch","subj":"Rich Amber 櫻樽 Blend（本店沒有；本店有同系列 Rich Amber 焙煎樽）","praise":"新聞介紹：梅酒的芳醇加上櫻花的華麗香氣與威士忌的厚實口感，喝起來較濃郁。","hit":{"suntory-umeshu-richamber":"同系列：同樣是〈山崎蒸溜所貯蔵梅酒〉Rich Amber，新版改用櫻木桶；本店是焙煎樽版。"},"img":"img/buzz/suntory-2025-umeshu-sakura.webp","ids":["suntory-umeshu-richamber"]},{"id":"glenfarclas-2025-105-10y","d":"2025-12-15","k":"限量","region":"國內","who":"隼昌公司（格蘭花格台灣總代理）／工商時報","t":"格蘭花格 105 系列 10 年台灣限定發行","body":"格蘭花格 105 系列推出 10 年台灣限定版：60%、Oloroso 雪莉桶熟成 10 年，全球 1,400 瓶全部在台灣販售，建議售價 NT$3,200，2025 年聖誕前上市。報導介紹 105 的由來：1968 年第四代 George S. Grant 為聖誕禮物挑雪莉桶裝出 60% 原酒，成為品牌最有代表性的系列；2024 年台灣也推過 105 系列 16 年。","fame":"105：指英制酒度 105 proof（約 60%），是格蘭花格最知名的原桶強度系列。","note":"本店有原版 105（60%、1L）；新聞的 10 年台灣限定版本店沒有。","say":"105 是格蘭花格的招牌原酒，60% 雪莉桶，最近還出了 10 年台灣限定，可見有多受歡迎。","pitch":"入門原酒推 105 1L（價位親民）；要年份感與收藏推昇恆昌新年典藏單桶。","src":"工商時報 2025/12/15","u":"https://www.ctee.com.tw/news/20251215700880-431207","imgSrc":"工商時報","subj":"105 系列 10 年台灣限定（本店沒有）；本店有原版 105 原酒 1L","praise":"報導說 10 年版保留 60% 力道，橡木更柔和、雪莉甜感更多，對比原版 105 的明亮直接；圖說品飲有木質、焦糖、咖啡、果乾與淡淡煙燻。","hit":{"glenfarclas":"同系列：新聞介紹 105 系列由來（1968 年聖誕、60%），本店賣的是原版 105 原酒。"},"img":"img/buzz/glenfarclas-2025-105-10y.webp","ids":["glenfarclas","glenfarclas-ny-horse-2002","glenfarclas-2"]},{"id":"highlandpark-2025-csheather","d":"2025-12-12","k":"新品","region":"國內","who":"台灣愛丁頓洋酒（工商時報）","t":"高原騎士原桶強度系列首發「石楠花」","body":"高原騎士推出全新原桶強度系列第一款 Cask Strength: Heather 石楠花，用首次填充的歐洲與美國雪莉橡木桶，麥芽 100% 用石楠花泥煤煙燻，原桶強度 63.6%，台灣建議售價 3,210 元。發表時正逢首席釀酒師世代交替，由新任首席釀酒師 Marc Watson 介紹。","fame":"這支後來進入 Whisky Advocate 2026 年度 Top 20（第 14 名，網站另有一則排名話題）。","note":"本店沒有石楠花原桶；本店高原騎士有 12、14 蒼狼、16 雄鷹、18、21 年與台灣限定單桶 No.1（19 年 64.4%，也是高酒精度）。","say":"高原騎士有自己的石楠花泥煤，煙燻是花蜜香、不是藥水味；喜歡高酒精度的可以看我們的台灣限定單桶。","pitch":"入門推 12 年；想要煙燻更明顯推 18 年；喜歡原桶強度的推台灣限定單桶 No.1（64.4%）。","src":"工商時報 2025-12-12","u":"https://www.ctee.com.tw/news/20251212700985-431207","imgSrc":"工商時報","subj":"高原騎士 Cask Strength Heather，本店沒有。","praise":"代理商說高原騎士是「唯一擁有當地石楠花泥煤開採權的威士忌酒廠」；Marc Watson 說石楠花泥煤「香氣細膩內斂，能為酒體帶來深邃風味」。官方品飲：篝火煙燻、香草莢、白蘭地奶油，入口棉花糖般的甜、夏威夷果、胡椒。","img":"img/buzz/highlandpark-2025-csheather.webp","ids":["highlandpark-12y-2","highlandpark-18y-2","hp-taiwan-selection-no1","highlandpark-14y-2"]},{"id":"wwa-2026-blended","d":"2025-12-11","k 」，強調用在地物產展現風土多元性。","hit":{"kiwami-craft-06l":"本店禮盒三瓶之一就是極 CRAFT 蒔香琴酒（瓶標 57%）；報導介紹它用雲林香菜、紫蘇、當歸。"},"img":"img/buzz/ttl-2025-craftgin.webp","ids":["kiwami-craft-06l"]},{"id":"mortlach-2025-neverbound01","d":"2025-11-21","k":"新品","region":"國外","who":"帝亞吉歐 × 慕赫","t":"慕赫 Neverbound 無界系列第一章上市","body":"慕赫推出每年一款的新系列 Neverbound（無界），不走年份路線、改以風味強度為主，每一章用不同工藝與桶型。第一章是無年份、50.8%，先在美國橡木再填桶熟成，再用干邑區法國橡木桶（木材自然風乾最多四年）過桶，在全球旅遊零售與香港、澳門、馬來西亞、韓國、台灣、越南上市，約 120 美元。","fame":"Dr Craig Wilson：帝亞吉歐首席調酒師，負責這個系列。","note":"本店沒有第一章，有第二章 16 年「重生」。","say":"慕赫的無界系列每年出一章，每章換一種桶，第一章是法國干邑橡木桶，我們這支第二章是六種雪莉桶的 16 年。","pitch":"想認識慕赫肉感先推 16 年；喜歡雪莉推無界第二章 16 年；送禮推 20 年旅人限定。","src":"drinks intel 2025-11-21；The Rakyat Post 2026-05-16","u":"https://drinks-intel.com/news/this-weeks-new-spirits-launches-17-21-november-2025/","imgSrc":"The Rakyat Post","subj":"Neverbound 第一章；本店有的是第二章「重生」16 年六種雪莉桶","praise":"第一章官方風味：紅色水果帶醬油與煙燻肉的鹹香，入口先是紅糖再轉成肉感，尾韻辛香鹹鮮。","hit":{"mortlach-16y-nb02":"同系列：本店這支是 Neverbound 第二章；新聞介紹的是第一章與整個系列「每年一款、每章不同桶型」的概念。"},"img":"img/buzz/mortlach-2025-neverbound01.webp","ids":["mortlach-16y-nb02","mortlach-16y","mortlach-20y-te","mortlach-14y-te"]},{"id":"macallan-2025-pairing-yeh","d":"2025-11-19","k":"新聞","region":"國內","who":"台灣愛丁頓（工商時報報導）","t":"麥卡倫 × 葉怡蘭《新餐酒時代》：各系列搭什麼菜","body":"麥卡倫《為時代 創新味》系列活動第四波《新餐酒時代》，找飲食作家葉怡蘭談餐酒館文化。報導列出搭餐建議：經典雪莉桶（100% 歐洲橡木）配燉煮、燒烤、煙燻料理；雙雪莉桶（美國＋歐洲橡木）配蔬菜、海鮮、沙拉、冷盤；春宴系列 First Light 配海鮮、番茄料理、飯麵；並建議純飲、加冰、Highball 都可以。","fame":"葉怡蘭：台灣飲食作家（報導介紹）","note":"官方代理商的搭餐建議，可直接用在櫃檯話術","say":"經典雪莉桶配紅燒、烤肉；雙雪莉桶比較清爽，配海鮮、沙拉都很好。","pitch":"客人說要配年菜／燒烤→經典雪莉桶 12 年；說配海鮮或喜歡清爽→雙雪莉桶 12／15 年；送禮再往 18 年推。","src":"工商時報 2025/11/19","u":"https://www.ctee.com.tw/news/20251119701228-431207","imgSrc":"工商時報","subj":"經典雪莉桶系列、雙雪莉桶系列（本店都有）；春宴 First Light 本店沒有，本店有同系列最終章 The Finale","praise":"報導稱麥卡倫是唯一擁有自家雪莉酒莊的品牌；活動主張「在講究中尋找餘裕，在簡約中品味豐盈」","hit":{"macallan-12y-dc":"雙雪莉桶系列被建議搭蔬菜、海鮮、沙拉、冷盤"},"img":"img/buzz/macallan-2025-pairing-yeh.webp","ids":["macallan-12y-dc","macallan-15y-dc","macallan-18y-dc","macallan-anoe-finale"]},{"id":"lin a、Fino、Palo Cortado 三種雪莉桶），以及原有的 An Cidhe（原名 An Cladach，雪莉桶＋波本桶）和泥煤款 Cruach Mhòna（雪莉桶＋波本桶）。","note":"本店有泥炭磚、海岸兩款（海岸新包裝改名 An Cidhe，以酒標為準）；新品 13 年 Bàgh Garbh、Trì Seudan 本店沒有。機場限定 Eirigh Na Greine 報導沒提到。","say":"布納哈本這條免稅線全部 50% 不冷凝過濾，泥炭磚是裡面賣最好的，海岸這支新包裝改叫 An Cidhe。","pitch":"不吃煙推海岸（雪莉果乾）；想試泥煤推泥炭磚；收藏推 40 年。","src":"Moodie Davitt Report 2025-10-20","u":"https://moodiedavittreport.com/the-uncharted-coast-bunnahabhain-unveils-travel-retail-exclusive-collection-amid-focus-on-scotch-whisky-growth/","imgSrc":"Moodie Davitt Report","subj":"布納哈本 The Uncharted Coast（本店有其中兩款：海岸 An Cladach／An Cidhe、泥炭磚 Cruach-Mhòna）","praise":"報導寫 Cruach Mhòna 是這條線在免稅通路賣得最好的品項；首席調和師 Julieann Fernandez 說系列反映全球威士忌愛好者越來越高的需求。","hit":{"bunnahabhain-stiuireadair":"本店「海岸 An Cladach」在新系列改名 An Cidhe，50%、雪莉桶＋波本桶。","bunnahabhain-toiteach":"本店「泥炭磚 Cruach-Mhòna」是新系列的泥煤款，報導說是免稅通路賣最好的品項。"},"img":"img/buzz/bunnahabhain-2025-uncharted-coast.webp","ids":["bunnahabhain-toiteach","bunnahabhain-stiuireadair","bunnahabhain","bunnahabhain-40y"]},{"id":"cloudybay-2025-sb40","d":"2025-10-17","k":"新品","region":"國外","who":"雲霧之灣 Cloudy Bay","t":"雲霧之灣 40 週年：2025 白蘇維濃新年份上市","body":"雲霧之灣 1985 年在紐西蘭馬爾堡推出第一個年份，2025 年 10 月以 Sauvignon Blanc 2025 慶祝 40 週年。酒廠說 2025 生長季比平常溫暖乾燥，雖然有六週多雲天。美國零售約 33 美元。","note":"本店有 2025 年份白蘇維濃。","say":"這是雲霧之灣 40 週年的年份，2025 年比較暖、比較乾，喝起來有桃子、青檸跟一點海鹽感。","pitch":"入門推白蘇維濃 2025；同品種想再升級推 Te Koko；白酒想要圓潤推夏多內；紅酒推馬爾堡黑皮諾，頂級推 Te Wāhi。","src":"Bev Info Group 2025-10-17；88 Bamboo 2025-11-01","u":"https://bevinfogroup.com/2025/10/17/cloudy-bay-2025-sauvignon-blanc-vintage/","imgSrc":"Bev Info Group","subj":"雲霧之灣白蘇維濃 2025（本店有）","praise":"官方風味：水蜜桃、接骨木花、泰國青檸（makrut lime）、檸檬；入口檸檬凝乳、油桃、海鹽、沙丘草。技術總監 Jim White 說它代表「雲霧之灣一直以來的探索精神」。","hit":{"cb-sv":"新聞介紹的就是 2025 年份白蘇維濃：40 週年年份、溫暖乾燥的生長季、官方風味。"},"img":"img/buzz/cloudybay-2025-sb40.webp","ids":["cb-sv","cloudy-bay-te-koko","cb-chardonnay","cloudy-bay-pinot-noir","cloudy-bay-te-wahi-2021"]},{"id":"glenlivet-2025-jamaica","d":"2025-10-15","k":"新品","region":"國外","who":"Chivas Brothers（保樂力加）官方新聞","t":"格蘭利威 12 年牙買加版：牙買加蘭姆桶過桶","body":"格蘭利威在美國推出 12 年 Jamaica Edition「Treasure Beach」，用裝過牙買加蘭姆酒的桶過桶，官方風味椰子、鳳梨、焦糖，美國建議售價 54.99 美元，只在美國指定通路販售。官方新聞稿說這是新系列「Beyond Speyside 超越斯佩賽」的第一款。","note":"新聞款本店沒有；本店 13 年熱帶蘭姆桶是不同酒款（2023 年台灣免稅獨賣）。","say":"格蘭利威最近在美國出了牙買加蘭姆桶的 12 年，台灣免稅這邊有我們自己的 13 年熱帶蘭姆桶，一樣是熱帶水果甜感。","pitch":"喜歡熱帶水果、甜一點的客人直接推 13 年熱帶蘭姆桶。","src":"Chivas Brothers 2025-10-15","u":"https://www.chivasbrothers.com/2025/10/the-glenlivet-embarks-on-a-tropical-adventure-with-the-launch-of-its-12-year-old-jamaica-edition-treasure-beach/","subj":"12 年牙買加版（美國限定，本店沒有）；本店有同樣走蘭姆桶路線的 13 年熱帶蘭姆桶（台灣免稅獨賣）","praise":"桶藝專家 Kevin Balmforth 稱這款代表品牌持續創新、帶來新的風味體驗。","th":"img/kbw/glenlivet-13y-rum.webp","ids":["glenlivet-13y-rum"]},{"id":"dassai-2025-space","d":"2025-10-09","k":"新聞","region":"國外","who":"旭酒造 × 三菱重工（Impress Watch）","t":"獺祭上太空：在國際太空站釀清酒","body":"獺祭與三菱重工宣布在國際太空站日本實驗艙「希望號」進行清酒釀造實驗，酒醪搭 HTV-X 補給船上太空，在相當於月球的 1/6 重力下發酵約兩週，冷凍後送回地球，壓榨後一半寄給購買者、一半做研究。這是「獺祭 MOON 計畫」第一步，目標是未來在月球蓋酒藏。2026 年 5 月 PR TIMES 稿件提到模擬月球重力的發酵實證實驗已完成。","note":"本店有獺祭 39、23、遠心分離、早田、新生、超越；新聞講的是品牌專案，沒有點名哪一支。","say":"獺祭真的把清酒送上國際太空站去發酵，想有一天在月球上蓋酒廠。","pitch":"入門推三割九分；主推二割三分（IWC 金牌）；送禮最高級推超越，喜歡新鮮感推早田或遠心分離。","src":"Impress Watch 2025-10-09；マイナビ農業（PR TIMES）2026-05-31","u":"https://www.watch.impress.co.jp/docs/news/2053859.html","imgSrc":"Impress Watch","subj":"獺祭品牌（宇宙釀造專案），不是特定一支酒。","praise":"新聞強調這是在月球重力環境下的釀酒實驗，目的是提升未來月面生活品質。","img":"img/buzz/dassai-2025-space.webp","ids":["dassai-072l-2","dassai-072l-3","dassai-2","dassai","dassai-072l","dassai-dassai-072l"]},{"id":"hennessy-2025-lebron","d":"2025-10-08","k":"聯名","region":"國外","who":"NBA 球星 LeBron James","t":"軒尼詩 V.S.O.P × LeBron James 限量瓶「The Second Decision」","body":"LeBron James 預告「第二個決定」，大家以為他要退休，結果公布的是和軒尼詩的合作：V.S.O.P 限量瓶，鮮橙色瓶身＋他招牌的「加冕」姿勢，向 2010 年《The Decision》記者會致敬。","fame":"LeBron James 是 NBA 歷史得分王，4 座總冠軍。","note":"本店有軒尼詩 V.S.O.P 1L 常規款，限量瓶沒有。","say":"「LeBron 那款是 V.S.O.P 換成橘色限量瓶，裡面的酒跟我們這支 V.S.O.P 一樣，而且這支是 1 公升。」","pitch":"先推 V.S.O.P 1L（同一支酒、容量更大）；預算高往上推 XO。","src":"LVMH ，2006 年與妻子創立 Morlet Family Vineyards（依酒莊官網）。","note":"本店有 Newton 未過濾夏多內；新業主計畫以紅酒為主，夏多內之後是否續產新聞沒說，本店架上是舊業主時期的年份（以酒標為準）。","say":"Newton 是納帕老牌酒莊，這支未過濾夏多內是它最有名的白酒，2025 年酒莊換了在地新業主。","pitch":"喜歡飽滿白酒、配海鮮奶油料理的客人主推這支；講「不過濾，保留更多風味」最好懂。","src":"Wine Industry Advisor 2025-09-05；Newton Vineyard 官網部落格","u":"https://wineindustryadvisor.com/2025/09/05/newton-vineyard-announces-new-ownership-embarking-on-a-locally-led-revival/","subj":"Newton Vineyard 酒莊（本店有 Newton 未過濾夏多內）","praise":"Nick Livanos：「Newton 一直是關於人與這片土地」；官網說 Unfiltered Chardonnay 是「最能代表酒莊的酒款之一」。","hit":{"newton-unfiltered-chardonnay":"酒莊官網說回任的釀酒師 Luc Morlet 當年就是打造 Unfiltered Chardonnay 的人，這款是 Newton 的代表作。"},"th":"img/kbw/newton-unfiltered-chardonnay.webp","ids":["newton-unfiltered-chardonnay"]},{"id":"hennessy-2025-paradis-moment","d":"2025-09-04","k":"新聞","region":"國外","who":"酩悅軒尼詩旅遊零售／Moodie Davitt Report","t":"軒尼詩百樂廷免稅店貴賓品飲體驗","body":"酩悅軒尼詩旅遊零售推出只限受邀貴賓的百樂廷（Paradis）品飲體驗：用手工橡木「珍奇櫃」箱子，以刻有軒尼詩手臂持斧標誌的鑰匙打開，裡面有百樂廷、銅製蒸餾器模型、葡萄藤插畫、生命之水樣品、酒桶木與香氣小冊。2024 年 10 月在海口免稅城 House of Hennessy 首發，之後推到三亞、澳門、香港、巴黎、杜拜。","note":"本店有百樂廷三種容量；這個品飲體驗台灣沒有列在推出地點。","say":"百樂廷在海南、澳門的免稅店是要預約的貴賓品飲，我們這裡直接買得到，還有 50ml 小瓶可以先試。","pitch":"想先試推百樂廷 50ml；送禮主推 0.7L；只想要 X.O 等級推 X.O 1L。","src":"Moodie Davitt Report 2025/09/04","u":"https://moodiedavittreport.com/the-privileged-moment-moet-hennessy-unveils-ultra-personalised-luxury-experience-for-hennessy-paradis/","imgSrc":"Moodie Davitt Report","subj":"軒尼詩百樂廷（本店有 0.05L、0.35L、0.7L）","praise":"報導強調百樂廷招牌的「異國水果與花香」；品牌說這個體驗「兼具儀式感、情感與稀有」。","hit":{"hennessy-paradis-hennessy-07l":"新聞以百樂廷為主角，介紹它的異國水果與花香風格。"},"img":"img/buzz/hennessy-2025-paradis-moment.webp","ids":["hennessy-paradis-hennessy-07l","hennessy-paradis-hennessy-035l","hennessy-paradis-hennessy-005l","hennessy-07l","hennessy-paradis-bernardaud-1l"]},{"id":"octomore-2025-series16","d":"2025-09-02","k":"新品","region":"國外","who":"布赫拉迪酒廠（新聞稿）","t":"奧特摩第 16 代 16.1／16.2／16.3","body":"布赫拉迪每年推出一代奧特摩，2025 年 9 月 2 日發表第 16 代。16.1 用蘇格蘭本土 Concerto 大麥、泥煤值 101.4ppm，首次填充波本桶 5 年、59.3%；16.2 同一批原酒，Oloroso 與波爾多桶熟成後再進馬德拉和葡萄牙 Moscatel 桶，58.1%；16.3 大麥只來自奧特摩農場 Church Field，189.5ppm、61.6%。","fame":"奧特摩被稱為世界上泥煤值最高的威士忌系列，官方口號是「不可能的方程式」：年輕、超重泥煤、接近原桶強度。","note":"本店有 16.1、16.2，也有上一代 15.1；沒有 16.3。","say":"奧特摩是世界上泥煤最重的系列之一，每年出一代；16.1 是最純的波本桶版，16.2 多了葡萄酒桶的甜。","pitch":"怕煙燻的先試經典萊迪（無泥煤）；想入門煙燻推波夏 10 年；重度煙燻迷推奧特摩 16.1，想要甜一點的推 16.2。","src":"布赫拉迪新聞稿（PR Newswire）2025-09-02","u":"https://www.streetinsider.com/PRNewswire/Bruichladdich+Distillery+Unveils+Octomore+Series+16/25282264.html","subj":"奧特摩 16.1、16.2、16.3；本店有 16.1 與 16.2。","praise":"首席調酒師 Adam Hannett：「奧特摩存在就是為了挑釁和挑戰。」新聞稿說 16.2 的桶型組合是奧特摩第一次。官方風味：16.1 鹹焦糖、蜜瓜、杏桃、巧克力、椰子；16.2 焦糖、烤堅果、果乾包在甜煙燻裡。","hit":{"octomore":"新聞介紹的 16.1 就是這支：101.4ppm、首次填充波本桶 5 年、59.3%。","octomore-2":"新聞介紹的 16.2 就是這支：Oloroso＋波爾多桶，再進馬德拉與 Moscatel 桶，58.1%，官方說這組桶是奧特摩第一次。"},"th":"p/cut/2ef777ba202c.webp","ids":["octomore","octomore-2","octomore-151","portcharlotte-10y","classicladdie"]},{"id":"dalmore-2025-portfolio-2","d":"2025-09-01","k":"限量","region":"國外","who":"懷特馬凱 Whyte & Mackay（Moodie Davitt 報導）","t":"大摩 Portfolio 系列第二年三款紅酒桶版首賣","body":"大摩 The Portfolio Series 2025 年（系列第二年）三款無年份、紅酒桶過桶的單一麥芽，9 月 1 日起在新加坡樟宜機場 Lotte Duty Free 獨家搶先一個月販售，10 月起擴到全球主要機場。No.1 波爾多酒桶 46.8%、3,595 瓶；No.2 教皇新堡酒桶 46%、1,596 瓶；No.3 波爾多卡本內蘇維濃酒桶 49.7%、1,014 瓶；皆非冷凝過濾、自然酒色，包裝每年和 V&A Dundee 合作重新設計，2025 年由平面藝術家 Gabriella Marcella 設計。","note":"本店三年份 Portfolio 都有（系列 1、2、3）；這則是第二年（2025）的發表。","say":"Portfolio 是大摩每年出一套、用不同紅酒桶過桶的限量款，2025 這套最少的一款全球只有一千多瓶。","pitch":"喜歡紅酒桶果味的客人：先試 No.1 波爾多桶，要稀有度推 No.3 卡本內桶；想集一整套就三年份一起介紹。","src":"Moodie Davitt Report（2025/9 樟宜機場預售報導）","u":"https://moodiedavittreport.com/craft-and-creativity-the-dalmore-pre-launches-the-portfolio-series-2025-with-lotte-duty-free-at-singapore-changi-airport/","subj":"Portfolio 系列 2025 年三款——本店有系列 2-1、2-2、2-3（依品名推定即 2025 年版，待核對酒標）","praise":"報導強調三款都是紅酒桶過桶、限量、非冷凝過濾與自然酒色，並稱是樟宜機場「全球第一」搶先販售。","hit":{"dalmore-portfolio":"系列 2-1 應即 2025 No.1 波爾多酒桶 46.8%、3,595 瓶（以酒標核對）","dalmore-portfolio-2":"系列 2-2 應即 2025 No.2 教皇新堡酒桶 46%、1,596 瓶（以酒標 y-news/jura-launches-12-year-old-unveils-brand-refresh/","imgSrc":"The Whiskey Wash","subj":"Islanders Series 機場四款（本店有 White Oak、13 年 1L、16 年、19 年）","praise":"品牌主管 Claire Blackadder 說「客人告訴我們，他們比 10 年更愛 12 年」，也說「不是每個人都是威士忌專家，大家最想知道的是喝起來什麼味道」；研究發現約三分之二想買威士忌的人因為不知道怎麼選而空手離開。","hit":{"jura-white":"新聞點名 White Oak Cask 是機場 Islanders Series 四款之一（新包裝、風味刻度）。","jura-13y-1l":"新聞點名 13 年是機場 Islanders Series 四款之一。","jura-16y":"新聞點名 16 年是機場 Islanders Series 四款之一。","jura-19y":"新聞點名 19 年是機場 Islanders Series 四款之一。"},"img":"img/buzz/jura-2025-rebrand.webp","ids":["jura-white","jura-13y-1l","jura-16y","jura-19y","jura-12y-bay","jura-21y"]},{"id":"chupachups-2026-sour-mega","d":"2025-08-29","k":"新品","region":"國外","who":"Perfetti Van Melle／GTR Magazine","t":"加倍佳 2026 新品：酸味巨無霸棒棒糖","body":"Perfetti Van Melle 在坎城 TFWA 展前公布 2026 旅遊零售新品：Sour Mega Chupa Chups 酸味巨無霸棒棒糖（酸草莓、酸蘋果、酸檸檬），並說酸味棒棒糖袋賣得很好；Crazy Plane 禮品則換新配色、減少盒子塑膠。","note":"本店有酸味巨無霸 180g 與原味巨無霸。","say":"酸味巨無霸是加倍佳的新品，裡面是酸草莓、酸蘋果、酸檸檬。","pitch":"愛酸的推酸味巨無霸；送小朋友推原味巨無霸。","src":"GTR Magazine 2025-08-29","u":"https://www.gtrmag.com/blog/perfetti-van-melle-to-showcase-chupa-chups-mentos-and-fruit-tella-npds-at-cannes","subj":"Sour Mega Chupa Chups（本店有 CC MEGA CHUPS SOUR 180G）","praise":"新聞說酸味棒棒糖袋是成功的產品，因此延伸出酸味巨無霸。","hit":{"c2734708100140":"新聞介紹的 2026 新品 Sour Mega Chupa Chups：酸草莓、酸蘋果、酸檸檬三種口味。"},"th":"../chocolatewiki/p/cut/2c9fbe997d43.webp","ids":["c2734708100140","c2731702000190","c2734708100120"]},{"id":"aberlour-2025-taoyuan-boutique","d":"2025-08-27","k":"新聞","region":"國內","who":"保樂力加全球旅遊零售 × 昇恆昌免稅店","t":"全球第一家亞伯樂專門店在桃園機場開幕","body":"保樂力加全球旅遊零售和昇恆昌在桃園機場第一航廈出境 YP 區開了全球第一家亞伯樂專門店（350 平方英尺），8 月 27 日舞獅剪綵。店內有許願樹、印有台灣日常圖案的印章，可試喝亞伯樂配鳳梨酥。主打 2025 免稅專屬三款，以及 15 年、17 年 Small Batch（17 年限量 300 瓶），每季會有新品。","note":"報導沒寫年份，依內文「2025 免稅專屬系列」與 6 月台北機場活動判斷是 2025 年。專門店在昇恆昌，本店就是這個通路。","say":"全世界第一家亞伯樂專門店就開在桃園機場，這幾支免稅專屬和 Small Batch 我們這邊都買得到。","pitch":"客人問亞伯樂時先講「全球第一家專門店在桃園」，入門 13 年、主推 16 年、送禮或收藏推 17 年 Small Batch（限量 300 瓶）。","src":"Moodie Davitt Report；TRBusiness（2025 terofmalt.com/blog/post/ardbeg-the-beithirs-tale-concludes-anthology-series","subj":"雅柏 Anthology 15 年 The Beithir's Tale（本店有）","praise":"報導寫它拿到 2025 IWSC 98 分 Gold Outstanding 與 ISC 金牌；首席調和師 Gillian Macdonald 說香草與煙燻奶油的味道「像蛇一樣滑過」；官方筆記：糖蜜、木焦油、煙燻香草、烤蘋果、葡萄乾，尾韻香草與煙燻奶油。","hit":{"ardbeg-anthology-beithir":"新聞主角就是本款：傳說系列最終章、設計師波本桶、46%，報導提到 IWSC 98 分。"},"th":"img/kbw/ardbeg-anthology-beithir.webp","ids":["ardbeg-anthology-beithir","ardbeg-10y","ardbeg-uigeadail"]},{"id":"yushan-2025-8y-sunyatsen","d":"2025-08-13","k":"限量","region":"國內","who":"台灣菸酒／工商時報","t":"玉山高粱八年甕藏國父紀念款限量預購","body":"台酒為紀念國父逝世一百週年推出「玉山高粱酒八年甕藏」，酒瓶外型以國父紀念館為靈感，傳統固態發酵、固態蒸餾，取酒頭勾兌、熟陳八年以上。2025 年 8 月 18 日至 24 日在全台 7-ELEVEN ibon 預購，預購價 3,000 元。","fame":"國父紀念館由建築師王大閎設計。","note":"本店有玉山八年陳高禮盒（潛龍爭輝），紀念款本店沒有。","say":"台酒的陳高是固態發酵、固態蒸餾，去年還出了國父紀念館造型的八年甕藏。","pitch":"八年陳高送禮推潛龍爭輝禮盒；預算低推六年；頂級推十年火神釀。","src":"工商時報 2025-08-13（記者黃志懋）","u":"https://www.ctee.com.tw/news/20250813701079-431207","subj":"玉山高粱酒八年甕藏國父紀念款（本店沒有；本店有玉山八年陳高禮盒）","praise":"新聞引用王大閎的話：紀念國父的建築「應該創新，不應該俗氣華麗，要莊重且有親和力」，酒瓶就以這座建築為設計靈感。","th":"img/kbw/yushan.webp","ids":["yushan","yushan-6y-06l","yushan-10y-huoshen"]},{"id":"yamazaki-2025-25mizunara","d":"2025-08-07","k":"新品","region":"國外","who":"三得利 House of Suntory","t":"山崎 25 年水楢桶：最老的全水楢熟成山崎","body":"三得利發表山崎 25 年 Mizunara，全程在日本水楢桶熟成，是山崎目前年份最老的全水楢版本，48%，美國建議售價 7,500 美元。外盒用日本傳統不用釘子的榫接方式組成，符合日本洋酒酒造組合「日本威士忌」標準。","note":"本店有一般山崎 25 年，不是這支水楢桶版；兩支桶型不同，不要混淆。","say":"山崎去年出了全水楢桶的 25 年，水楢是日本自己的橡木，香氣像檀香、草藥，這也是山崎最有代表性的桶。","pitch":"入門推 Distiller's Reserve；主推 12 年；送禮推 18 年；頂級收藏推 25 年。","src":"三得利全球烈酒新聞稿 2025-08-07；BevNET 2025-08-11","u":"https://www.suntoryglobalspirits.com/news/house-suntory-unveils-its-rarest-mizunara-aged-expression-yet-yamazaki-25-years-old-mizunara","imgSrc":"三得利全球烈酒","subj":"山崎 25 年水楢桶（本店沒有；本店有山崎 25 年）","praise":"官方風味：杏桃果醬甜感、可可拿鐵、肉豆蔻與小荳蔻；入口苦甜帶香料、柳橙與奶油感，水楢木帶東方草藥感。","img":"img/buzz/yamazaki-2025-25mizunara.webp","ids":["yamazaki-25y-2","yamazaki-18y-2","yamazaki-12y","yamazaki-2","yamazaki"]},{"id":"armanddebrignac-2025-bdn5","d":"2025-08-05","k":"限量","region":"國外","who":"黑桃王香檳（新聞稿）","t":"黑桃王黑中白 No.5 限量 8,165 瓶","body":"黑桃王推出黑中白第五版 Assemblage No.5，100% 黑皮諾，調和 2014、2015、2016 三個年份，主要來自 Chigny-les-Roses、Verzenay、Verzy 的一級與特級園，加上少量 Aube 產區葡萄，酒渣上熟成 7 年。全球 8,165 瓶，每瓶編號、標示 2024 年 8 月 21 日除渣。先在東京發表，之後擴到其他市場，美國 2026 年初上市。","fame":"黑桃王是 Jay-Z（Shawn Carter）創立／持有的香檳品牌，以金屬鍍色瓶身聞名。","note":"本店有 No.4、No.5，也有 2015 年份黑中白 1.5L。","say":"黑桃王黑中白第五版全球只有八千多瓶、每瓶有編號，全部用黑皮諾，比金瓶更濃郁。","pitch":"入門送禮推璀璨金；懂香檳、要稀有的推黑中白 No.5（有編號）；收藏或宴會推 2015 年份 1.5L。","src":"Wine Industry Advisor（新聞稿）2025-08-05","u":"https://wineindustryadvisor.com/2025/08/05/armand-de-brignac-introduces-blanc-de-noirs-assemblage-no-5/","imgSrc":"Wine Industry Advisor","subj":"黑桃王 黑中白 Assemblage No.5，本店有 750ml。","praise":"新聞稿稱它是黑桃王「最大膽的表現」、「十年磨一劍」。官方品飲：果乾、烤堅果、李子、無花果、黑醋栗，帶芒果、木瓜的熱帶感，時間久了出現卡士達、蜂蜜、橙花、烤咖啡。","hit":{"armanddebrignac-bdn-no5":"新聞主角就是這支：2014／2015／2016 三年份黑皮諾、酒渣熟成 7 年、全球 8,165 瓶編號。","armanddebrignac-bdn-no4":"同系列上一版（No.4）。"},"img":"img/buzz/armanddebrignac-2025-bdn5.webp","ids":["armanddebrignac-bdn-no5","armanddebrignac-bdn-no4","armanddebrignac-bdn-2015","armanddebrignac-075l"]},{"id":"inniskillin-2025-50th","d":"2025-08-05","k":"新聞","region":"國外","who":"Niagara Now；Circle of Wine Writers","t":"冰酒名廠雲嶺 Inniskillin 滿 50 週年","body":"加拿大雲嶺（Inniskillin）1975 年 7 月 31 日取得酒廠執照，2025 年 7 月 31 日在 Brae Burn 酒莊辦 50 週年慶祝會。報導回顧：1984 年第一次成功採收冰酒，1989 年份 Vidal 冰酒在 1991 年法國波爾多 Vinexpo 拿到 Grand Prix d'Honneur（榮譽大獎），讓加拿大冰酒打出名號。母公司 Arterra 總裁說接下來要把雲嶺推進更多國際市場、推出更高階產品。","fame":"創辦人 Donald Ziraldo 與 Karl Kaiser（Kaiser 2017 年過世）；1991 Vinexpo 大獎被視為加拿大冰酒成名的起點。","note":"本店有 Vidal 金標冰酒、Vidal 氣泡冰酒、卡本內弗朗冰酒（375ml）；報導的得獎年份 2022 是否等於本店年份，以酒標為準。","say":"雲嶺是讓加拿大冰酒出名的酒廠，去年剛滿 50 年，Vidal 冰酒就是他們的招牌。","pitch":"第一次買冰酒推 Vidal 金標（招牌、甜而有酸）；要熱鬧開瓶推 Vidal 氣泡冰酒；喜歡紅色果香或送懂酒的推卡本內弗朗冰酒。","src":"Niagara Now 2025-08-05；Circle of Wine Writers 2025-09-30","u":"https://niagaranow.com/news.phtml/inniskillin-celebrates-50-years-with-salute-to-the-past-focus-on-the-future/","subj":"雲嶺品牌 50 週年（ 大師賽 2 大師 4 金","body":"英國 The Spirits Business 主辦的 2025 World Whisky Masters 盲飲評審，OMAR 拿下 2 座 Master（類別最高）與 4 面金牌。Master 是原桶強度新橡木桶 #01160174、15 年原桶強度 PX 雪莉桶「松鶴長年」#22160011；金牌有三桶單一麥芽（離島免稅限定 NO.2）、波本花香（八歌浪限定款）、原桶強度波本桶 #11171121、原桶強度雪莉桶 #23150548。","fame":"World Whisky Masters：英國 The Spirits Business 主辦的盲飲競賽，Master 獎頒給各類別最好的酒。","note":"本店有三桶與原桶波本桶（同系列）；新橡木桶、15 年松鶴長年、波本花香本店沒有。","say":"OMAR 三桶的離島免稅版拿過 2025 世界威士忌大師賽金牌，是台灣自己的單一麥芽。","pitch":"入門推風味原桶系列（柳丁、梅子、葡萄）；主推三桶；喜歡高度數推原桶波本桶；送禮推原桶迷你四入禮盒。","src":"工商時報 2025/08/04","u":"https://www.ctee.com.tw/news/20250804700660-431207","imgSrc":"工商時報","subj":"OMAR 多款得獎（本店有三桶、原桶波本桶同系列）","praise":"台灣菸酒說得獎反映台灣亞熱帶風土；新橡木桶款有香草、香料、焦糖、奶油風味；15 年是南投酒廠最老的威士忌。","hit":{"omar-triple-cask":"同系列：三桶單一麥芽（離島免稅限定 NO.2）拿金牌；本店的三桶是否為 NO.2 以酒標為準。","omar-cs-bourbon":"同系列：原桶強度波本桶 #11171121 拿金牌；原桶是單桶，本店桶號以酒標為準。"},"img":"img/buzz/omar-2025-wwm.webp","ids":["omar-triple-cask","omar-cs-bourbon","omar-cs-df","omar-cs-lychee","omar-0-omar","omar-0-omar-2","omar-0-omar-3"]},{"id":"oreo-2025-changi","d":"2025-08-04","k":"新聞","region":"國外","who":"Mondelez World Travel Retail（TRBusiness 報導）","t":"OREO 免稅旅行款重返新加坡樟宜機場","body":"億滋旅遊零售把 OREO 免稅限定系列帶回新加坡樟宜機場 The Cocoa Trees 店，包括 OREO 鐵罐（Tin Box）、隨手包（Pouch Bag：原味、迷你、金 Golden、巧克力外層 Enrobed、白巧克力外層）與 Cookie Case，之後要推到吉隆坡等亞太機場，搭配陳列、試吃與限定托特包贈品。2025/3 億滋也說亞太免稅布局「進行中」，鐵罐和隨手包是賣得好的規格。","note":"新聞沒有寫重量；本店禮罐 396g、牛奶巧克力 287g、旅行綜合包 274g 是否與樟宜同一版本，以現場包裝為準。","say":"OREO 這種鐵罐和巧克力包是機場免稅才有的旅行規格，新加坡樟宜今年也重新上架，帶小朋友的家庭很愛。","pitch":"送小朋友或辦公室分享推禮罐 396g；自己路上吃推旅行綜合包；喜歡巧克力的推牛奶巧克力包。","src":"TRBusiness 2025-08-04；TRBusiness 2025-03-03","u":"https://www.trbusiness.com/regional-news/asia-pacific/mondelez-wtr-brings-oreo-back-to-singapore-changi-airport/268577","imgSrc":"TRBusiness","subj":"OREO 免稅旅行規格（鐵罐、巧克力外層隨手包）＝本店同類規格；本店有禮罐 396g、牛奶巧克力 287g、旅行綜合包 274g","praise":"億滋全球業務總監：OREO 是「真正的全球經典」；強調這些規格「小巧、好送、好分享」。","hit":{"c2735702000090":"新聞點名免稅限定的 OREO 鐵罐（Tin Box），說它是賣得好的送禮規格；本店是 396g 禮罐。","c2735702000080":"新聞點名 Enrobed（巧克力外層）隨手包；本店是牛奶巧克力 287g。"},"img":"img/buzz/oreo-2025-changi.webp","ids":["c2735702000090","c2735702000080","c2735702000100"]},{"id":"kavalan-2025-peatist","d":"2025-08-01","k":"新品","region":"國內","who":"金車噶瑪蘭／工商時報","t":"噶瑪蘭發表 PEATIST 泥煤探尋者系列","body":"金車噶瑪蘭發表全新「PEATIST 泥煤探尋者」系列，首發 Oloroso 雪莉桶與波本桶兩款泥煤威士忌原酒，定位為常態品項、輕泥煤風格，建議售價各 3,500 元。包裝改用寬肩短瓶、幾何瓶標與米白外盒，外盒山形線條呼應雪山山脈。","note":"本店兩款 PEATIST 都有。","say":"這是噶瑪蘭 2025 年才推出的泥煤系列，輕泥煤，雪莉桶偏果乾巧克力、波本桶偏熱帶水果，兩支可以對照喝。","pitch":"想試煙燻又怕太重的客人推波本桶版；喜歡雪莉桶的推 Oloroso 版；送禮可兩支一起帶。","src":"工商時報 2025-08-01（記者黃志懋）","u":"https://www.ctee.com.tw/news/20250801701546-431207","imgSrc":"工商時報","subj":"PEATIST Oloroso 雪莉桶原酒、PEATIST 波本桶原酒（本店兩款都有）","praise":"雪莉桶款：酒色深邃，煙燻、果乾、堅果香，尾韻巧克力與咖啡；波本桶款：芒果、香蕉、龍眼乾熟果香，椰奶、香草、蜂蜜的柔和甜感。董事長李玉鼎說風味是「沒有終點的探索旅程」。","hit":{"kavalan-peatist-oloroso":"新聞首發款之一：Oloroso 雪莉桶泥煤原酒，介紹煙燻＋果乾堅果、巧克力咖啡尾韻。","kavalan-peatist-bourbon":"新聞首發款之一：波本桶泥煤原酒，介紹熱帶熟果、椰奶香草蜂蜜的甜感。"},"img":"img/buzz/kavalan-2025-peatist.webp","ids":["kavalan-peatist-oloroso","kavalan-peatist-bourbon"]},{"id":"hakushu-2025-story-distillery","d":"2025-07-31","k":"限量","region":"國外","who":"三得利（日本官方抽籤販售；Gourmet Watch 報導）","t":"白州 Story of the Distillery 2025 限定版抽籤販售","body":"三得利官方 2025/7/31 起開放抽籤購買「白州 Story of the Distillery 2025 EDITION」：700ml、43%，兩輪抽籤各 1,000 名，中籤價 ¥16,500。官方說明這支是用在波本桶熟成的白州「煙燻型」麥芽原酒調配而成。","note":"本店沒有這支限定版；新聞說明白州酒廠也做煙燻型麥芽原酒，可以拿來解釋本店白州尾韻那一絲煙燻","say":"白州在日本連限定版都要抽籤才買得到，我們這裡的 12 年、18 年不用抽，直接帶得走。","pitch":"入門推白州無年份（Highball）→ 主推白州 12 年（2026 ISC 金牌）→ 送禮推白州 18 年；客人提到日本搶不到時，用這則新聞說明白州的稀缺。","src":"Gourmet Watch（Impress）2025/07/31","u":"https://gourmet.watch.impress.co.jp/docs/news/2035858.html","imgSrc":"Gourmet Watch（三得利提供）","subj":"白州 Story of the Distillery 2025 EDITION（日本國內限定，本店沒有）；本店有白州無年份、12 年、18 年","praise":"官方品飲：香氣有鳳梨、香草奶油、焙茶；口感輕盈柔和，帶和三盆糖般的甜與淡淡苦味；尾韻是「餘燼般的煙燻」","img":"img/buzz/hakushu-2025-story-distillery.webp","ids":["hakushu-nas","hakushu-12y-2","hakushu-18y"]},{"id":"lin-2025-macallan-new","d":"2025-07-27","k":"YouTuber","region":"國內","who":"YouTuber 執杯大叔 林一峰","t":"林一峰：麥卡倫全新品牌形象（David Carson 新包裝）與雪莉橡木桶供應鏈","body":"說明欄：麥卡倫邁入第三個世紀，請設計師 David Carson 重新設計包裝；影片整理麥卡倫專屬雪莉橡木桶供應鏈：從森林選木、裁切、風乾、手工製桶到雪莉酒潤桶。李奧社長同年 8/6 也介紹經典雪莉桶、雙雪莉桶新包裝。","fame":"執杯大叔 林一峰（YouTube 約 11.5 萬訂閱，台灣資深威士忌作家，常專訪酒廠首席調酒師）。","say":"「麥卡倫 2025 年換了新包裝，酒還是一樣；經典雪莉桶比較厚、雙雪莉桶比較柔和有柑橘。」","pitch":"喜歡濃郁→經典雪莉桶 12／18 年；喜歡柔和→雙雪莉桶 12／15／18 年。","src":"執杯大叔 林一峰 YouTube 2025/07/27；李奧社長 YouTube 2025/08/06","u":"https://www.youtube.com/watch?v=9KxkcHdbopA","imgSrc":"YouTube 影片縮圖","subj":"麥卡倫經典雪莉桶、雙雪莉桶系列新包裝（本店有）","praise":"說明欄：自然酒色、小型蒸餾器、打造最好的橡木桶，「一家酒廠為了打造最頂尖最穩定品質的百年大計」。","hit":{"macallan-18y-2":"經典雪莉桶系列 18 年，同樣換成 David Carson 新包裝。","macallan-12y-dc":"新包裝的「雙雪莉桶系列」12 年。","macallan-15y-dc":"雙雪莉桶系列 15 年。","macallan-18y-dc":"雙雪莉桶系列 18 年。","macallan-12y":"經典雪莉桶 12 年也換成 David Carson 新包裝（紅盒）。"},"img":"img/buzz/lin-2025-macallan-new.webp","ids":["macallan-12y","macallan-18y-2","macallan-12y-dc","macallan-15y-dc","macallan-18y-dc"]},{"id":"penfolds-2025-collection","d":"2025-07-24","k":"新品","region":"國外","who":"奔富（Wine Companion、Decanter 報導）","t":"奔富 2025 Collection：Grange 2021 等 24 款發表","body":"奔富 2025 年度 Collection 共 24 款，來自澳洲、美國、法國、中國四國，8 月 7 日發售。主角 Grange 2021 是 Grange 連續第 70 個年份（1951 年 Max Schubert 做出第一款實驗性紅酒），Decanter 列英國價 £600（AU$1,000／€700）。Decanter 也稱 Bin 389 2023 是「Baby Grange」、值得買。","fame":"Grange 是澳洲最有名的紅酒，奔富首席釀酒師 Peter Gago 在倫敦發表時說：「我們最受推崇的酒有些一開始都是實驗——包括 Grange。」","note":"本店 Grange 2021、Bin 389 2023 是這次 Collection 的年份；本店 Bin 707、Bin 407、Bin 128 是 2022 年份（前一年），這次發表的是 2023。","say":"我們這支 Grange 2021 是奔富連續第 70 個年份，今年 8 月才全球發表。","pitch":"入門推 Bin 28／Bin 128；主推 Bin 389 2023（Baby Grange）；送禮頂級推 Grange 2021。","src":"Wine Companion 2025-07-24；Decanter（2025/9 更新）","u":"https://winecompanion.com.au/articles/news/penfolds-2025-collection","subj":"Grange 2021 ——本店有（penfolds-grange-bin95-2017，品名 2021）；Bin 389 2023 本店有","praise":"Decanter：Bin 389 2023「Baby Grange」值得買、Bin 28 物超所值、Bin 128 2023 是今年成功之作。Wine Companion：Grange 2021 寫下 70 個不間斷年份。","hit":{"penfolds-grange-bin95-2017":"就是 Grange 2021：2025 Collection 主角，連續第 70 個年份，英國價 £600。","penfolds-bin-p -kommt-waehrend-klassische-tafeln-schrumpfen-34091","subj":"Milka × Lotus Biscoff 190g（本店有這一款 190g）","praise":"Mondelēz 稱新規格是「特別大塊」的中間尺寸，希望替停滯的巧克力市場帶來新動能。","hit":{"c2732702111960":"本店 TB-MILKA BISCOFF 190G 就是這波 Milka Extra 190g 新規格的 Lotus Biscoff 口味（2025 年 5 月底德國上架）。"},"th":"../chocolatewiki/p/cb/ob2_c2732702111960.webp","ids":["c2732702111960","c2732702111930","c2732702111920","c2732702111910","c2735702000010"]},{"id":"hemutang-2025-spice-liquor","d":"2025-05-10","k":"新聞","region":"國內","who":"賀木堂（工商時報報導）","t":"賀木堂辛香料酒：芫荽、九層塔入酒","body":"工商時報 2025/5/10 報導，賀木堂的辛香料酒系列再推新品：有凍蒜（蒜頭酒）、薑勁酒之外，加上用彰化北斗香菜蒸餾的「相思芫」與用屏東九層塔葉和梗小批量精餾的「九乘酒」（45 度，500ml），報導說很多酒吧拿來做調酒。","note":"本店有賀木堂「台灣秘藏高粱酒」42 度 0.5L；這則是同品牌的辛香料酒","say":"秘藏高粱是賀木堂做的，這家很有創意，連香菜、九層塔都拿來做酒，高粱本行做得很扎實。","pitch":"想買台灣在地高粱、度數不要太高的客人推秘藏高粱 42 度 0.5L。","src":"工商時報 2025/05/10","u":"https://www.ctee.com.tw/news/20250510700636-431207","imgSrc":"工商時報","subj":"賀木堂辛香料酒（本店沒有）；本店的秘藏高粱 42 度是同一家賀木堂的高粱酒","praise":"報導強調用台灣在地辛香料（北斗香菜、屏東九層塔）蒸餾入酒","img":"img/buzz/hemutang-2025-spice-liquor.webp","ids":["mizang-kaoliang-42"]},{"id":"ardbeg-2025-smokiverse","d":"2025-04-24","k":"限量","region":"國外","who":"雅柏 Ardbeg（The Whiskey Wash 報導）","t":"雅柏 2025 Ardbeg Day 限定 Smokiverse 首支高濃度糖化","body":"2025 年 Ardbeg Day 限定款 Smokiverse，是雅柏第一支用「高濃度糖化（high-gravity mash）」做的威士忌：糖化槽少放水，讓乙酸酯類更濃，帶出熱帶水果味，之後在波本桶熟成。48.3%，英國建議售價 £93，同時紀念雅柏會員（Ardbeg Committee）成立 25 年。","note":"本店有 Smokiverse（48.3%、700ml），也有隔年的 Dolce。","say":"這支是雅柏第一次用少放水的方式糖化，所以煙燻裡有很明顯的熱帶水果、泡泡糖香。","pitch":"喜歡果香的泥煤入門客推 Smokiverse；收藏客兩屆 Ardbeg Day（Smokiverse＋Dolce）一起帶。","src":"The Whiskey Wash 2025-04-24；The Scotsman；Fred Minnick 2025-04-28","u":"https://thewhiskeywash.com/whiskey-new-releases/ardbeg-smokiverse-celebrates-25-years-of-the-ardbeg-committee/","imgSrc":"The Whiskey Wash","subj":"雅柏 Smokiverse 2025 Ardbeg Day 限定版（本店有）","praise":"Dr. Bill Lumsden 說這是「我們做過的第一支高濃度糖化威士忌」；官方筆記：泡泡糖般的果香酯類、熱帶水果煙燻，口感奶油般滑順，帶焦油、茴香、丁香與黑糖甜味。","hit":{"ardbeg-smokiverse":"新聞主角就是本款：首支高濃度糖化、波本桶、48.3%，熱帶水果加煙燻。"},"img":"img/buzz/ardbeg-2025-smokiverse.webp","ids":["ardbeg-smokiverse","ardbeg-dolce","ardbeg-10y"]},{"id":"toblerone-2025-newlook","d":"2025-04-22","k":"新品","region":"國外","who":"Mondelez 全球旅遊零售（TRBusiness 報導）","t":"Toblerone 機場版換新包裝：香檳金色","body":"Mondelez 把 Toblerone 旅遊零售專屬包裝全面改版，2025 年 4 月起在全球機場上架：香檳金色調、簡化背景、更精緻的質感印刷、加上瑞士國旗，盒側放更大更亮的三角巧克力圖。範圍包括 340g 大條、Flavors and Messages 系列、Tiny 迷你系列。","note":"新包裝是旅遊零售專屬（TREX）；門市若新舊包裝並存，請以實品為準","say":"機場的 Toblerone 是專屬包裝，金色盒子加瑞士國旗，外面超市的不一樣。","pitch":"分送推 Tiny 迷你雙包裝；送禮推綜合夾心禮盒；特別禮物推施華洛世奇限量盒。","src":"TRBusiness 2025/04/22","u":"https://www.trbusiness.com/regional-news/international/mondelez-wtr-rolls-out-new-look-travel-retail-exclusive-toblerone-packaging/264768","imgSrc":"TRBusiness","subj":"機場版 Toblerone 新包裝；本店有 Tiny 迷你雙包裝、340g 施華洛世奇限量盒","praise":"Mondelez 旅遊零售品類總監：「Toblerone 是旅遊零售最容易被認出、最受喜愛的品牌之一」","hit":{"c2732702111950":"報導點名 Toblerone Tiny 迷你系列換成機場專屬新包裝"},"img":"img/buzz/toblerone-2025-newlook.webp","ids":["c2732702111950","c2732744100010","c2732702111940"]},{"id":"kkl-2025-time-batch2","d":"2025-04-21","k":"限量","region":"國內","who":"昇恆昌 × 金門酒廠（工商時報報導）","t":"昇恆昌獨賣金酒時光窖藏原酒第二批 6.56、6.61","body":"昇恆昌與金門酒廠推出「金酒時光窖藏原酒」第二批次兩款，昇恆昌免稅通路獨賣：6.56（58.6 度、綠色「新生」、NT$1,950）與 6.61（58.2 度、橘色「豐收」、NT$2,150）。首席調酒師呂宜儒到坑道挑金城廠、金寧廠老酒勾調，含地下酒窖 14–16 年的金城廠老酒，再用超過 56 年與 61 年的陳年酒修飾；包裝的大寫「T」代表台灣與時間。","note":"本店兩款都有，是昇恆昌獨賣款。","say":"這兩支是我們昇恆昌獨賣的金門高粱，用了 56 年、61 年的老酒修飾，喝起來比一般高粱柔順、果香多。","pitch":"喜歡果香推 6.56；喜歡花香、尾韻巧克力推 6.61；預算高送禮升級釀酒大師。","src":"工商時報 2025-04-21","u":"https://www.ctee.com.tw/news/20250421701233-431207","imgSrc":"工商時報","subj":"金酒時光窖藏原酒 6.56、6.61 第二批次（本店兩款都有）","praise":"呂宜儒說第二批「以淡雅柔順的口感，顛覆外界對金門高粱的傳統印象」；6.56 有熱帶水果、哈密瓜、龍眼蜜，6.61 有玫瑰、桂花、白桃，尾韻黑巧克力與焦糖。","hit":{"kkl-06l-6":"新聞介紹的 6.56：58.6 度、綠色新生、熱帶水果與龍眼蜜香，NT$1,950。","kkl-06l-7":"新聞介紹的 6.61：58.2 度、橘色豐收、玫瑰桂花白桃，NT$2,150。"},"img":"img/buzz/kkl-2025-time-batch2.webp","ids":["kkl-06l-6","kkl-06l-7","kkl-master-06l"]},{"id":"frescobaldi-2025-terrenere","d":"2025-04-17","k":"新聞","region":"國外","who":"Marchesi Frescobaldi（Wine Industry Advisor 新聞稿）","t":"花思蝶入股西西里埃特納火山名莊 Terre Nere","body":"花思蝶集團取得西西里埃特納火山酒莊 Tenuta delle Terre Nere 少數股權（比例未公開），兩家主人是 35 年老朋友。新聞稿同時列出花思蝶在托斯卡尼的 9 個酒莊（Pomino、Nipozzano、Perano、Castiglioni、CastelGiocondo、Ammiraglia、Remole、Calimaia、Gorgona），以及 Ornellaia、Masseto、Luce 等其他投資，家族從 1300 年代就存在。","note":"品牌版圖新聞；可用來說明花思蝶家族規模","say":"花思蝶家族做酒七百年，托斯卡尼就有九個酒莊，連 Ornellaia 也是他們家的。","pitch":"同上：Castiglioni 入門→Nipozzano 主推→CastelGiocondo 送禮。","src":"Wine Industry Advisor 2025/04/17","u":"https://wineindustryadvisor.com/2025/04/17/marchesi-frescobaldi-and-tenuta-delle-terre-nere-forge-strategic-alliance/","subj":"品牌新聞；本店有 Nipozzano、CastelGiocondo、Castiglioni、Pomino 的酒","praise":"新聞稿口號「Cultivating Toscana Diversity（耕耘托斯卡尼的多樣性）」","th":"img/kbw/frescobaldi-nipozzano-riserva-2020.webp","ids":["frescobaldi-nipozzano-riserva-2020","frescobaldi-castelgiocondo-2021","tenuta-frescobaldi-di-castiglioni-2021","frescobaldi-pomino-bianco-2022"]},{"id":"storck-2025-travel-retail","d":"2025-04-16","k":"新聞","region":"國外","who":"Storck Travel Retail（GTR Magazine、Moodie Davitt 報導）","t":"Storck 主打 merci、Toffifee、Knoppers 旅行版","body":"Storck 旅遊零售 2025 年在亞太推 merci 可寫祝福的旅行限定盒、Toffifee 古銅色旅行包（200g、400g）、Knoppers 旅行版（15 片獨立包裝）、Werther's Original 海鹽焦糖 140g 夾鏈袋與焦糖爆米花，並在吉隆坡、曼谷、樟宜機場辦活動。9 月坎城 TFWA 展再強調：merci 是全球第四受歡迎的盒裝巧克力、Toffifee 進入全球盒裝巧克力前十（Euromonitor 2025/07）。","note":"本店 Storck 10 項都是旅遊零售常見品；Bendicks、Mamba 文中沒提。","say":"merci 是全球第四受歡迎的盒裝巧克力，Toffifee 也進全球前十，機場版包裝是旅行限定。","pitch":"伴手禮分送推 Knoppers 15 入；送長輩推 merci；小朋友推 Toffifee、Werther's 爆米花。","src":"GTR Magazine 2025-04-16；Moodie Davitt Report（2025 年春、2025 年 9 月 TFWA）","u":"https://moodiedavittreport.com/?p=445625","subj":"Storck 旅遊零售主力——本店有 Knoppers 15 入、merci 250g、Toffifee 200g、Werther's 爆米花等","praise":"報導：merci 全球第四受歡迎盒裝巧克力；Toffifee 全球前十大盒裝巧克力；Werther's「不同於一般糖果或巧克力，適合分享也適合犒賞自己」。","hit":{"c2732707900020":"Knoppers 旅行版就是 15 片獨立包裝。","c2732709200030":"Toffifee 200g 是旅行限定古銅色包裝規格之一，報導說 Toffifee 是全球前十大盒裝巧克力。","c2732709700010":"merci 是全球第四受歡迎盒裝巧克力，旅行限定盒可寫祝福。","c2733709200030":"報導提到 Werther's Original 海鹽焦糖 140g 夾鏈袋與焦糖爆米花（是否就是本店海鹽焦糖爆米花待核對）。"},"th":"../chocolatewiki/https://xsos32-design.github.io/chocolatepromo/img/cut/2732707900020.webp","ids":["c2732707900020","c2732709200030","c2732709700010","c2733709200030","c2733709200010","c2732709200040"]},{"id":"beaucastel-2025-cellar","d":"2025-04-10","k":"新聞","region":"國外","who":"Château de Beaucastel（Decanter 報導）","t":"博卡斯特堡 1,200 萬歐元新酒窖完工","body":"Decanter 2025/4/10 報導，博卡斯特堡花 1,200 萬歐元、從 2018 年 9 月開始的酒窖工程完工，2025/5/21 啟用，2025 年採收開始在新酒窖釀酒。建築由印度 Studio Mumbai 設計（300 件比稿中選出），大半在地下，用屋頂雨水蓄水池加上密斯托拉風自然降溫到 12°C，不耗電；雨水目標供應 95% 用水、屋頂太陽能供應幾乎全年用電，地上牆面用酒莊自己的黏土做夯土牆。","note":"本店有博卡斯特堡教皇新堡紅酒 2013（舊酒窖時期釀的）","say":"博卡斯特堡去年蓋好一座用風跟雨水降溫的地下酒窖，連酒窖都講究自然，酒當然也是。","pitch":"喜歡隆河、波爾多以外選擇的客人主推博卡斯特堡 2013（已進入適飲期的教皇新堡）。","src":"Decanter 2025/04/10","u":"https://www.decanter.com/wine-news/chateau-de-beaucastel-completes-radical-e12m-cellar-project-554101","subj":"博卡斯特堡酒莊（本店有教皇新堡紅酒 2013）","praise":"César Perrin 說「酒不會有任何改變」，目的是更環保、更省能源","th":"img/kbw/chateau-de-beaucastel-chateauneuf-du-pape-2013.webp","ids":["chateau-de-beaucastel-chateauneuf-du-pape-2013"]},{"id":"leo-2025-df-ep1","d":"2025-04-09","k":"YouTuber","region":"國內","who":"YouTuber 李奧社長 Leo","t":"李奧社長 2025 免稅店 EP1：格蘭菲迪 19 年馬德拉桶、麥卡倫紫月橡木","body":"說明欄：格蘭菲迪 19 年馬德拉桶 43.4%（美國與歐洲橡木熟成至少 19 年，再過馬德拉桶 6 個月）；麥卡倫和諧系列第四版紫月橡木 Guardian Oak 44.2%（與太陽馬戲團合作）。","fame":"李奧社長 Leo（YouTube 約 3.1 萬訂閱，做「機場免稅威士忌」系列與 TW.WA 盲飲影片）。","say":"「這兩支李奧社長在免稅店開箱有推，格蘭菲迪 19 年馬德拉桶很順、麥卡倫紫月是和諧系列。」","pitch":"要年份高又順→格蘭菲迪 19 年馬德拉桶；收藏系列→麥卡倫紫月（和諧系列）。","src":"李奧社長 Leo YouTube 2025/04/09","u":"https://www.youtube.com/watch?v=b_PyqxkF804","imgSrc":"YouTube 影片縮圖","subj":"格蘭菲迪 19 年馬德拉桶、麥卡倫紫月橡木（本店都有）","praise":"說明欄：格蘭菲迪 19 年熟無花果與橙子醬、絲滑順口，「整體均衡細緻，尾韻繚繞悠長」。","hit":{"glenfiddich-19y-madeira":"影片點名就是這支：至少 19 年後過馬德拉桶 6 個月，熟無花果、橙子醬、肉桂黑胡椒。","macallan-guardian-oak":"影片點名和諧系列第四版紫月橡木，說明欄提到與太陽馬戲團合作。"},"img":"img/buzz/leo-2025-df-ep1.webp","ids":["glenfiddich-19y-madeira","macallan-guardian-oak"]},{"id":"veuveclicquot-2025-lgd va Ranch 系列新酒標款。"},"img":"img/buzz/wente-2025-rebrand.webp","ids":["wente-riva-ranch-chardonnay-2024","wente-wetmore-cabernet-sauvignon-2022","wente-louis-mel-sauvignon-blanc-2024","wente-sandstone-merlot-2023","wente-select","wente-riva-ranch-pinot-noir-2023","wente-riva-ranch-chardonnay-2022","wente-riva-ranch-pinot-noir-2022","wente-sandstone-merlot-2022","wente-sandstone-merlot-2020"]},{"id":"hennessy-2025-spiritoftravel","d":"2025-04-02","k":"限量","region":"國外","who":"酩悅軒尼詩旅遊零售／Moodie Davitt Report","t":"軒尼詩 X.O 旅行城市限定瓶（含台北版）","body":"軒尼詩推出旅遊零售限定的 X.O「Spirit of Travel」城市瓶：新加坡、海南、香港、澳門、台北五版，每版只在該地販售，附壓印當地建築的皮革行李吊牌；台北版取材陶朱隱園大樓的曲線。2026 年擴大到亞洲、歐洲、中東機場，桃園機場有軒尼詩 Crystal Cocktails 體驗，並首度提供各地限定禮盒。","note":"本店卡名是「Sense of Travel」、pos 寫台北版；新聞名稱是「Spirit of Travel」，容量新聞沒寫。","say":"這是軒尼詩 X.O 的城市限定瓶，台北版瓶子設計取自陶朱隱園，只在當地賣，很適合當伴手禮。","pitch":"外國旅客送禮主推 X.O 城市版（有台灣元素）；一般送禮推 X.O 1L；更高預算推 XXO 或百樂廷。","src":"Moodie Davitt Report 2025/04/02；Moodie Davitt Report 2026/06/29","u":"https://moodiedavittreport.com/hennessy-x-o-spirit-of-travel-collection-celebrates-global-landmarks-with-limited-edition-decanters/","imgSrc":"Moodie Davitt Report","subj":"X.O 城市限定瓶（本店有 cognac-brandy-hennessy-1l，卡名 Sense of Travel）","praise":"品牌說 X.O 是 1870 年由第三代調酒大師 Émile Fillioux 創造、「第一支標示 Extra Old（X.O）的干邑」，城市瓶是「對冒險與文化欣賞的精緻致敬」。","hit":{"cognac-brandy-hennessy-1l":"同系列：新聞介紹 X.O 旅遊城市限定瓶，台北版以陶朱隱園為設計；本店這支 1L 是哪一城市版以實品為準。"},"img":"img/buzz/hennessy-2025-spiritoftravel.webp","ids":["cognac-brandy-hennessy-1l","hennessy-07l-2","hennessy-xo-1l"]},{"id":"donjulio-2025-peggy-gou","d":"2025-03-31","k":"限量","region":"國外","who":"帝亞吉歐 Diageo","t":"唐胡里歐 1942 × Peggy Gou 限定瓶","body":"唐胡里歐 1942 第一次與名人做全球商品聯名，推出 DJ Peggy Gou 設計的限定瓶「194구」：薄荷綠與深紫配色、全像酒標、鏡面瓶蓋，外盒是她手繪插畫，盒內附她的親筆訊息。在美、英、義、西、韓、港、新、日、杜拜、墨西哥等地限量販售。","fame":"Peggy Gou 是韓國出身、世界知名的 DJ 與音樂製作人，也是時尚圈的風格代表。","note":"本店是 1942 標準瓶；限定瓶本店沒有。","say":"唐胡里歐 1942 去年跟 DJ Peggy Gou 出過聯名瓶，裡面就是這支 1942，焦糖橡木很順口。","pitch":"龍舌蘭高端送禮直接推 1942；適合純飲或加冰。","src":"Diageo 新聞稿 2025-03-31；Moodie Davitt Report","u":"https://www.diageo.com/en/news-and-media/press-releases/2025/don-julio-1942-partners-with-superstar-dj-and-style-icon-peggy-gou","imgSrc":"Diageo","subj":"Don Julio 1942 Peggy Gou 限定瓶（本店有 1942 標準版）","praise":"帝亞吉歐說 1942 有「焦糖與橡木的細緻風味」、極滑順；Peggy Gou：「我想做一支讓人一看到就停下腳步的瓶子」。","hit":{"donjulio-075l":"同款酒、不同包裝：限定瓶裡裝的就是 Don Julio 1942，新聞介紹它焦糖與橡木風味、極滑順。"},"img":"img/buzz/donjulio-2025-peggy-gou.webp","ids":["donjulio-075l"]},{"id":"ludan-2025-aultmore18","d":"2025-03-25","k":"YouTuber","region":"國內","who":"YouTuber 滷蛋愛評酒","t":"滷蛋愛評酒：雅墨（歐特摩）18 年開箱","body":"影片標題與說明欄：以花香為主的雅墨 18 年，濃郁優雅的花香搭配細緻果香。說明欄沒寫是哪個版本。","fame":"滷蛋愛評酒（YouTube 約 2.1 萬訂閱，台灣威士忌開箱頻道）。","say":"「雅墨（歐特摩）是花香型，18 年很優雅；我們這支是機場的馬德拉桶版。」","pitch":"喜歡花香→歐特摩 18 年馬德拉桶；入門→12 年。","src":"滷蛋愛評酒 YouTube 2025/03/25","u":"https://www.youtube.com/watch?v=H6O4c2oGPCE","imgSrc":"YouTube 影片縮圖","subj":"雅墨（歐特摩）18 年","praise":"說明欄：「濃郁優雅的花香在杯中綻放搭配細緻的果香，好像優雅的精靈在杯上跳舞」。","hit":{"aultmore-18y":"影片開箱雅墨 18 年（說明欄沒寫版本）；本款是 18 年馬德拉桶旅遊零售版 500ml。"},"img":"img/buzz/ludan-2025-aultmore18.webp","ids":["aultmore-18y"]},{"id":"glenrothes-2025-the51","d":"2025-03-25","k":"限量","region":"國外","who":"格蘭路思 The Glenrothes（愛丁頓）","t":"格蘭路思 51 年：要用鎚子敲開的酒","body":"格蘭路思推出 51 年 The 51，兩個酒桶、全球 100 瓶、£37,000。酒瓶包在一根永續材料的 Jesmonite 柱子裡，要用附的鎚子敲開；碎片可寄回，由金繼（Kintsugi）藝術家用貴金屬修成花瓶，插一株真的蘭花。","note":"品牌新聞；本店是 19 年、22 年單桶。","say":"格蘭路思去年出了一支 51 年，要拿鎚子敲開柱子才能喝，全球只有 100 瓶。","pitch":"想喝格蘭路思老酒推 19 年單桶；預算高、送禮推 22 年單桶（每桶只有一批）。","src":"BevNET（新聞稿）2025-03-27","u":"https://bevnet.com/pr/2025/03/27/the-glenrothes-unveils-the-51","subj":"格蘭路思 The 51（本店沒有；本店有 19 年、22 年單桶）","praise":"首席調酒師 Laura Rampling：The 51 是「耐心、自然與工藝完美對齊的罕見時刻」；蘇富比威士忌主管說收藏家需要被鼓勵把酒喝掉。","th":"img/kbw/glenrothes-sc-19y-1435.webp","ids":["glenrothes-sc-19y-1435","glenrothes-sc-22y-12100"]},{"id":"lin-2025-rs62","d":"2025-03-21","k":"YouTuber","region":"國內","who":"YouTuber 執杯大叔 林一峰","t":"林一峰：皇家禮炮 62 禮讚「無價頂奢私旅」倫敦塔之旅","body":"說明欄：參加皇家禮炮 62 禮讚的私旅，進入倫敦塔皇室秘境、坐直升機看倫敦，再到皇家禮炮的靈魂酒廠史翠艾拉，從 500 公升雪莉桶取出 38 年原酒品飲。","fame":"執杯大叔 林一峰（YouTube 約 11.5 萬訂閱，台灣資深威士忌作家，常專訪酒廠首席調酒師）。這支影片約 39 萬觀看。","say":"「62 禮讚是皇家禮炮致敬英國皇室 62 響禮炮的系列，林一峰還跟著品牌去了倫敦塔。」","pitch":"送重要長輩→皇家禮炮 62 禮讚；預算低→21 年；喜歡煙燻→62 泥煤珍藏或 21 年黑禮炮。","src":"執杯大叔 林一峰 YouTube 2025/03/21","u":"https://www.youtube.com/watch?v=VaP4de6HgwA","imgSrc":"YouTube 影片縮圖","subj":"皇家禮炮 62 禮讚（本店有經典藍瓶與泥煤珍藏）","praise":"說明欄：在倫敦塔喝到「難得一見的珍釀」，皇家禮炮與皇室的連結。","hit":{"royalsalute-62-original":"影片的主題就是 62 禮讚系列（本款是經典藍瓶）。","royalsalute-62-peated":"62 禮讚系列（本款是泥煤珍藏）。"},"img":"img/buzz/lin-2025-rs62.webp","ids":["royalsalute-62-original","royalsalute-62-peated"]},{"id":"royalbrackla-2025-24y","d":"2025-03-20","k":"限量","region":"國外","who":"百加得全球旅遊零售","t":"皇家布萊克拉 24 年雪莉桶免稅限量","body":"百加得全球旅遊零售推出皇家布萊克拉 Exceptional Cask 24 年：1999 年 10 月蒸餾，先在再填豬頭桶熟成，2014 年換進 Oloroso 雪莉桶，原桶強度 51.8%，限量 396 瓶。2024 年底先在新加坡樟宜樂天免稅首賣，之後進英國機場 World Duty Free 與韓國免稅店。","note":"本店有 12 年 1L；24 年只在部分機場賣，本店沒有。","say":"皇家布萊克拉最近在機場出了 24 年雪莉桶原桶強度限量，只有 396 瓶；想先認識這個酒廠，可以從我們的 12 年 1L 開始。","pitch":"入門推 12 年 1L（容量大、好分享）；同價位想試其他雪莉風格可推百富或慕赫。","src":"GTR Magazine 2025-03-20；Moodie Davitt Report","u":"https://www.gtrmag.com/blog/bacardi-global-travel-retail-unveils-latest-addition-to-royal-brackla-exceptional-cask-series","subj":"皇家布萊克拉 Exceptional Cask 24 年（本店沒有；本店有 12 年）","praise":"百加得行銷總監：這支是「傳統與創新結合的絕佳例子」；新聞特別點出是少見的原桶強度。","th":"p/cut/f4d076e48a9b.webp","ids":["royalbrackla-12y"]},{"id":"ardbeg-2025-smoketrails-napa","d":"2025-03-14","k":"限量","region":"國外","who":"雅柏 Ardbeg（TRBusiness 報導）","t":"雅柏迷霧之徑第三版：納帕谷卡本內紅酒桶","body":"雅柏旅遊零售限定系列 Smoketrails（迷霧之徑）推出第三版 Napa Valley Edition：波本桶加美國加州納帕谷卡本內蘇維濃紅酒桶，報導說是雅柏第一次這樣搭配。1 公升，2025 年 1 月起在主要國際機場免稅店販售，艾雷島酒廠也有少量。前兩版是 Manzanilla 雪莉桶與法國羅第丘紅酒桶。","note":"本店有第一版 Manzanilla、第二版羅第丘；第三版納帕谷本店沒有（李奧社長影片提到的「煙霧之蹤 No.3」應是這支，待門市確認有沒有進貨）。","say":"迷霧之徑是雅柏只在機場賣的系列，每一版換一個產地的酒桶，我們有雪莉桶版和法國紅酒桶版。","pitch":"喜歡乾爽海味推 Manzanilla 版，喜歡紅果香料推羅第丘版；兩版一起當旅遊限定收藏。","src":"TRBusiness 2025-03-14","u":"https://www.trbusiness.com/regional-news/international/ardbeg-turns-to-napa-valley-for-latest-travel-retail-exclusive-whisky/263722","imgSrc":"TRBusiness","subj":"雅柏迷霧之徑 Napa Valley Edition（本店沒有；本店有同系列前兩版）","praise":"首席調和師 Gillian Macdonald 稱它是「裝在瓶子裡的雅柏式冒險」。","hit":{"ardbeg-smoketrails-manzanilla":"同系列第一版，新聞在介紹系列時提到 Manzanilla 雪莉桶版。","ardbeg-smoketrails-coterotie":"同系列第二版，新聞提到羅第丘紅酒桶版。"},"img":"img/buzz/ardbeg-2025-smoketrails-napa.webp","ids":["ardbeg-smoketrails-manzanilla","ardbeg-smoketrails-coterotie"]},{"id":"chivas-2025-pauillac18","d":"2025-03-12","k":"限量","region":"國外","who":"保樂力加全球旅遊零售（The Whiskey Wash 報導）","t":"起瓦士 18 年波雅克酒桶：免稅限定","body":"起瓦士推出旅遊零售獨賣的 18 年 Ultimate Cask Collection「Pauillac Cask Finish」，用波爾多波雅克（Pauillac）葡萄酒桶收尾，48%、1L 瓶、紫金色包裝，由首席調酒師 Sandy Hyslop 調製。在阿聯、亞洲／東南亞、印度、英國、美洲免稅店販售，搭配導覽品飲。","fame":"Sandy Hyslop：起瓦士首席調酒師（報導說明）","note":"本店是一般版 18 年（40%、700ml）；波雅克桶版是不同酒款","say":"起瓦士在機場還有一支波爾多酒桶收尾的 18 年，我們這邊的 18 年是經典版，送禮最安全。","pitch":"入門 12 年→主推 18 年（商務送禮）→升級 25 年；想要不一樣的桶推 Extra 13 年蘭姆桶。","src":"The Whiskey Wash 2025/03/12","u":"https://thewhiskeywash.com/whiskey-new-releases/chivas-regal-unveils-18-year-old-pauillac-cask-finish-for-global-travel-retail/","imgSrc":"The Whiskey Wash","subj":"波雅克桶 18 年本店沒有；本店有一般版起瓦士 18 年","praise":"官方風味：莓果醬、香草、黑醋栗果醬、檸檬凝乳、香料李子、燉洋梨，尾韻長而甜帶香料；保樂力加旅遊零售行銷副總說超高端收藏客「不會失望」","img":"img/buzz/chivas-2025-pauillac18.webp","ids":["chivas-18y","chivas-25y","chivas-xv","chivas-13y-extra"]},{"id":"chapoutier-2025-braille","d":"2025-03-11","k":"新聞","region":"國外","who":"夏伯帝 M. Chapoutier（官網新聞）","t":"夏伯帝慶祝點字 200 週年，希哲漢出限量版","body":"夏伯帝從 1996 年起在酒標上印點字（寫酒名、產區、年份、顏色）。2025 年法國點字 200 週年，酒莊推出旗艦酒 Monier de la Sizeranne 限量版，並邀請視障協會成員到艾米達吉葡萄園參觀品飲。Sizeranne 家族的土地 20 世紀初由夏伯帝買下；Maurice Monier de la Sizeranne 創立 Valentin Haüy 視障協會，1882 年做出第一版簡寫點字。","note":"本店有 2017 年份；新聞的 200 週年限量版本店沒有。","say":"你摸摸看酒標，上面有點字，夏伯帝 1996 年就開始，這支希哲漢是第一支。","pitch":"入門推隆河丘村莊；中價推克羅茲艾米達吉梅索尼；送禮推希哲漢（有點字故事）或教皇新堡柏納丁。","src":"M. Chapoutier 官網 2025-03-11","u":"https://www.chapoutier.com/en/journal/mchapoutiers-life/bicentenary-braille-chapoutier-sizeranne","subj":"艾米達吉 希哲漢 Monier de la Sizeranne（本店有 2017）","praise":"官網稱 Monier de la Sizeranne 是「第一支以點字標示的酒」，也是酒莊的代表作。","hit":{"chapoutier-hermitage-monier-de-la-sizeranne-2017":"新聞主角就是這款酒（本店 2017 年份）：第一支印點字的酒，名字來自點字推動者 Sizeranne。"},"th":"img/kbw/chapoutier-hermitage-monier-de-la-sizeranne-2017.webp","ids":["chapoutier-hermitage-monier-de-la-sizeranne-2017","chapoutier-crozes-hermitage-les-meysonniers-2024","chapoutier-chateauneuf-du-pape-la-bernardine-2023"]},{"id":"jameson-2025-marsala","d":"2025-03-07","k":"限量","region":"國外","who":"保樂力加全球旅遊零售／The Whiskey Wash","t":"尊美醇 Triple Triple 馬沙拉桶機場版","body":"尊美醇在全球旅遊零售推出 Triple Triple Marsala Cask Edition，限時只在免稅通路販售：三次蒸餾後經美國波本桶、Oloroso 雪莉桶，再進西西里 Florio 酒莊的馬沙拉桶（美國白橡木、浸潤 2–3 年）。40%，建議售價 45.5 美元。它加入 Triple Triple 系列，系列另有 Málaga 桶與栗木桶版。","fame":"Kevin O'Gorman：米爾頓（Midleton）酒廠首席蒸餾師。","note":"本店的 Triple Triple 卡寫雪莉桶、波本桶、馬拉加桶（＝Málaga 版）；新聞的馬沙拉桶版本店沒有。","say":"Triple Triple 是尊美醇機場專屬系列，三次蒸餾再用三種桶，本店這支是馬拉加甜酒桶版。","pitch":"入門推 Triple Triple 1L（價位低、順口）；想要更濃的焦糖香推黑桶 Black Barrel。","src":"The Whiskey Wash 2025/03/07；GTR Magazine 2025/03/07","u":"https://thewhiskeywash.com/irish-whiskey/jameson-unveils-triple-triple-marsala-cask-edition-in-travel-retail/","imgSrc":"The Whiskey Wash","subj":"Triple Triple 馬沙拉桶版（本店沒有）；本店有 Triple Triple 1L","praise":"首席蒸餾師 Kevin O'Gorman 說這是「我們在堅持三次蒸餾傳統的同時持續創新的最佳例子」。","hit":{"jameson-1l":"同系列：本店的 Triple Triple 1L 也是三次蒸餾＋三種桶的機場系列；新聞的是馬沙拉桶版。"},"img":"img/buzz/jameson-2025-marsala.webp","ids":["jameson-1l","jameson-black-barrel"]},{"id":"ruinart-2025-rose-jeroboam","d":"2025-03-06","k":"限量","region":"國外","who":"LVMH／瑞納特","t":"瑞納特粉紅香檳 3 公升刺繡限量外盒","body":"LVMH 公布瑞納特粉紅香檳 Jeroboam（3 公升）限量外盒：刺繡藝術家 Marie Berthouloux 用香檳封瓶材料（鐵絲帽的金線、瓶蓋的粉銅色）刺繡，每個手工 320 小時，只在蘭斯 Rue des Crayères 4 號酒莊販售。新聞也提到瑞納特 1764 年是第一家賣粉紅香檳的酒莊，當時叫「鷓鴣眼（oeil de perdrix）」。","note":"本店是 750ml 粉紅香檳，3 公升刺繡外盒只在法國酒莊賣。","say":"瑞納特 1764 年就開始賣粉紅香檳，是第一家，所以粉紅是它的代表作。","pitch":"送禮、慶祝推粉紅；自己喝、配海鮮推白中白。","src":"LVMH 2025-03-06","u":"https://www.lvmh.com/en/news-lvmh/ruinart-unveils-precious-showcase-inspired-by-the-vine-for-ruinart-rose-jeroboam","subj":"瑞納特粉紅香檳 3 公升限量外盒（本店有 750ml 粉紅）","praise":"LVMH 稱粉紅香檳是向瑞納特「開創精神」致敬的酒款，大瓶裝更能保留新鮮度與香氣。","hit":{"ruinart-rose":"同款酒的大瓶裝限量外盒；新聞介紹它用黑皮諾與夏多內，以及 1764 年第一家賣粉紅香檳的歷史。"},"th":"img/kbw/ruinart-rose.webp","ids":["ruinart-rose","ruinart-bdb"]},{"id":"royalsalute-2025-55y","d":"2025-03-05","k":"限量","region":"國內","who":"台灣保樂力加（工商時報）","t":"皇家禮炮 55 年：品牌史上最高年份","body":"皇家禮炮推出恆久限量系列第三代 55 年，全球限量 85 瓶，台灣分到 6 組，建議售價 158 萬元。原酒來自 Strathisla、Longmorn、Glen Keith 三間斯貝賽酒廠，都在 1969 年前入桶，以原桶強度 50.5% 裝瓶。瓶子是英國 Dartington 手工吹製水晶瓶，橡木酒盒刻著凱恩戈姆山國家公園四季景致。","note":"本店沒有 55 年；本店最高年份是 51 年時光系列（和新聞的「恆久限量系列」是否同一系列待確認）。","say":"皇家禮炮最高年份做到 55 年，全球只有 85 瓶；我們這邊有 51 年，也是半世紀以上的原酒。","pitch":"客人對高年份有興趣時，先從 32 年介紹，再帶到本店 51 年時光系列；一般送禮回到 21 年或 62 禮讚。","src":"工商時報 2025-03-05","u":"https://www.ctee.com.tw/news/20250305701077-431207","imgSrc":"工商時報","subj":"皇家禮炮 55 年（恆久限量系列第三代），本店沒有。","praise":"台灣保樂力加行銷總監方淑芬：「身為皇家禮炮有史以來最高年份的酒款，每一滴酒液皆橫跨了超過半世紀的漫長歲月」；首席調酒師 Sandy Hyslop：「能夠嗅聞、品飲這些歷經半世紀以上熟成的威士忌原酒是我的無上榮幸」。","img":"img/buzz/royalsalute-2025-55y.webp","ids":["royalsalute-51y-time-series","royalsalute-62-original","royalsalute-32y"]},{"id":"chivas-2025-leclerc","d":"2025-03-03","k":"代言","region":"國外","who":"法拉利 F1 車手 Charles Leclerc","t":"起瓦士宣布 F1 車手 Charles Leclerc 為全球品牌大使","body":"起瓦士與法拉利車手 Charles Leclerc 簽下多年全球合作，Leclerc 擔任全球品牌大使；合作主題結合音樂（他也會彈鋼琴、作曲），3 月在墨爾本辦快閃活動。2026 年雙方推出品牌第一支 16 年（見另一則話題）。","fame":"Charles Leclerc 是摩納哥籍法拉利 F1 車手，F1 分站冠軍，人氣很高。","say":"「起瓦士現在的全球大使是法拉利的 Leclerc，車迷很多；送車迷可以選起瓦士 18 年。」","pitch":"送車迷→起瓦士 18 年；預算高→起瓦士 25 年；入門→起瓦士 12 年。","src":"The Whiskey Wash 2025/03；Chivas Brothers 新聞稿","u":"https://thewhiskeywash.com/whiskey-news/chivas-regal-announces-f1-star-charles-leclerc-as-global-brand-ambassador/","imgSrc":"The Whiskey Wash","subj":"起瓦士品牌（全球大使），本店有 12、13、15、18、25 年","praise":"起瓦士說選擇 Leclerc 是因為他在賽道上與賽道外都展現出「好好生活」的精神。","img":"img/buzz/chivas-2025-leclerc.webp","ids":["chivas-12y","chivas-regal-13y-chivas","chivas-13y-extra","chivas-xv","chivas-18y","chivas-25y"]},{"id":"moet-2025-pharrell","d":"2025-03-01","k":"聯名","region":"國外","who":"音樂人、LV 男裝創意總監 Pharrell Williams","t":"酩悅 × Pharrell Williams 生日限量系列","body":"Pharrell 從酩悅檔案找到 1889 年瓶身上的蝴蝶結，做成限量系列：Brut Impérial（金色、午夜藍、深紅）與 Nectar Impérial Rosé（白色）瓶身，有他的簽名與 P.W. 珍珠字母；另有 3 公升珠寶大瓶，只做 30 件。3 月 1 日起在精選酒店、Harrods、KaDeWe 等地販售。","fame":"Pharrell Williams 是葛萊美獎音樂人，2023 年起擔任 Louis Vuitton 男裝創意總監。","note":"本店有酩悅帝國一號（Brut Impérial）與粉紅香檳常規款。","say":"「Pharrell 的限量版是帝國一號換包裝，裡面就是這支；生日、慶祝送這支最不會錯。」","pitch":"慶生送禮先推帝國一號；想要粉紅色推粉紅香檳；喜歡甜一點推冰帝國。","src":"LVMH 2025/03/03","u":"https://www.lvmh.com/en/news-lvmh/celebrating-together-moet--chandon-and-pharrell-williams-launch-limited-edition-collection-putting-birthdays-center-stage","subj":"酩悅 Brut Impérial 帝國一號（限量瓶本店沒有）","praise":"LVMH 新聞稿以「把生日放在舞台中央」介紹，蝴蝶結膠囊由巴黎工坊 Atelier Baqué Molinié 用珍珠串飾手工製作。","hit":{"moet":"Pharrell 限量瓶有一款就是 Brut Impérial，本款是同一支香檳的常規包裝。"},"th":"img/kbw/moet.webp","ids":["moet","moet-075l-2"]},{"id":"aberlour-2025-gtr-trio","d":"2025-02-27","k":"限量","region":"國外","who":"保樂力加全球旅遊零售（TRBusiness、GTR Magazine 報導）","t":"亞伯樂免稅專屬三款：13 年、16 年雙重炙燒、Suthainn","body":"保樂力加全球旅遊零售推出亞伯樂免稅專屬新系列三款，同時換上品牌新外觀：13 年（40%，美國橡木＋Oloroso 雪莉桶）、16 年 Double Charred Selection（43%，加強炙燒美國橡木桶收尾）、Suthainn（48%，非冷凝，獨特 Solera 做法＋歐洲雪莉豬頭桶延長熟成）。先在英國機場與德里機場上架，4 月起分批到全球免稅店。","note":"本店三款都有，全是免稅專屬，一般市場買不到。","say":"這三支是亞伯樂只在免稅店賣的系列，13、16 年和 Suthainn 一路往上，越後面雪莉味越重。","pitch":"入門推 13 年；想要焦糖烤橡木味推 16 年；喜歡重雪莉、有預算推 Suthainn，再往上原桶強度推 A'bunadh。","src":"GTR Magazine 2025-02-27；TRBusiness；The Whiskey Wash","u":"https://www.trbusiness.com/regional-news/international/aberlour-launches-new-gtr-exclusive-range-to-celebrate-150-years/263463","subj":"亞伯樂 13 年、16 年 Double Charred Selection、Suthainn（本店三款都有）","praise":"保樂力加 GTR 行銷副總 Liya Zhang：目標是讓亞伯樂成為「超高端單一麥芽的領導品牌」，新外觀是對這支斯貝賽威士忌的「驚艷重新想像」。","hit":{"aberlour-13y":"新聞介紹的三款之一：13 年、40%、美國橡木＋Oloroso 雪莉桶。","aberlour-16y":"新聞介紹的三款之一：16 年 Double Charred Selection、43%、加強炙燒美國橡木桶收尾。","aberlour-suthainn":"新聞介紹的三款之一：Suthainn、48%、非冷凝、Solera＋歐洲雪莉豬頭桶。"},"th":"img/kbw/aberlour-13y.webp","ids":["aberlour-13y","aberlour-16y","aberlour-suthainn","aberlour-abunadh"]},{"id":"luce-2025-30vintages","d":"2025-02-26","k":"新聞","region":"國外","who":"Tenuta Luce（Wine Industry Advisor）","t":"Luce 慶祝第 30 個年份","body":"托斯卡尼 Montalcino 的 Tenuta Luce 以 Luce 2022 慶祝從 1993 年首個年份起的第 30 個年份，並與佳士得辦垂直品飲。新聞介紹 Luce 結合山吉歐維榭的優雅結構與梅洛的圓潤，2022 年份 8 月 28 日開採，7 月與 8 月兩場 30mm 降雨幫助成熟。","note":"本店有 Luce 2023（下一個年份）與副牌 Lucente 2021。","say":"Luce 從 1993 年做到現在剛好 30 個年份，是 Montalcino 第一支山吉歐維榭混梅洛的酒。","pitch":"入門推副牌 Lucente 2021 → 送禮、重要場合推 Luce 2023；講「太陽 logo、花思蝶家族」很好記。","src":"Wine Industry Advisor 2025-02-26","u":"https://wineindustryadvisor.com/2025/02/26/celebrating-30-vintages-of-luce-a-testament-to-passion-and-tradition-in-the-heart-of-tuscany/","imgSrc":"Wine Industry Advisor（Tenuta Luce）","subj":"Luce 2022（本店有 Luce 2023 與 Lucente 2021）","praise":"花思蝶總裁 Lamberto Frescobaldi：「Luce 對我來說遠不只是一瓶酒」；佳士得葡萄酒國際總監 Tim Triptree MW：「這場品飲展現了許多出色的年份」。官方品飲（2022）：紅醋栗、石榴、細緻花香，單寧滑順、尾韻帶鹹香。","img":"img/buzz/luce-2025-30vintages.webp","ids":["luce-2023","luce-lucente-2021"]},{"id":"kavalan-2025-palo-cortado","d":"2025-02-18","k":"新品","region":"國內","who":"金車噶瑪蘭（PR Newswire 新聞稿）","t":"噶瑪蘭 Palo Cortado 雪莉桶原酒上市","body":"金車噶瑪蘭以極珍稀的 Palo Cortado 雪莉桶推出經典獨奏系列新酒，補齊「雪莉桶家族」。新聞稿說前一個月在台灣上市，750ml、原酒強度 50–59.9%、單桶裝瓶、不經冷凝過濾，小批次限量，在噶瑪蘭酒堡、展售中心、威士忌酒吧與特定酒專販售。","note":"本店是 45 週年紀念限量版（卡上 54.4%、2024 年 10 月發表）；新聞稿是 2025 年的經典獨奏常規 Palo Cortado 版，不是同一個版本。","say":"Palo Cortado 是雪莉酒裡不到 1% 的稀有款，被叫做『意外的奇蹟』，喝起來介於 Amontillado 和 Oloroso 之間。","pitch":"雪莉桶愛好者推 Palo Cortado 45 週年；想比較雪莉桶光譜可配 Fino（乾）、阿蒙提亞多、PX（甜）一起介紹。","src":"PR Newswire 亞太新聞稿 2025-02-18","u":"https://www.prnewswire.com/apac/zh/news-releases/-palo-cortado--302377942.html","imgSrc":"PR Newswire／金車噶瑪蘭","subj":"Kavalan Solist Palo Cortado 雪莉桶原酒 750ml（本店有的是 Palo Cortado 45 週年紀念限量版，同樣用 Palo Cortado 雪莉桶）","praise":"金車集團總經理李玉鼎：Palo Cortado 被譽為「意外的奇蹟」，在雪莉酒世界總量「僅佔不到 1%」，「融合了 Amontillado 的優雅與 Oloroso 的醇厚」。品飲：可可、柑橘、果乾、牛軋糖、堅果、香草、烤餅乾、荳蔻，尾韻焦糖太妃與核桃。","hit":{"kavalan-palo-cortado-45th"
