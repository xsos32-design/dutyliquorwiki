function lk(s,k,ls){if(!ls||!ls.length)return hl(s,k);var seg=[],used=[];ls.slice().sort(function(a,b){return b[0].length-a[0].length}).forEach(function(x){var t=x[0],p=0,i;while((i=s.indexOf(t,p))>=0){var j=i+t.length,ov=used.some(function(u){return i<u[1]&&j>u[0]});if(!ov){used.push([i,j]);seg.push([i,j,x])}p=j}});seg.sort(function(a,b){return a[0]-b[0]});var o='',p=0;seg.forEach(function(g){o+=hl(s.slice(p,g[0]),k);var x=g[2],u=x[2]==='c'?'../chocolatewiki/#'+encodeURIComponent(x[1]):'./#'+encodeURIComponent(x[1]);o+='<a class="pl" href="'+u+'">'+hl(s.slice(g[0],g[1]),k)+'</a>';p=g[1]});return o+hl(s.slice(p),k)}
document.getElementById('chips').innerHTML=S.map(function(s){return'<button type="button" data-s="'+s+'"'+(s===cur?' class="on"':'')+'>'+s+'</button>'}).join('');
document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=b.getAttribute('data-s');[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});draw()});
q.addEventListener('input',draw);
function draw(){var k=q.value.trim(),n=0,last='',h='';L.forEach(function(e){if(cur!=='全部'&&e.s.indexOf(cur)<0)return;var all=(e.v+' '+e.t+' '+e.i.join(' ')).toLowerCase();if(k&&all.indexOf(k.toLowerCase())<0)return;n++;
 if(e.d!==last){last=e.d;var p=e.d.split('-');h+='<div class="day">'+p[0]+' 年 '+(+p[1])+' 月 '+(+p[2])+' 日</div>';}
 h+='<article class="ent"><h2><span class="v">'+esc(e.v)+'</span><span>'+lk(e.t,k,e.l)+'</span></h2><div class="tags">'+e.s.map(function(s){return'<span>'+esc(s)+'</span>'}).join('')+'</div><ul>'+e.i.map(function(x){return'<li>'+lk(x,k,e.l)+'</li>'}).join('')+'</ul></article>';});
 document.getElementById('list').innerHTML=h||'<p class="cnt">找不到符合的更新。</p>';document.getElementById('cnt').textContent='共 '+n+' 筆更新';}
draw();})();
