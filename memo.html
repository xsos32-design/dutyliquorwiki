function wrap(ctx,t,x,y,w,lh,max){var line='',n=0;for(var i=0;i<t.length;i++){var ch=t[i];var tt=line+ch;if(ctx.measureText(tt).width>w&&line){ctx.fillText(line,x,y);y+=lh;line=ch;if(++n>=max-1){var rest=t.slice(i);while(ctx.measureText(rest+'…').width>w&&rest.length)rest=rest.slice(0,-1);ctx.fillText(rest+(rest.length<t.length-i?'…':''),x,y);return y+lh;}}else line=tt;}if(line){ctx.fillText(line,x,y);y+=lh;}return y;}
