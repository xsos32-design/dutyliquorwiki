<script>
(function(){
var P=JSON.parse(document.getElementById('PICK').textContent),R=P.rows;
var CATS=['全部','威士忌','白蘭地','葡萄酒','香檳氣泡','清酒梅酒','高粱白酒','調酒利口酒'];
var BUD=[['不限',0,1e12],['1,000 以下',1,1000],['1,000–3,000',1000,3000],['3,000–6,000',3000,6000],['6,000–15,000',6000,15000],['15,000 以上',15000,1e12]];
var st={cat:0,bud:0,tas:[],sce:-1,sort:'fit',show:30};
try{var sv=JSON.parse(localStorage.getItem('pick-st')||'null');if(sv){st.cat=sv.cat||0;st.bud=sv.bud||0;st.tas=sv.tas||[];st.sce=sv.sce==null?-1:sv.sce;st.sort=sv.sort||'fit'}}catch(e){}
function chips(id,list,isOn,on){var el=document.getElementById(id);el.innerHTML='';list.forEach(function(l,i){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=l;b.setAttribute('aria-pressed',isOn(i)?'true':'false');b.onclick=function(){on(i);st.show=30;draw()};el.appendChild(b)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(){
 try{localStorage.setItem('pick-st',JSON.stringify(st))}catch(e){}
 chips('f-cat',CATS,function(i){return st.cat===i},function(i){st.cat=i});
 chips('f-bud',BUD.map(function(b){return b[0]}),function(i){return st.bud===i},function(i){st.bud=i});
 chips('f-tas',P.taste,function(i){return st.tas.indexOf(i)>=0},function(i){var k=st.tas.indexOf(i);k>=0?st.tas.splice(k,1):st.tas.push(i)});
 chips('f-sce',['不限'].concat(P.scene),function(i){return st.sce===i-1},function(i){st.sce=i-1});
 document.getElementById('sort').value=st.sort;
 var b=BUD[st.bud];
 var L=R.filter(function(r){
  if(st.cat&&r.c!==CATS[st.cat])return false;
  if(st.bud){if(!r.p||r.p<b[1]||r.p>b[2])return false}
  if(st.sce>=0&&r.s.indexOf(st.sce)<0)return false;
  if(st.tas.length&&!st.tas.some(function(t){return r.t.indexOf(t)>=0}))return false;
  return true});
 L.forEach(function(r){r._f=st.tas.filter(function(t){return r.t.indexOf(t)>=0}).length*3+(r.m?1:0)+(r.g?0.5:0)});
 var S={fit:function(a,b){return b._f-a._f||(a.p||9e9)-(b.p||9e9)},promo:function(a,b){return (b.m?1:0)-(a.m?1:0)||b._f-a._f},asc:function(a,b){return (a.p||9e9)-(b.p||9e9)},desc:function(a,b){return (b.p||0)-(a.p||0)}};
 L.sort(S[st.sort]);
 document.getElementById('cnt').textContent=L.length;
 var el=document.getElementById('list');
 if(!L.length){el.innerHTML='<div class="empty">沒有符合的商品，放寬一個條件試試。</div>';document.getElementById('more').hidden=true;return}
 el.innerHTML=L.slice(0,st.show).map(function(r){
  var tg=r.t.map(function(t){return '<span>'+esc(P.taste[t])+'</span>'}).join('');
  return '<a class="card" href="./#'+encodeURIComponent(r.i)+'"><div class="ph"'+(r.g?' style="background-image:url(\''+esc(r.g)+'\')"':'')+'></div><div class="tx"><div class="nm">'+esc(r.n)+'</div><div class="mt">'+esc([r.c,r.r,r.a].filter(Boolean).join('・'))+'</div>'+(r.q?'<div class="q">'+esc(r.q)+'</div>':'')+'<div class="pr">'+(r.p?'NT$'+r.p.toLocaleString():'售價請看價卡')+'</div>'+(r.m?'<span class="pm">'+esc(r.m)+'</span>':'')+(tg?'<div class="tg">'+tg+'</div>':'')+'</div></a>'}).join('');
 var mb=document.getElementById('more');mb.hidden=L.length<=st.show;
}
document.getElementById('sort').onchange=function(){st.sort=this.value;draw()};
document.getElementById('more').onclick=function(){st.show+=30;draw()};
draw();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
