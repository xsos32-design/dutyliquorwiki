<header class="hero"><span class="eye">WHY ENCYCLOPEDIA</span><h1>為什麼百科</h1>
<p>50 個「為什麼」：加烈酒、雪莉、波特、泥煤、冷凝過濾、調溫、白霜……每篇都有一句話答案、流程、數字、跟客人怎麼說，以及本店哪些酒這樣做。商品卡上有虛線底線的名詞，點一下也會跳出解釋。</p></header>

<div id="list"><div id="grid"></div></div><div id="art"></div></main>
<script>window.__WHY={"items":[{"id":"fortified","s":"w","cat":"加烈酒與甜酒","t":"加烈酒是什麼？為什麼要在葡萄酒裡加烈酒？","en":"Fortified Wine","short":"在葡萄酒裡加入蒸餾烈酒（通常是葡萄白蘭地）把酒精度拉高到約 15–22%。最早是為了讓酒撐過長途海運不變質，也能把甜味留住。","what":"加烈酒（也叫強化葡萄酒）＝葡萄酒＋蒸餾烈酒。最常加的是葡萄蒸餾的白蘭地或中性葡萄烈酒，所以酒精度比一般葡萄酒高。最有名的四種：雪莉（西班牙）、波特（葡萄牙）、馬德拉（葡萄牙外海的島）、馬沙拉（義大利西西里）。法國南部還有「天然甜酒」Vin Doux Naturel（例如 Banyuls）。","why":[["防腐、撐過航海","酒精本身就是抗菌劑。17–18 世紀葡萄酒要坐船運到英國、新大陸、東印度，一般葡萄酒常在船上壞掉，加了烈酒就穩定得多。"],["要甜就「中途加」","酵母吃糖產生酒精。發酵到一半就加烈酒，酒精一高酵母就停工，還沒吃完的糖被留下來，所以波特酒是甜的。"],["要乾就「發酵完再加」","雪莉酒是等糖全部發酵完才加烈酒，所以大多數雪莉是乾的；甜的雪莉另外用曬乾的葡萄或調和。"],["加多少決定風格","同樣是雪莉，加到約 15% 時酒面會長一層酵母「酒花」保護酒；加到 17% 以上酒花活不了，酒就慢慢氧化變深色。"]],"steps":["採收葡萄","榨汁發酵","加入葡萄烈酒（中途＝甜／發酵完＝乾）","木桶熟成","裝瓶"],"facts":[["一般葡萄酒自然發酵上限","約 16–18%"],["加烈後的酒精度","約 15–22%"],["波特酒","多在 19–22%"],["天然甜酒加的烈酒","95% 葡萄烈酒，最多加到 10%"]],"taste":"比一般葡萄酒更濃、更暖口；甜型（波特、PX 雪莉、馬德拉 Malmsey）有果乾、焦糖、堅果；乾型（Fino 雪莉）很清爽帶杏仁、鹹味。","say":"「加烈酒就是在葡萄酒裡加白蘭地，以前是為了坐船不會壞。威士忌常用這種酒的空桶來熟成，所以您會看到雪莉桶、波特桶、馬德拉桶。」","rel":["sherry","flor","solera","port","madeira","marsala","caskfinish"],"link":[["雪莉桶完整說明（本站）","regions.html#c-sherry"],["葡萄酒桶與加烈酒桶（本站）","regions.html#c-winecask"]],"src":[["Wikipedia：Fortified wine","https://en.wikipedia.org/wiki/Fortified_wine"],["Wikipedia：Port wine","https://en.wikipedia.org/wiki/Port_wine"],["Wikipedia：Vin doux naturel","https://en.wikipedia.org/wiki/Vin_doux_naturel"],["Sherry.wine：What is fortification","https://www.sherry.wine/news/what-is-fortification-in-sherry-wine"]],"p":["tamdhu-ambar-2008","tamdhu","glenfarclas-2","glenfarclas-ny-horse-2002","glenfarclas-no18","glenfarclas-no19","glenfarclas-no23-2014","glenfarclas-no30","glenmorangie-dornoch","glenmorangie-tayne","glenmorangie-12y-accord","glenmorangie-16y-tribute","glenmorangie-18y-2","glenmorangie-25y-2","glenmorangie-gv-1993","glenmorangie-gv-1995","glenmorangie-signet-reserve","ardbeg","ardbeg-uigeadail","ardbeg-perpetuum","ardbeg-traigh-bhan-19","ardbeg-y2k-24y","ardbeg-21-seann-chreag","ardbeg-dolce","ardbeg-smoketrails-manzanilla","miyagikyo-grand sk","macallan-12y-dc","macallan-15y-dc","macallan-rare-cask-black","macallan-oscuro"]},{"id":"sherry","s":"w","cat":"加烈酒與甜酒","t":"雪莉酒是怎麼做的？為什麼有乾有甜、有淺有深？","en":"Sherry","short":"西班牙赫雷斯一帶的加烈酒。發酵完才加烈酒，所以多半是乾的；加到約 15% 長酒花＝Fino（淺色清爽），加到 17% 以上氧化＝Oloroso（深色堅果）。","what":"雪莉酒來自西班牙南部赫雷斯（Jerez）一帶。主要葡萄是 Palomino（約九成，做乾型），甜型用 Pedro Ximénez（PX，先曬乾）和 Moscatel。雪莉是「發酵全部完成後」才加入葡萄蒸餾烈酒，再放進 Solera 系統一層層熟成。","why":[["先分級再決定加多少烈酒","酒窖師傅先試每一桶：細緻的加到約 15%，讓酒面長出「酒花」（Flor）保護酒、走 Fino／Manzanilla；比較厚重的加到 17% 以上，酒花死掉、走氧化路線變 Oloroso。"],["淺色 vs 深色的差別是「有沒有接觸空氣」","有酒花蓋著＝隔絕氧氣，酒保持淺色清爽；沒有酒花＝慢慢氧化，顏色變深、出現堅果與木質。"],["中間型","Amontillado＝先在酒花下熟成、後來酒花沒了再氧化；Palo Cortado＝先像 Amontillado，後來轉成 Oloroso 的風格。"],["甜的怎麼來","PX 雪莉用曬乾的 PX 葡萄，糖份極高、顏色像醬油；Cream 雪莉是 Oloroso 加 PX 調甜（1860 年代開始有）。"]],"steps":["Palomino 葡萄發酵成乾白酒","分級","加烈到約 15%（Fino）或 17%+（Oloroso）","放進 Solera 一層層熟成","從最老一層取酒裝瓶"],"facts":[["Palomino 種植比例","約 90%"],["Fino／Manzanilla 加烈","約 15–15.5%"],["Oloroso 加烈","17% 以上"],["桶子","500 公升，只裝約 5/6 讓酒花能長"],["VOS／VORS","平均至少 20 年／30 年"]],"taste":"乾→甜：Manzanilla、Fino（清爽、杏仁、海風鹹）→ Amontillado（榛果）→ Palo Cortado → Oloroso（核桃、皮革、乾的）→ Cream → PX（葡萄乾、黑糖、極甜）。威士忌的「雪莉桶」大多是 Oloroso 或 PX。","say":"「雪莉酒有乾有甜。威士忌最常用 Oloroso 和 PX 兩種雪莉桶：Oloroso 給果乾、堅果；PX 更甜，像葡萄乾黑糖。」","rel":["flor","solera","fortified","caskfinish","seasoned"],"link":[["雪莉桶 8 種光譜（本站）","regions.html#c-sherry"]],"src":[["Wikipedia：Sherry","https://en.wikipedia.org/wiki/Sherry"],["Sherry.wine：What is fortification","https://www.sherry.wine/news/what-is-fortification-in-sherry-wine"],["Wikipedia：Solera","https://en.wikipedia.org/wiki/Solera"]],"p":["tamdhu-ambar-2008","tamdhu","glenfarclas-2","glenfarclas-ny-horse-2002","glenfarclas-no18","glenfarclas-no19","glenfarclas-no23-2014","glenfarclas-no30","glenmorangie-dornoch","glenmorangie-tayne","glenmorangie-12y-accord","glenmorangie-18y-2","glenmorangie-gv-1995","glenmorangie-signet-reserve","ardbeg","ardbeg-uigeadail","ardbeg-perpetuum","ardbeg-traigh-bhan-19","ardbeg-y2k-24y","ardbeg-21-seann-chreag","ardbeg-smoketrails-manza -77y-red","macallan-home-collection-2","macallan-m-decanter-black","macallan-m-decanter-2022","macallan-guardian-oak","macallan-harmony","macallan-dyw-paris","macallan-roca-hk","macallan-earth","macallan-earth-2","macallan-rare-2","macallan-rare","jura-12y-bay","jura-19y","jura-28y","tamnavulin-oloroso","dalmore-king","dalmore-13y","dalmore-13y-1l","dalmore-15y-2","dalmore-15y-3","dalmore-16y","dalmore-18y-2","dalmore-19y","dalmore-20y","dalmore-21y","dalmore-25y-2","dalmore-40y","dalmore-17y-no3","dalmore-the","dalmore-3","dalmore","fettercairn-12y","fettercairn-40y-2","glenfiddich","glenfiddich-vat-2","glenfiddich-vat-3","glenfiddich-vat-3-cny","glenfiddich-vat-4","gf-30yo-time-series","gf-solera-1l","gf-15y-sherry-07l","glendronach-1993-a","glendronach-10y","glendronach-12y","glendronach-21y","glendronach-1989-c2918","glendronach-1991-sc","glendronach-1992-c8312","glendronach-1993-c6575","glendronach-1993-c6852","glendronach-1994-c118","glendronach-1995-c3052","glenfarclas","balvenie-classic","balvenie-18y-2","balvenie-15y-1931","glengrant-12y","glengrant-21y","glengrant-72y-2","bunnahabhain-toiteach","bunnahabhain-stiuireadair","bunnahabhain-40y","shinobu-10y","shinobu-15y-2","shinobu-10y-lightpeat","akashi-blue","akashi-2","akashi","tomatin-12y","aultmore-25y-2","omc-bunnahabhain-2008-14y","aberfeldy-21y","aberfeldy-25y","aberfeldy-28y-ec","glen-deveron-40y","glen-deveron-16y-glen","glen-deveron-20y-glen","dewars-dd-26y","dewars-30y","dewars-dd-20y","aultmore-12y","royalbrackla-12y","craigellachie-13y","kiuchi-whisky-cask","jameson-1l","macallan-anoe-finale","macallan-carta-nautica-1987","macallan-ts-sherry-cask","macallan-12y-dc","macallan-15y-dc","macallan-rare-cask-black","macallan-oscuro"]},{"id":"flor","s":"w","cat":"加烈酒與甜酒","t":"「酒花」Flor 是什麼？為什麼一層酵母能讓酒不氧化？","en":"Flor","short":"Fino 雪莉酒桶裡浮在酒面上的一層天然酵母膜。像蓋子一樣隔絕空氣，讓酒保持淺色清爽；酒精度約 15% 能長、17% 左右就會死。","what":"酒花是雪莉酒（Fino、Manzanilla）在桶中熟成時，酒面上自然長出的一層白色酵母膜。桶子刻意只裝約 5/6，留空間讓它長。","why":[["隔絕氧氣","酒花蓋住整個酒面，空氣碰不到酒，所以 Fino 一直是淺金色、清爽。"],["吃掉一些成分、產生特殊香氣","酒花酵母會改變酒的成分，帶來 Fino 特有的麵團、杏仁、鹹鮮味。"],["用酒精度控制","酒花在約 15% 活得最好，17% 左右就會死。所以師傅用「加烈到幾度」來決定這桶要不要走酒花路線。"]],"facts":[["適合生長","約 15%"],["會死掉","約 17%"],["裝桶","約 5/6 滿"]],"taste":"在酒花下熟成的酒：清爽、乾、杏仁、麵包、海風鹹味。威士忌用 Fino／Manzanilla 桶，常帶出鹹鮮、堅果、清爽感（例如噶瑪蘭 Fino 雪莉桶）。","say":"「Fino 雪莉在桶裡有一層天然酵母蓋著，酒不會氧化，所以喝起來清爽、帶點鹹，跟深色甜甜的雪莉完全不一樣。」","rel":["sherry","solera","fortified"],"src":[["Wikipedia：Sherry","https://en.wikipedia.org/wiki/Sherry"],["Sherry.wine：What is fortification","https://www.sherry.wine/news/what-is-fortification-in-sherry-wine"]],"p":["ardbeg-smoketrails-manzanilla","kavalan-07l","kavalan-solist-manzanilla","kavalan-solist-fino","mortlach-16y-nb02"]},{"id":"solera","s":"w","cat":"加烈酒與甜酒","t":"Solera 系統是什麼？為什麼一瓶酒裡有很多年份？","en":"Solera","short":"一層層疊放的木桶接力熟成：只從最老一層取酒裝瓶，再用次老的補，次老的再用更年輕的補。每瓶都混有很老的酒，風格年年穩定。","what":"Solera 是雪莉酒（也用在馬沙拉、部分蘭姆與威士忌）的熟成方式。木桶分成好幾層（通常 3–9 層），最老的一層叫 Solera，其他層叫 Criadera（培養層）。","why":[["風格穩定","每次只抽一部分（雪莉每年約 1/3），新酒會被老酒「帶」著走，所以每年裝瓶的味道幾乎一樣。"],["每瓶都有老酒","最老那一層的酒從來沒有被全部取空，所以瓶中永遠留有很久以前的一點點酒。"],["年份不寫單一數字","因為是很多年份混在一起，雪莉通常不標年份，而用平均年齡（例如 VOS 平均 20 年以上）。"]],"steps":["最年輕一層（第 3 Criadera）","移一部分到第 2 Criadera","再移到第 1 Criadera","最老的 Solera 層","只從這層取酒裝瓶"],"facts":[["層數","通常 3–9 層"],["雪莉每年抽取","約 1/3"],["每次移動","每桶約 5–30%"],["最低熟成","資料寫 2 年或 3 年（來源不一）"]],"taste":"Solera 熟成的酒：圓潤、穩定、有老酒的深度。威士忌裡標「Solera」的（例如格蘭菲迪 15 年 Solera）是借用這種接力混合的概念。","say":"「Solera 就像老滷汁，舊的永遠留一點、補新的進去，所以每年的味道都很穩。」","rel":["sherry","flor","marsala"],"link":[["本站桶型：Solera","regions.html#c-solera"]],"src":[["Wikipedia：Solera","https://en.wikipedia.org/wiki/Solera"],["Wikipedia：Sherry","https://en.wikipedia.org/wiki/Sherry"]],"p":["aberlour-suthainn","glenfiddich-vat","glenfiddich-vat-2","glenfiddich-vat-3","glenfiddich-vat-3-cny","glenfiddich-vat-4","gf-solera-1l"]},{"id":"port","s":"w","cat":"加烈酒與甜酒","t":"波特酒是什麼？Ruby、Tawny、LBV、年份波特差在哪？","en":"Port Wine","short":"葡萄牙斗羅河谷的甜型加烈酒。發酵到一半加葡萄烈酒讓酵母停工、留住甜味，酒精度約 19–22%。Ruby 新鮮果香、Tawny 長時間木桶氧化帶堅果焦糖。","what":"波特酒（Port）來自葡萄牙北部斗羅河谷（Douro），從波多（Porto）出口而得名。17 世紀後半英國商人發現加了烈酒的葡萄酒能撐到倫敦；1703 年英葡條約讓它低關稅進入英國。斗羅河谷 1756 年就劃定產區，是世界最早的保護產區之一。","why":[["中途加烈酒＝甜","發酵到一半加入中性葡萄烈酒（aguardente），酵母停止工作，糖份留下來，所以波特是甜的、酒精度也高。"],["在哪裡熟成決定風格","Ruby 在大槽（水泥、不鏽鋼）短期熟成，保留紅色莓果；Tawny 在小木桶長期熟成、慢慢氧化，顏色變琥珀、出現堅果與焦糖。"],["年份波特很稀少","只有特別好的年份才「宣告」年份波特，約佔產量 2%，在桶裡最多 2.5 年就裝瓶，之後要在瓶中陳放 10–40 年以上。"]],"facts":[["酒精度","約 19–22%"],["LBV","採收後 4–6 年裝瓶"],["年份波特","桶中最多 2.5 年，約佔產量 2%"],["Colheita","單一年份 Tawny，木桶至少 7 年"],["標年數 Tawny","10／20／30／40 年＝平均年數"]],"taste":"Ruby：黑櫻桃、莓果、新鮮；Tawny：無花果乾、核桃、焦糖、太妃；White Port：較清爽（Taylor 1934 年推出 Chip Dry 乾型）。威士忌的「波特桶」多帶紅色莓果、巧克力感。","say":"「波特酒是葡萄牙的甜酒，威士忌用波特桶會多一點紅色莓果和巧克力。皇家禮炮 26 年用的 Colheita 是單一年份、木桶至少 7 年的頂級波特。」","rel":["fortified","madeira","caskfinish","winecask3"],"link":[["本站桶型：波特桶","regions.html#c-port"]],"src":[["Wikipedia：Port wine","https://en.wikipedia.org/wiki/Port_wine"],["Wikipedia：Sherry（波特與雪莉加烈時間差）","https://en.wikipedia.org/wiki/Sherry"]],"p":["bowmore-16y","bowmore-22y-fq","bowmore-33y-fq","hakushu-18y","hibiki-21y","glenlivet-21y-sampleroom","kavalan-5","kavalan-solist-kvl-1l-2","kavalan-4","dalmore-king","dalmore-25y-2","dalmore-28y","dalmore-45y-4","dalmore-the","dalmore-3","fettercairn-50y-2","glenfiddich","balvenie-21y-port","bottega-pistacchio","bottega-07l"]},{"id":"madeira","s":"w","cat":"加烈酒與甜酒","t":"馬德拉酒為什麼要「加熱」？為什麼開瓶後幾乎不會壞？","en":"Madeira","short":"葡萄牙馬德拉島的加烈酒，會被刻意加熱熟成。起因是以前坐船經過熱帶繞一圈回來的酒反而更好喝，酒廠就在島上模仿。因為已經「熱過、氧化過」，開瓶後很穩定。","what":"馬德拉（Madeira）是大西洋馬德拉島的加烈酒。早期船隻往新大陸、東印度會在島上補給，酒在航程中容易壞，就加了葡萄烈酒；後來人們發現在熱帶船艙裡晃了一圈（vinho da roda，「回程酒」）的酒更好喝。","why":[["模仿熱帶航行","既然坐船經過熱帶會變好，就在島上直接加熱：Estufagem 用加熱槽（約 46°C、最高 55°C，至少 90 天）；Canteiro 不加熱，放在閣樓靠陽光自然升溫好幾年。"],["先熱過、先氧化過，所以不怕","馬德拉在製程中已經經歷過高溫與氧氣，所以開瓶後還能維持好幾個月甚至更久；有 200 多年的老馬德拉仍然狀態很好。"],["葡萄品種＝甜度","四種貴族葡萄由甜到乾：Malmsey（Malvasia）→ Bual → Verdelho → Sercial，發酵在不同糖度時停止。"]],"facts":[["Estufagem 加熱","常見約 46°C，最高 55°C，至少 90 天"],["Canteiro","自然溫度，Colheita 至少 5 年"],["年份 Frasqueira","桶中至少 19 年＋瓶中 1 年"],["四種貴族葡萄","Malmsey＞Bual＞Verdelho＞Sercial（甜→乾）"]],"taste":"焦糖、烤堅果、太妃、柑橘皮、明亮的酸度（所以甜卻不膩）。威士忌的「馬德拉桶」常帶熱帶水果、蜂蜜、焦糖與一點酸香，例如歐特摩 18 年、百富 15 年馬德拉桶。","say":"「馬德拉酒是加熱做出來的，以前坐船經過熱帶反而變好喝。威士忌用馬德拉桶會多一點焦糖、熱帶水果和清爽的酸。」","rel":["fortified","port","caskfinish"],"link":[["本站桶型：馬德拉桶","regions.html#c-madeira"]],"src":[["Wikipedia：Madeira wine","https://en.wikipedia.org/wiki/Madeira_wine"],["Wikipedia：Fortified wine","https://en.wikipedia.org/wiki/Fortified_wine"]],"p":["glenmorangie-16y-tribute","glenmorangie-25y-2","glenmorangie-gv-1993","octomore-2","kavalan-solist-madeira","jura-no4","dalmore-king","dalmore-40y","dalmore-the","glenfiddich-19y-madeira","balvenie-15y","aberfeldy-12y","aberfeldy-16y","dewars-double-double-36y","aultmore-18y"]},{"id":"marsala","s":"w","cat":"加烈酒與甜酒","t":"馬沙拉酒是什麼？為什麼是英國商人帶紅的？","en":"Marsala","short":"義大利西西里的加烈酒，18 世紀英國商人 John Woodhouse 把它當成雪莉、波特的平價替代品推到英國。分琥珀、金、紅寶石色，有乾有甜。","what":"馬沙拉（Marsala）來自西西里島西部的馬沙拉鎮。英國利物浦商人 John Woodhouse 在 1770 年代把它帶到英國（資料寫 1772 或 1773 年登陸，1796 年開始大量生產），後來酒廠被 Florio 買下。1969 年獲 DOC。","why":[["替代雪莉與波特","當時英國人愛喝雪莉、波特，馬沙拉以加烈方式做出類似風格、價格更親民。"],["也用接力熟成","傳統做法叫 in perpetuum，概念像 Solera，一直留老酒、補新酒。"],["按熟成年數分級","Fine 至少 1 年、Superiore 2 年、Superiore Riserva 4 年、Vergine 5 年、Stravecchio 10 年。"]],"facts":[["酒精度","約 15–20%"],["甜度","secco 乾（≤40 g/L）、semisecco、dolce 甜（>100 g/L）"],["顏色","Ambra 琥珀、Oro 金、Rubino 紅寶石"]],"taste":"烤堅果、焦糖、果乾、香草；也是義大利料理（馬沙拉雞、提拉米蘇）常用的酒。威士忌偶爾會用馬沙拉桶過桶。","say":"「馬沙拉是義大利的加烈酒，很多人知道它是做提拉米蘇、馬沙拉雞用的。」","rel":["fortified","solera","sherry"],"src":[["Wikipedia：Marsala wine","https://en.wikipedia.org/wiki/Marsala_wine"],["Wikipedia：Fortified wine","https://en.wikipedia.org/wiki/Fortified_wine"]],"p":["ardbeg-dolce"]},{"id":"icewine","s":"w","cat":"加烈酒與甜酒","t":"冰酒為什麼那麼甜、那麼貴？","en":"Ice Wine","short":"葡萄留在藤上等到結冰才採（加拿大規定 −8°C 以下）。水結成冰、糖不會，榨出的少量汁液極甜，產量少又要半夜搶收，所以貴。","what":"冰酒（Ice Wine／Eiswein）是讓葡萄在葡萄藤上自然結凍，在結冰狀態下採收、壓榨。主要產國是加拿大、德國、奧地利。","why":[["只榨出糖","葡萄裡的水結成冰留在果皮裡，榨出來的只有濃縮的糖與酸，所以一串葡萄只能榨出很少的汁。"],["法定溫度","加拿大要 −8°C 以下才能採，德國要 −7°C 以下。"],["為什麼貴","產量極少、要冒著葡萄被鳥吃或爛掉的風險等結冰，又常要半夜低溫時趕快採收。"]],"facts":[["加拿大採收溫度","−8°C 以下"],["德國採收溫度","−7°C 以下"],["殘糖","約 180–320 g/L"]],"taste":"蜂蜜、杏桃、熱帶水果，很甜但酸度高，所以喝起來不膩。威士忌、白蘭地偶爾會用冰酒桶過桶。","say":"「冰酒是葡萄在樹上結冰才採，一串只榨得出幾滴，所以甜又貴；酸度很好，配起司、水果塔剛好。」","rel":["noblerot","fortified"],"src":[["Wikipedia：Ice wine","https://en.wikipedia.org/wiki/Ice_wine"]],"p":["peller-winters-3pack","inniskillin-0375l","vidal","inniskillin-vidal-sparkling","inniskillin-cabernet-franc-icewine-375ml"]},{"id":"noblerot","s":"w","cat":"加烈酒與甜酒","t":"貴腐酒是什麼？發霉的葡萄為什麼能做頂級甜酒？","en":"Noble Rot / Botrytis","short":"一種叫 Botrytis 的黴菌在特定氣候下讓葡萄脫水、糖酸濃縮，還帶來蜂蜜香。法國蘇玳（Sauternes）、匈牙利托卡伊是代表。","what":"貴腐（Noble Rot）是灰黴菌 Botrytis cinerea 在「早上霧氣、下午乾燥」的環境中，以好的方式感染葡萄：果皮被穿透、水份蒸發，葡萄可縮水到原重量的約 60%。","why":[["讓葡萄變成葡萄乾般濃縮","水少了，糖和酸都被濃縮。"],["帶來特殊香氣","黴菌會產生甘油與蜂蜜般的香氣，讓甜酒口感更油潤。"],["代表產區","法國波爾多的蘇玳（Sauternes）、匈牙利的托卡伊（Tokaji Aszú，Furmint 葡萄）。"]],"facts":[["黴菌","Botrytis cinerea"],["葡萄失重","可達約 60%"]],"taste":"蜂蜜、杏桃、柑橘醬、番紅花。原廠講師課程把「蘇玳」列為葡萄酒桶三大果香方向的「白」：杏桃、蜜桃。","say":"「貴腐酒是好的黴菌讓葡萄縮成像葡萄乾，甜又香；威士忌用蘇玳桶會多一點杏桃、蜂蜜。」","rel":["icewine","winecask3","caskfinish"],"link":[["本站：葡萄酒桶三個果香方向","regions.html#c-winecask"]],"src":[["Wikipedia：Noble rot","https://en.wikipedia.org/wiki/Noble_rot"]],"p":["glenmorangie-cadboll","bowmore-22y"]},{"id":"champagne","s":"w","cat":"葡萄酒","t":"香檳的氣泡怎麼來？為什麼只有香檳區能叫香檳？","en":"Champagne / Traditional Method","short":"在瓶子裡進行第二次發酵產生氣泡（傳統法）。無年份香檳至少要和酒渣一起熟成 15 個月、年份香檳 3 年，所以有麵包、奶油香。名稱受法律保護。","what":"香檳用「傳統法」（Traditional Method）：先釀成靜態白酒、調配，裝瓶時加入糖與酵母（liqueur de tirage）封瓶，讓酒在瓶中再發酵一次，二氧化碳出不去就變成氣泡。","why":[["瓶中二次發酵＝細緻氣泡","約 18 公克糖可在瓶中產生約 6 大氣壓。"],["和酒渣一起熟成","發酵後的酵母沉澱（酒渣）留在瓶中，讓香檳有烤麵包、奶油、餅乾香。"],["轉瓶與除渣","把瓶子慢慢轉成瓶口朝下，讓酒渣集中到瓶口（轉瓶 Remuage，凱歌夫人 1816 年發明讓香檳變清澈的方法），再冷凍瓶頸取出（除渣），補上調味液決定甜度。"],["名稱保護","香檳區生產者成功遊說歐盟，「méthode champenoise」等名稱只有香檳區能用；其他地區用同樣方法要寫 Traditional Method。"]],"steps":["靜態白酒調配","加糖＋酵母裝瓶","瓶中二次發酵","帶酒渣熟成","轉瓶","除渣＋補液","封瓶"],"facts":[["無年份 NV 帶渣熟成","至少 15 個月"],["年份香檳","至少 3 年"],["瓶內壓力","約 6 大氣壓"]],"taste":"細緻綿密的氣泡、柑橘、青蘋果、烤麵包與奶油香；年份香檳更有深度。","say":"「香檳的氣泡是在瓶子裡發酵出來的，還跟酵母一起放了一年多，所以有麵包奶油香。」","rel":["decant","bottle"],"src":[["Wikipedia：Traditional method","https://en.wikipedia.org/wiki/Traditional_method"]],"p":["veuve-clicquot-vcp-075l","veuveclicquot-075l","veuveclicquot-075l-2","vcp-lgd-2015","lgd-rose-2015","vcp-lgd-2018","moet-ice-075l","moet-075l-2","moet-075l","moet","domperignon-2008y-dom","dom-p-dom-075l","ruinart-rose","ruinart-bdb","krug-rose","armanddebrignac-075l-3","armanddebrignac-075l-2","armanddebrignac-demisec","armanddebrignac-075l","armanddebrignac-bdn-2015","pj-blason-rose","pj-belle-epoque-rose-2012","penfolds-champagne-cuvee-brut-nv"]},{"id":"decant","s":"w","cat":"葡萄酒","t":"紅酒為什麼要醒酒？每一瓶都要嗎？","en":"Decanting","short":"醒酒有兩個目的：倒掉沉澱物、讓酒接觸空氣把香氣打開。老酒主要為了去沉澱；年輕、單寧重的紅酒則是為了讓它變柔順。","what":"醒酒（Decanting）是把酒從瓶子倒進醒酒瓶（通常容量就是一瓶 750ml）。","why":[["去掉沉澱","老的紅酒、年份波特會有沉澱，慢慢倒進醒酒瓶，把最後含沉澱的一點留在瓶中。現代葡萄酒比較少沉澱。"],["讓酒「呼吸」","接觸空氣讓年輕紅酒的香氣打開、口感變柔和。"]],"taste":"年輕的卡本內、希哈醒過之後果香更明顯、單寧比較不澀；細緻的老酒醒太久反而香氣會散。","say":"「年輕、比較澀的紅酒可以先醒一下會比較順；很老的酒倒的時候慢一點，把沉澱留在瓶底。」","rel":["tannin","champagne"],"src":[["Wikipedia：Decanter","https://en.wikipedia.org/wiki/Decanter"]],"p":[]},{"id":"tannin","s":"w","cat":"葡萄酒","t":"為什麼紅酒會澀、白酒不太會？","en":"Tannin","short":"澀感來自單寧，主要在葡萄皮、籽與木桶。紅酒是帶皮發酵（浸皮）所以單寧多；白酒通常榨汁後去皮再發酵，所以幾乎不澀。","what":"單寧（Tannin）是一種讓嘴巴有「乾、澀、收斂」感覺的天然成分，存在葡萄皮、籽、梗，以及橡木桶。","why":[["紅酒要帶皮泡","紅酒的顏色也在皮裡，所以要帶皮發酵（浸皮 Maceration），同時把單寧泡出來。"],["白酒先去皮","白酒多半先榨汁再發酵，皮接觸時間短，所以單寧很少。"],["單寧讓紅酒耐放","單寧多的紅酒結構強、比較能陳年，配紅肉也特別好。"]],"taste":"卡本內蘇維濃、內比歐露單寧重；黑皮諾、加美單寧輕。威士忌用紅酒桶也會帶來一點單寧的乾澀與莓果。","say":"「澀是因為葡萄皮的單寧，配牛排、起司就會變順口。怕澀可以選黑皮諾。」","rel":["decant","winecask3"],"src":[["Wikipedia：Tannin","https://en.wikipedia.org/wiki/Tannin"],["Wikipedia：Maceration (wine)","https://en.wikipedia.org/wiki/Maceration_(wine)"]],"p":[]},{"id":"bottle","s":"w","cat":"客人常問","t":"為什麼有 700ml、750ml、1L？免稅店為什麼常見 1 公升？","en":"Bottle Sizes","short":"歐洲、亞洲烈酒多是 700ml，美國以前只准 750ml（1979 年改公制時定下），2020 年底才開放 700ml。免稅店常見 1L 旅遊零售版。葡萄酒全世界標準是 750ml。","what":"同一支酒在不同市場容量可能不同：台灣、歐洲常見 700ml；美國版常是 750ml；免稅店常有 1L 版本。","why":[["美國的歷史規定","美國 1979 年酒類改用公制，葡萄酒標準瓶定為 750ml（以前的「fifth」約 757ml）。烈酒長期只准 750ml，美國菸酒稅務局（TTB）2020 年 12 月 29 日才新增 700ml 等規格。"],["所以美國版常是 750ml","本站有些包裝圖解用的是美國版 750ml，和本店的 700ml、1L 不同，看酒標時要注意。"],["葡萄酒都是 750ml","半瓶 375ml、標準 750ml、Magnum 1.5L。"]],"facts":[["美國改公制","1979 年"],["美國開放 700ml 烈酒","2020/12/29"],["葡萄酒標準瓶","750ml"],["Magnum","1.5L"]],"taste":"容量不同不代表酒不同，但「旅遊零售版」有時是不同配方或不同度數，要看商品卡。","say":"「台灣和歐洲是 700ml，美國版才是 750ml；免稅店的 1L 多了快一半，算每 100ml 常常比較划算。」","rel":["dutyfree","store_spirit"],"src":[["TTB：Standards of fill final rule","https://www.ttb.gov/news/standards-of-fill-final-rule-published"],["The Whiskey Wash：700 ml vs 750 ml","https://thewhiskeywash.com/scotch-whiskey/u-s-country-use-750ml-bottling-standard/"],["Wikipedia：Wine bottle","https://en.wikipedia.org/wiki/Wine_bottle"]],"p":[]},{"id":"oak","s":"w","cat":"威士忌為什麼","t":"威士忌為什麼一定要放橡木桶？桶子到底做了什麼？","en":"Cask Maturation","short":"剛蒸餾出來的新酒是透明、辛辣的。在橡木桶裡多年，木頭給它顏色、香草、焦糖、香料，也慢慢磨掉刺激的味道。蘇格蘭法規至少 3 年。","what":"蘇格蘭威士忌依法要在蘇格蘭、容量 700 公升以下的橡木桶熟成至少 3 年；入桶時常見約 63.5%。熟成期間酒會經由木頭和空氣慢慢變化。","why":[["給顏色與香氣","威士忌的金黃、琥珀色主要來自木桶；香草、焦糖、椰子（美國橡木）、香料、果乾（雪莉桶）也都來自桶。"],["讓新酒變圓潤","木頭內側燒烤過的炭層和慢慢進出的空氣，會讓辛辣、硫味的新酒變柔順。"],["前一手裝過什麼也很重要","用過波本、雪莉、波特、葡萄酒的桶，會把那種酒的味道帶給威士忌——這就是「雪莉桶」「波本桶」的由來。"],["熱的地方熟得快","台灣噶瑪蘭的師傅說亞熱帶氣候會加速熟成，頂級酒約 8 年就到高峰，蘇格蘭可能要接近 30 年。"]],"facts":[["蘇格蘭最低熟成","3 年"],["桶子上限","700 公升"],["常見入桶度數","約 63.5%（噶瑪蘭約 59.5–59.9%）"],["最低裝瓶度數","40%"]],"taste":"波本桶：香草、椰子、蜂蜜、清爽；雪莉桶：果乾、巧克力、香料、厚重；葡萄酒桶：莓果、單寧。","say":"「威士忌的顏色和香草、果乾味大多來自橡木桶，所以看桶型就大概知道是什麼風格。」","rel":["angelshare","caskfinish","seasoned","agestatement","caramel"],"link":[["本站 87 種桶型百科","regions.html#cask"]],"src":[["Scotch Whisky Association：FAQ","https://www.scotch-whisky.org.uk/discover-scotch/faqs/"],["Wikipedia：Scotch whisky","https://en.wikipedia.org/wiki/Scotch_whisky"],["FRW：Kavalan, Taiwan's first whisky distillery","https://www.frw.co.uk/editorial/kavalan-taiwans-first-whisky-distillery"]],"p":[]},{"id":"angelshare","s":"w","cat":"威士忌為什麼","t":"「天使的分享」是什麼？為什麼越老的酒越貴？","en":"Angel's Share","short":"威士忌在木桶裡每年會蒸發掉一部分，浪漫地叫「天使的分享」。放越久剩越少，加上要佔倉庫、等很多年，所以高年份特別貴。台灣氣候熱，蒸發得比蘇格蘭快很多。","what":"木桶不是完全密封的，熟成時酒會從木頭慢慢蒸發。維基百科寫一個桶 4 年可能蒸發約 45 公升。","why":[["放越久剩越少","年份越高，桶裡剩的酒越少，同一桶能裝的瓶數就少。"],["乾或濕的倉庫不一樣","乾燥的倉庫水蒸發得多、酒會變更烈；潮濕的倉庫酒精蒸發得多、酒會變淡。"],["台灣蒸發得特別快","噶瑪蘭師傅說一般年份約 10–12%，特別熱的夏天曾高到 18%（官方參訪報導）；所以熱帶威士忌熟得快但「損耗」也大。"]],"facts":[["一桶 4 年可能蒸發","約 45 公升"],["噶瑪蘭（宜蘭）","一般約 10–12%，熱夏曾到 18%"]],"taste":"天使分享本身不改變味道，但它代表時間：越老的酒越濃縮、越深沉。","say":"「威士忌每年都會被天使喝掉一點，越老剩越少，所以 25 年、30 年的價格會跳很多。」","rel":["oak","agestatement","caskstrength"],"src":[["Wikipedia：Whisky","https://en.wikipedia.org/wiki/Whisky"],["Wikipedia：Barrel（Angel's share 段）","https://en.wikipedia.org/wiki/Angel%27s_share"],["Alcademics：Kavalan distillery visit","https://alcademics.com/kavalan-whisky-distillery-visit-in-yilan-taiwan/"]],"p":[]},{"id":"agestatement","s":"w","cat":"威士忌為什麼","t":"酒標上的「12 年」是什麼意思？沒寫年份（NAS）是比較差嗎？","en":"Age Statement / NAS","short":"年份＝瓶中「最年輕」那桶酒的年數，裡面可能還有更老的酒。沒標年份（NAS）只保證至少 3 年，不代表比較差，是讓調酒師用不同年齡的酒自由搭配。","what":"蘇格蘭威士忌規定：酒標上的年份一定是瓶中最年輕原酒的熟成年數。不標年份的叫 NAS（No Age Statement）。","why":[["用最年輕的算","一瓶 12 年可能用了 12、15、18 年的原酒，但只能標最年輕的 12 年。"],["為什麼要出 NAS","不被年份綁住，調酒師可以用年輕有活力的酒搭配老酒，做出特定風味（例如特定桶型、原桶強度）。"],["NAS 的底線","依法至少熟成 3 年。"],["裝瓶後不會再變老","威士忌只在桶裡熟成，裝瓶後就不再增加年份；放 10 年的 12 年還是 12 年。"]],"facts":[["年份代表","瓶中最年輕原酒"],["NAS 最低","3 年"],["瓶中熟成","不會（只在桶中熟成）"]],"taste":"NAS 常有比較明亮、活潑的風格；高年份通常更圓潤、木桶味更深，但不一定「比較好喝」，看個人喜好。","say":"「12 年是指裡面最年輕的酒有 12 年；沒寫年份的不是比較差，是酒廠想做特別的風味。」","rel":["oak","angelshare","blend","store_spirit"],"src":[["Wikipedia：Scotch whisky","https://en.wikipedia.org/wiki/Scotch_whisky"],["Wikipedia：Whisky","https://en.wikipedia.org/wiki/Whisky"],["Scotch Whisky Association：FAQ","https://www.scotch-whisky.org.uk/discover-scotch/faqs/"]],"p":[]},{"id":"chillfilter","s":"w","cat":"威士忌為什麼","t":"「非冷凝過濾」是什麼？為什麼有些酒加冰會變霧霧的？","en":"Non-Chill Filtered","short":"冷凝過濾＝把威士忌降到約 5–10°C 再過濾，濾掉低溫會讓酒變霧的脂肪酸、蛋白質、酯類。46.3% 以下的酒才需要。不過濾（NCF）保留更多口感，但加冰加水會霧霧的，這是正常的。","what":"冷凝過濾（Chill Filtration）主要是「外觀」考量：避免客人把酒放冷或加冰時看到混濁。","why":[["為什麼要過濾","低酒精度的威士忌遇冷，某些成分會析出變霧，客人可能以為壞掉。"],["為什麼有人不過濾","很多人認為過濾會讓口感變薄、香氣變少，所以標「非冷凝過濾 Non-Chill Filtered」強調比較原始、天然。"],["46.3% 是分界","酒精度 46.3% 以上本來就比較不會霧，所以很多 NCF 酒款會裝 46% 左右或原桶強度。"]],"facts":[["冷卻到","約 5–10°C"],["濾掉","脂肪酸、蛋白質、酯類"],["不需要過濾","46.3% 以上"],["不過濾的例子","亞伯樂 A'bunadh、拉弗格四分之一桶、雲頂"]],"taste":"非冷凝過濾的酒通常口感比較油潤、厚實。加冰變霧＝正常，回到室溫就會清澈。","say":"「這支沒有冷凝過濾，口感比較飽滿；加冰會有點霧霧的是正常的，代表味道都還在。」","rel":["caskstrength","caramel","water"],"src":[["Wikipedia：Chill filtering","https://en.wikipedia.org/wiki/Chill_filtering"],["Scotch Whisky Association：FAQ（非冷凝過濾加冰會霧）","https://www.scotch-whisky.org.uk/discover-scotch/faqs/"]],"p":["deanston-10y-bordeaux","rosebank-31y-release-two","tamdhu-ambar-2008","glenmorangie-tusail","ardbeg-uigeadail","ardbeg-corryvreckan","ardbeg-anthology-beithir","ardbeg-y2k-24y","ardbeg-21-seann-chreag","ardbeg-smokiverse","ardbeg-dolce","ardbeg-smoketrails-manzanilla","ardbeg-smoketrails-coterotie","laphroaig-25y-bessie","royalsalute-51y-time-series","aberlour-16y-2009-sc","aberlour-25y-sb","aberlour-abunadh","aberlour-suthainn","aberlour-15y-sb","aberlour-17y-sb","caperdonich-peated-25y","omar-cs-df","kavalan-solist-manzanilla","kavalan-solist-brandy","kavalan-solist-madeira","kavalan-solist-fino","kavalan-peatist-oloroso","kavalan-peatist-bourbon","bunnyville-oolong","bunnyville-golden-muscat","dalmore-ps3-1","dalmore-ps3-2","dalmore-ps3-3","fettercairn-21y","glenfiddich-vat-3-cny","glenfiddich-31y-chateau","glendronach-1991-sc","glendronach-1992-c8312","glendronach-1993-c6575","glendronach-1993-c6852","glendronach-1994-c118","glendronach-1995-c3052","balvenie-15y-1931","glengrant-12y","bunnahabhain-toiteach","bunnahabhain-stiuireadair","bunnahabhain-40y","shinobu-10y","shinobu-10y-lightpeat","tomatin-16y","xop-macallan-1990-30y","aberfeldy-25y","macallan-rare-cask-black","macallan-oscuro"]},{"id":"caramel","s":"w","cat":"威士忌為什麼","t":"威士忌可以加焦糖色嗎？「天然原色」是什麼意思？","en":"E150a Caramel / Natural Colour","short":"蘇格蘭威士忌除了水，只准加一種東西：E150a 焦糖色，用來讓每批顏色一致、看起來更深。標「天然原色 Natural Colour」＝沒加焦糖色。","what":"E150a 是普通焦糖色素。依蘇格蘭法規，它是威士忌唯一被允許的添加物（加水除外）。","why":[["顏色一致","每一桶顏色都不一樣，加一點焦糖色可以讓同一支酒每批看起來一樣。"],["看起來比較深、比較老","單一麥芽的資料寫到，焦糖色會讓酒「看起來更濃郁、更有年份感」。"],["為什麼有人強調不加","想讓客人看到桶子真正給的顏色，所以標 Natural Colour、天然原色。"]],"facts":[["唯一允許的添加物","E150a 焦糖色（加水以外）"],["不加的標示","Natural Colour／天然原色"]],"taste":"一般認為少量焦糖色對味道影響很小；判斷風格請看桶型，不要只看顏色深淺。","say":"「顏色深不一定比較老，可能加了焦糖色；這支標天然原色，顏色就是桶子給的。」","rel":["chillfilter","oak"],"src":[["Wikipedia：Scotch whisky","https://en.wikipedia.org/wiki/Scotch_whisky"],["Wikipedia：Single malt whisky","https://en.wikipedia.org/wiki/Single_malt_whisky"]],"p":["tamdhu-ambar-2008","ardbeg-smoketrails-coterotie","octomore-151","macallan-12y-110proof","glendronach-10y","tomatin-16y","aberfeldy-25y","macallan-anoe-finale","macallan-carta-nautica-1987","macallan-ts-sherry-cask","macallan-12y-dc","macallan-15y-dc"]},{"id":"caskstrength","s":"w","cat":"威士忌為什麼","t":"「原桶強度」是什麼？優點缺點？為什麼大部分威士忌要加水到 40–46%？","en":"Cask Strength","short":"原桶強度＝從桶裡取出直接裝瓶、不加水稀釋，通常約 50–65%。優點是最濃、可自己加水調整；缺點是太烈、每批不同、比較貴。一般酒款會加水到 40–46%，比較順口、成本也比較低。","what":"原桶強度（Cask Strength、Barrel Proof）是威士忌從桶子取出後不加水、直接裝瓶的度數，每批都不一樣。","why":[["為什麼一般要加水","大多數人覺得 40–46% 比較好入口，也比較經濟。"],["為什麼有人喜歡原桶","香氣、口感最濃，喝的人可以自己加水調整到喜歡的程度。"],["每批不同","入桶度數（蘇格蘭常見約 63.5%）加上在桶裡放多久、倉庫冷熱乾濕都會改變度數，所以原桶強度酒款的度數常寫「以酒標為準」；放很久的老酒也可能只剩 41–45%。"],["優點","最濃、最完整（沒被水稀釋）；可以自己加水決定濃淡；常常同時不冷凝過濾、天然色；批次、桶號有收藏比較的樂趣。"],["缺點","酒精刺激強，新手直接喝容易嗆、喝不出細節；每批度數風味不同；價格通常比標準款高；一杯酒精量是 40% 酒的約 1.5 倍，容易喝多。"]],"steps":["先純飲一小口讓舌頭適應","加 2–3 滴常溫水，搖一搖等 30 秒","再聞再喝，還太烈就再加幾滴","慢慢調到自己喜歡的濃淡"],"facts":[["常見度數","約 50–65%"],["一般裝瓶","40–46%"],["蘇格蘭常見入桶度數","約 63.5%"],["美國波本入桶上限","125 Proof（62.5%）"],["帶上飛機","24–70% 每人 5 公升；超過 70% 禁止"]],"taste":"很濃、很熱、很香；建議先聞、小口喝，再加幾滴水試試香氣變化。","say":"「這是原桶強度，沒有加水，味道最濃；可以加幾滴水，香氣會整個打開。」","rel":["water","chillfilter","agestatement"],"link":[["知識庫：原桶強度的優點與缺點、適合誰、常見誤解","./#kb:kbt-cs"]],"src":[["Wikipedia：Cask strength","https://en.wikipedia.org/wiki/Cask_strength"],["Scientific Reports 2017：Dilution of whisky","https://www.nature.com/articles/s41598-017-06423-5"]],"p":["glenfarclas-no23-2014","bowmore-30y-new","hakushu-12y-2","royalsalute-51y-time-series","aberlour-25y-sb","aberlour-abunadh","aberlour-15y-sb","aberlour-17y-sb","glenlivet-sc-25y","omar-cs-mini","omar-cs-df","omar-cs-bourbon","omar-cs-lychee","omar-0-omar","omar-0-omar-2","omar-0-omar-3","kavalan-solist-manzanilla","kavalan-6","kavalan-solist-brandy","kavalan-solist-madeira","kavalan-solist-fino","kavalan-peatist-oloroso","kavalan-peatist-bourbon","bunnyville-lychee","bunnyville-golden-muscat","glenrothes-sc-19y-1435","glenrothes-sc-22y-12100","glenfarclas","omc-bunnahabhain-2008-14y","omc-craigellachie-2008-15y","omc-miltonduff-1990-29y","sss-caperdonich-1994-25y","gm-speymalt-macallan-2002-20y","or-dufftown-1975-44y","or-bunnahabhain-1991-32y","or-dalmore-2000-23y","kkl-06l-6","kkl-06l-7"]},{"id":"water","s":"w","cat":"威士忌為什麼","t":"為什麼威士忌加幾滴水會變香？","en":"Adding Water","short":"2017 年一篇研究用電腦模擬發現：酒精度降到約 45% 以下時，帶煙燻香的分子（愈創木酚）比較容易跑到酒的表面，所以加水後香氣更容易聞到。","what":"這是 Karlsson 與 Friedman 2017 年發表在《Scientific Reports》的研究，用分子模擬（不是品酒實驗）觀察水、酒精與愈創木酚的位置。","why":[["原桶強度時香氣被「鎖」在酒裡","酒精度約 59% 以上時，愈創木酚多半待在液體內部。"],["降到約 45% 以下比較容易聞到","加水稀釋後，它比較容易出現在液面，研究者推論這讓香氣更容易被聞到。"],["所以加水要「幾滴」慢慢試","加太多會把酒變淡，先加幾滴、聞一聞、再決定。"]],"facts":[["研究","Karlsson & Friedman, Sci Rep 2017"],["香氣分子在液面","約 45% 以下"],["被拉進液體","約 59% 以上"]],"taste":"高度數或泥煤威士忌加幾滴水，常會聞到更多果香、煙燻。","say":"「原桶強度的酒可以加幾滴水，有研究發現降到 45% 左右香氣比較容易跑出來。」","rel":["caskstrength","peat","chillfilter"],"src":[["Scientific Reports：Dilution of whisky – the molecular perspective","https://www.nature.com/articles/s41598-017-06423-5"]],"p":[]},{"id":"peat","s":"w","cat":"威士忌為什麼","t":"泥煤味（煙燻味）是怎麼來的？ppm 是什麼？","en":"Peat / Phenol PPM","short":"用燒泥煤的煙來烘乾發芽大麥，煙裡的酚類附著在麥芽上，做出來的酒就有煙燻味。ppm＝麥芽酚類含量，強泥煤約 25–50 ppm，艾雷島最出名。","what":"泥煤（Peat）是沼澤裡長年堆積、還沒完全分解的植物殘骸，曬乾後可以當燃料；拿來烘乾麥芽就會帶進煙燻味。","why":[["煙燻來自烘麥芽","燒泥煤的煙帶有酚類，烘乾時附著在麥芽上，蒸餾後留在酒裡。"],["ppm 看強度","用麥芽的酚類含量（ppm）表示：輕微約 2–3 ppm，重泥煤約 25–50 ppm；艾雷島最泥煤，Octomore 超過 100 ppm。"],["不是所有艾雷島都煙燻","布納哈本就以「無泥煤」聞名，李奧社長影片說它是艾雷島最特別的。"]],"facts":[["輕泥煤","約 2–3 ppm"],["重泥煤","約 25–50 ppm"],["Octomore","超過 100 ppm"]],"taste":"煙燻、營火、海藥味、碘酒、培根；拉弗格有人說有「瀝青」味（林一峰影片）。","say":"「煙燻味是用泥煤烘麥芽來的；怕煙燻可以從輕泥煤開始，或選布納哈本這種不煙燻的艾雷島。」","rel":["water","malt","stills"],"src":[["Wikipedia：Single malt whisky","https://en.wikipedia.org/wiki/Single_malt_whisky"],["Wikipedia：Peat","https://en.wikipedia.org/wiki/Peat"]],"p":["ardbeg-smokiverse","ardbeg-smoketrails-manzanilla","ardbeg-smoketrails-coterotie","yoichi-grande","yamazaki-2","hakushu-nas","octomore-151","octomore","octomore-2","royalsalute-21y-5","royalsalute-62-peated","caperdonich-peated-25y","kavalan-peatist-oloroso","kavalan-peatist-bourbon","jura-21y","balvenie-19y","hinotori-goldorak-peated","bunnahabhain-toiteach","shinobu-10y-lightpeat","homie-umeshu-trio","kiuchi-whisky-cask","macallan-rare-cask-black"]},{"id":"stills","s":"w","cat":"威士忌為什麼","t":"蒸餾器的形狀為什麼會影響味道？壺式 vs 連續式差在哪？","en":"Pot Still / Column Still","short":"高、細長的蒸餾器讓蒸氣上升時更多回流，留下比較輕盈的酒（格蘭傑蒸餾器是蘇格蘭最高）。壺式一次一批、風味重；連續式不停產、比較輕柔。","what":"單一麥芽威士忌用壺式蒸餾器（Pot Still）一批一批蒸，通常蒸兩次；穀物威士忌多用連續式（Column Still）。","why":[["回流（Reflux）","蒸氣在高高的鵝頸裡上升時，比較重的成分會凝結流回去，所以高的蒸餾器做出比較輕的酒（蘇格蘭威士忌協會也這麼說）。"],["格蘭傑的長頸鹿蒸餾器","格蘭傑的蒸餾器高約 8 公尺、頸部約 5.14 公尺，是蘇格蘭最高，品牌說這讓酒特別輕盈。"],["壺式 vs 連續式","壺式一次一批，保留比較多原料風味；連續式可以不停生產，酒比較輕柔，常用在調和威士忌的穀物原酒。"]],"facts":[["格蘭傑蒸餾器","約 8.00 公尺，頸部約 5.14 公尺"],["壺式蒸餾出酒","約 60–80%"]],"taste":"高蒸餾器：花香、果香、細緻；矮胖蒸餾器：厚重、油潤。","say":"「格蘭傑的蒸餾器跟長頸鹿一樣高，所以酒特別細緻、花果香。」","rel":["wormtub","blend","malt"],"src":[["Scotch Whisky Association：FAQ（高蒸餾器較輕）","https://www.scotch-whisky.org.uk/discover-scotch/faqs/"],["Wikipedia：Pot still","https://en.wikipedia.org/wiki/Pot_still"],["Wikipedia：Glenmorangie","https://en.wikipedia.org/wiki/Glenmorangie"]],"p":["glenmorangie-harrison-ford","glenmorangie-cadboll","glenmorangie-dornoch","glenmorangie-tarlogan","glenmorangie-tayne","glenmorangie-12y-accord","glenmorangie-14y-elementa","glenmorangie-16y-tribute","glenmorangie-18y-2","glenmorangie-19y","glenmorangie-25y-2","glenmorangie-gv-1993","glenmorangie-gv-1995","glenmorangie-tusail","glenmorangie-signet","glenmorangie-signet-reserve"]},{"id":"wormtub","s":"w","cat":"威士忌為什麼","t":"蟲桶冷凝是什麼？為什麼慕赫、泰斯卡的酒比較厚重？","en":"Worm Tub","short":"蟲桶＝把蒸氣導進泡在冷水大桶裡的長長銅管冷凝。冷凝快、和銅接觸少，酒比較厚重、肉感、帶一點硫味。慕赫、泰斯卡、大雲（Dalwhinnie）、歐本都用。","what":"現在多數酒廠用「殼管式冷凝器」，蟲桶是傳統做法：盤繞的銅管（像一條蟲）泡在室外的冷水桶裡。1960 年代以後大多數酒廠都換掉了。","why":[["和銅接觸少＝比較厚重","銅會帶走硫味。蟲桶冷凝得快、銅接觸少，酒保留較多硫化物與厚重感。"],["但也看水溫","泰斯卡的人說水溫較高時冷凝變慢、銅接觸多，也可能做出比較輕的酒。"],["為什麼現在少見","銅管會漏、水桶很大、清理費工，殼管式比較好維修。"]],"facts":[["使用的酒廠（部分）","慕赫、泰斯卡、大雲、歐本、克拉格摩爾、皇家藍勛、老富特尼、山崎（初次蒸餾）"]],"taste":"肉感、油脂感、厚實；慕赫被叫做「達夫鎮野獸」就是這種風格（李奧社長影片也提到室外蟲桶）。","say":"「慕赫用的是傳統蟲桶冷凝，酒比較厚、有肉感，喜歡重口味的客人很適合。」","rel":["stills","malt"],"src":[["Whisky Advocate：The Worm Tub","https://whiskyadvocate.com/the-worm-tub-an-old-school-method-but-not-a-vanished-art"],["Master of Malt：What are worm tubs","https://www.masterofmalt.com/blog/post/what-are-worm-tubs-and-why-do-they-matter/"]],"p":["mortlach-16y-nb02","mortlach-begin-beyond","mortlach-12y","mortlach-14y","mortlach-16y","mortlach-20y","mortlach-30y","mortlach-14y-te","mortlach-20y-te","talisker-surge","talisker","talisker-18y","talisker-25y-2","talisker-41y"]},{"id":"blend","s":"w","cat":"威士忌為什麼","t":"單一麥芽和調和威士忌差在哪？為什麼要調和？","en":"Single Malt vs Blended","short":"單一麥芽＝同一間酒廠、只用發芽大麥、壺式蒸餾。調和＝麥芽威士忌＋穀物威士忌混合，為了每批味道穩定、更順口。蘇格蘭約九成是調和。","what":"Single Malt：同一家酒廠、100% 發芽大麥、壺式蒸餾、橡木桶至少 3 年。Blended：把多家酒廠的麥芽威士忌和穀物威士忌混合（約翰走路、起瓦士、皇家禮炮、百齡罈）。","why":[["穩定的品牌風格","調酒師把各種麥芽與穀物威士忌組合，讓每年同一支酒味道一致。"],["更順口、也更親民","穀物威士忌比較輕柔，調和後順口好入門。"],["單一麥芽強調個性","單一酒廠的風土、蒸餾器、桶型特色比較明顯。"]],"facts":[["蘇格蘭調和比例","約 90%"]],"taste":"調和：圓潤、平衡；單一麥芽：個性鮮明（雪莉、泥煤、花果各有特色）。單一不等於比較好，皇家禮炮 21、起瓦士 25 都在國際比賽拿過高分。","say":"「單一麥芽像單一產地咖啡，調和像精品配方豆；調和不是比較差，皇家禮炮 21 年在盲飲比賽拿過最高等級。」","rel":["stills","agestatement","malt"],"link":[["知識庫：調和威士忌","./#kb:blend"]],"src":[["Wikipedia：Scotch whisky","https://en.wikipedia.org/wiki/Scotch_whisky"],["Wikipedia：Single malt whisky","https://en.wikipedia.org/wiki/Single_malt_whisky"],["Wikipedia：Blended whiskey","https://en.wikipedia.org/wiki/Blended_whiskey"]],"p":[]},{"id":"caskfinish","s":"w","cat":"威士忌為什麼","t":"「過桶」Finish 是什麼？為什麼要換桶？","en":"Cask Finish","short":"先在一種桶（多半是波本桶）熟成多年，最後幾個月到幾年換到另一種桶（雪莉、波特、馬德拉、葡萄酒），加上一層新的風味。","what":"過桶（Finish、換桶、二次熟成）＝主要熟成後，再放進另一種桶一段時間。例如百富 12 年雙桶、格蘭傑 Lasanta 雪莉桶。","why":[["疊加風味","波本桶打底給香草蜂蜜，再用雪莉桶加果乾、用波特桶加莓果。"],["做出變化","同一間酒廠可以用不同的過桶做出一整個系列。"],["原廠講師說法","前身酒提供香氣線索（黑＝卡本內、紅＝黑皮諾、白＝蘇玳），但過桶結果仍依商品核對。"]],"steps":["新酒入波本桶","熟成多年（打底）","換到雪莉／波特／葡萄酒桶","過桶數月到數年","裝瓶"],"taste":"看最後那個桶：雪莉→果乾巧克力；波特→紅莓；馬德拉→焦糖熱帶水果；蘇玳→杏桃蜂蜜；蘭姆→熱帶水果紅糖。","say":"「這支先在波本桶熟成，最後換到雪莉桶，所以同時有香草和果乾的味道。」","rel":["oak","sherry","port","madeira","winecask3","seasoned"],"link":[["本站 87 種桶型百科","regions.html#cask"],["葡萄酒桶三個果香方向","regions.html#c-winecask"]],"src":[["Wikipedia：Scotch whisky","https://en.wikipedia.org/wiki/Scotch_whisky"]],"p":["glenmorangie-signet-reserve","bowmore-14y","bowmore-16y","bowmore-19y","bowmore-22y","bowmore-19y-cny","bowmore-22y-fq","bowmore-33y-fq","bowmore-31y-timeless","octomore-2","chivas-xv","royalsalute-21y-6","royalsalute-21y-polo8","royalsalute-25y-sb-008","royalsalute-coronation-kc3","aberlour-13y","aberlour-18y","aberlour-15y-sb","aberlour-17y-sb","longmorn-25y","glenlivet-13y-rum","glenlivet-14y","glenlivet-19y","glenlivet-21y-sampleroom","glenlivet-25y-sampleroom","glenlivet-4","glenlivet-3","glenlivet-groundbreaker-ch1","omar-cs-mini","omar-cs-lychee","omar-triple-cask","omar-0-omar","omar-0-omar-2","omar-0-omar-3","kavalan-sherry-triple-1l","kavalan-4","kavalan-concertmaster-sherry","bunnyville-oolong","singleton-honey-dual","singleton-12y","singleton-12y-3","singleton-12y-2","singleton-21y","singleton-41-41y-singleton-2","singleton","mortlach-16y-nb02","mortlach-30y","mortlach-20y-te","jw-7","macallan-18y-dc","macallan-double-cask-30y","tamnavulin-oloroso","dalmore-portfolio-s1-1","dalmore-ps3-1","dalmore-ps3-2","dalmore-ps3-3","fettercairn-12y","fettercairn-23y","glenfiddich-19y-madeira","glenfiddich-21y","glenfiddich-23y-french","glenfiddich-26y-cognac","gf-12y-rum-1l","gf-15y-sherry-07l","balvenie-classic","balvenie-15y","balvenie-18y-2","balvenie-21y-port","aberfeldy-12y","aberfeldy-25y","dewars-15y","dewars-18y","dewars-double-double-36y","aultmore-12y","aultmore-18y","aultmore-21y-2","royalbrackla-12y","jameson-1l","macallan-12y-dc"]},{"id":"winecask3","s":"w","cat":"威士忌為什麼","t":"葡萄酒桶的三個果香方向是什麼？","en":"Wine Cask Directions","short":"原廠講師課程：用前身酒判斷香氣方向——黑（卡本內：黑醋栗、黑櫻桃）、紅（黑皮諾：草莓、紅櫻桃）、白（蘇玳：杏桃、蜜桃）。實際風味仍以商品為準。","what":"這是原廠講師課程投影片「06／葡萄酒桶」的整理：前身酒提供香氣線索，過桶結果仍依商品核對。本站把波特歸黑、馬德拉／馬沙拉另列「加烈」，是延伸分類。","why":[["用顏色記","黑葡萄（卡本內）＝黑色水果；紅（黑皮諾）＝紅色水果；白（蘇玳甜白酒）＝黃色水果、蜂蜜。"],["方便跟客人說","客人說喜歡什麼水果，就往那個方向推。"]],"taste":"黑：黑醋栗、黑櫻桃、單寧；紅：草莓、紅櫻桃、輕盈；白：杏桃、蜜桃、蜂蜜。","say":"「葡萄酒桶分三種方向：黑色水果、紅色水果、黃色水果，您喜歡哪一種？」","rel":["caskfinish","noblerot","tannin"],"link":[["葡萄酒桶完整說明＋本店 77 支表","regions.html#c-winecask"]],"src":[["原廠講師課程「06／葡萄酒桶」（原廠講師資料）","regions.html#c-winecask"]],"p":["deanston-10y-bordeaux","glenmorangie-harrison-ford","glenmorangie-cadboll","glenmorangie-gv-1993","glenmorangie-gv-1995","ardbeg-dolce","ardbeg-smoketrails-coterotie","yamazaki","bowmore-14y","bowmore-19y","bowmore-22y","bowmore-19y-cny","portcharlotte-10y","glenlivet-groundbreaker-ch1","omar-cs-mini","omar-0-omar-3","kavalan-vinho-1l","kavalan-1l","bunnyville-golden-muscat","singleton","mortlach-30y","tamnavulin","tamnavulin-2","dalmore-king","dalmore-2","dalmore-45y-4","dalmore-17y-no3","dalmore-portfolio-s1-1","dalmore-portfolio-s1-2","dalmore-portfolio","dalmore-portfolio-2","dalmore-ps3-1","dalmore-ps3-2","dalmore-ps3-3","dalmore-the","dalmore","glenfiddich-vat","glenfiddich-23y-french","glenfiddich-31y-chateau","gf-solera-1l","gf-19y-amf1-07l","bunnahabhain","shinobu-15y","tomatin-16y","balvenie-11-hungarian-red-wine-cask"]},{"id":"seasoned","s":"w","cat":"威士忌為什麼","t":"「雪莉桶」裡真的裝過雪莉酒嗎？什麼是調味桶？","en":"Seasoned Cask","short":"現在大多數威士忌用的雪莉桶是「調味桶」：專門為威士忌做的新橡木桶，先裝雪莉酒浸潤 1–2 年再倒掉給威士忌用。傳統的酒窖老桶已經很少。","what":"1980 年代起雪莉酒改在產區裝瓶，不再整桶運到英國，酒窖老桶變稀少；酒廠就請西班牙桶廠做新桶，先裝雪莉「調味」（Seasoning）。2015 年起有 Sherry Cask 認證，2017 年起規定至少浸潤 1 年。","why":[["因為老桶不夠","早期英國進口整桶雪莉，空桶就給威士忌用；後來雪莉改在西班牙裝瓶，空桶來源沒了。"],["調味桶的味道更集中","新桶＋雪莉浸潤，木頭與雪莉的味道都很明顯。"],["麥卡倫的做法","TVBS 專題提到麥卡倫從橡木森林、自家製桶廠到自家雪莉酒莊潤桶。"]],"facts":[["Sherry Cask 認證","2015 年註冊"],["最少浸潤","2017 年起至少 1 年"],["常見調味","1–2 年"]],"taste":"調味桶：果乾、香料、木頭感明顯；歐洲橡木比美國橡木單寧更多、更辛香。","say":"「現在的雪莉桶多是先用雪莉酒泡過的新桶，麥卡倫是自己做桶、自己請酒莊潤桶。」","rel":["sherry","oak","caskfinish"],"link":[["雪莉桶完整說明（本站）","regions.html#c-sherry"]],"src":[["Sherry.wine：Sherry Cask 認證","https://www.sherry.wine/"],["本站雪莉桶完整說明（r224 查證）","regions.html#c-sherry"]],"p":["singleton-2","mortlach-begin-beyond","glenrothes-sc-22y-12100","macallan-diamonds-55th","macallan-aurora","macallan-18y-dc","macallan-18y-2","macallan-30y","macallan-double-cask-30y","macallan-carta-nautica-20y","macallan-guardian-oak","macallan-harmony","gf-12y-rum-1l","macallan-anoe-finale","macallan-carta-nautica-1987","macallan-ts-sherry-cask","macallan-12y-dc","macallan-rare-cask-black"]},{"id":"malt","s":"w","cat":"威士忌為什麼","t":"為什麼大麥要先「發芽」？麥芽是什麼？","en":"Malting","short":"大麥的澱粉酵母吃不了。讓大麥發芽會產生酵素，之後在糖化時把澱粉變成糖，酵母才能發酵出酒精。烘乾麥芽時燒泥煤就會有煙燻味。","what":"麥芽（Malt）是發芽後烘乾的大麥。單一麥芽威士忌只能用 100% 發芽大麥。","why":[["把澱粉變成糖","發芽讓大麥產生酵素，糖化時把澱粉轉成糖。"],["用烘乾停止發芽","發到剛好就烘乾；用泥煤當燃料，煙燻味就附在麥芽上。"]],"steps":["浸泡大麥","發芽","烘乾（可燒泥煤）","磨碎糖化","發酵","蒸餾","入桶"],"taste":"麥芽本身帶穀物、麵包、餅乾的香氣，是威士忌的底味。","say":"「大麥要先發芽，澱粉才能變成糖、再變成酒；烘乾時燒泥煤就會有煙燻味。」","rel":["peat","stills","blend"],"src":[["Wikipedia：Malt","https://en.wikipedia.org/wiki/Malt"],["Wikipedia：Single malt whisky","https://en.wikipedia.org/wiki/Single_malt_whisky"]],"p":[]},{"id":"japanese","s":"w","cat":"威士忌為什麼","t":"日本威士忌為什麼 2024 年起有新標準？","en":"Japanese Whisky Standard","short":"以前日本沒有「日本威士忌」的法定定義，進口原酒在日本裝瓶也能叫日本威士忌。2021 年業界自訂標準，2024 年緩衝期結束：要在日本發酵、蒸餾、熟成、裝瓶，用日本的水。","what":"日本洋酒酒造組合（JSLMA）2021 年訂了自律標準（不是法律），2024 年起全面適用。","why":[["過去定義太寬","2010 年代日本威士忌爆紅，但有些「日本威士忌」其實用了進口原酒，被批評。"],["新標準重點","在日本發酵、蒸餾、熟成、裝瓶；要用部分麥芽；用日本的水。"]],"facts":[["訂定","2021 年（自律標準）"],["全面適用","2024 年"]],"taste":"山崎、白州、響、余市、宮城峽、竹鶴等是本店常見日本威士忌。","say":"「從 2024 年起，寫日本威士忌的要在日本蒸餾、熟成、裝瓶，買的時候看酒標就比較安心。」","rel":["blend","agestatement"],"link":[["知識庫：日本台灣威士忌","./#kb:wjt"]],"src":[["Wikipedia：Japanese whisky","https://en.wikipedia.org/wiki/Japanese_whisky"]],"p":["the-nikka-2025","yoichi-grande","miyagikyo-grande","taketsuru-grande","yoichi-nas","yoichi-12y","miyagikyo-nas","yamazaki-2","yamazaki","yamazaki-12y","yamazaki-18y-2","yamazaki-25y-2","hakushu-nas","hakushu-12y-2","hakushu-18y","hibiki","hibiki-12y-te","hibiki-21y","hibiki-30y-2","hibiki-2","hinotori-goldorak-peated","shinobu-10y","shinobu-15y-2","shinobu-10y-lightpeat","akashi-blue"]},{"id":"cognac","s":"w","cat":"其他烈酒","t":"干邑為什麼要蒸餾兩次？VS、VSOP、XO 差幾年？","en":"Cognac","short":"干邑要用銅製壺式蒸餾器蒸兩次，再在法國橡木桶（多用利慕贊、特朗塞）至少 2 年。等級看最年輕原酒：VS 2 年、VSOP 4 年、XO 10 年（2018 年起）。","what":"干邑（Cognac）是法國干邑區的葡萄白蘭地。產區分六個區，最好的大香檳區（Grande Champagne）約 13,766 公頃、小香檳區約 16,171 公頃。","why":[["法規規定兩次蒸餾","蒸餾器的設計和尺寸都受法律管制。"],["產區名稱代表風土","不同土壤、微氣候做出不同個性的原酒，所以會標「大香檳區」「香檳干邑 Fine Champagne」等產區名。"],["XO 為什麼變 10 年","原本 6 年，2018 年 4 月提高到 10 年（原訂 2016，因庫存不夠延後）。"]],"facts":[["VS","至少 2 年"],["VSOP","至少 4 年"],["Napoléon","至少 6 年"],["XO","至少 10 年（2018 起）"],["XXO","至少 14 年"]],"taste":"葡萄乾、杏桃、香草、花香；年份越高越多雪茄盒、皮革、堅果。","say":"「干邑的等級看最年輕的酒：VSOP 至少 4 年、XO 至少 10 年；人頭馬都是香檳區的干邑。」","rel":["armagnac","oak"],"link":[["知識庫：干邑","./#kb:kbs-cog-ov"]],"src":[["Wikipedia：Cognac","https://en.wikipedia.org/wiki/Cognac"]],"p":["hennessy-vsop-hennessy-1l","hennessy-07l-2","hennessy-xo-1l","cognac-brandy-hennessy-1l","hennessy-xo-kim-jones","hennessy-xo-cny-2026","hennessy-xxo-1l","hennessy","hennessy-paradis-hennessy-005l","hennessy-paradis-hennessy-035l","hennessy-paradis-hennessy-07l","hennessy-07l","hennessy-paradis-bernardaud-1l","hennessy-07l-3","hennessy-mbs-no4-05l","hennessy-no5-05l","remymartin-club-exception-1l","remymartin-vsop-07l","remymartin-vsop-1l","remymartin-vsop-1l-2","remymartin-05l","remymartin-07l","remymartin-xo-rfs","remymartin-xo-eoy","remymartin-excellence-1l","louis-xiii-petit","louis-xiii-07l","martell-vsop-redbarrel-1l","martell-07l-2","martell-noblige-1l","martell-07l-3","martell-noir-cny","martell-035l","martell-07l","martell-3l","martell-1l","martell-05l","martell-07l-4","martell-1l-2","martell-15l","martell-xo-cny-2026","martell-xxo-07l","martell-lor-snake-2025"]},{"id":"armagnac","s":"w","cat":"其他烈酒","t":"雅馬邑和干邑有什麼不同？","en":"Armagnac","short":"雅馬邑傳統上只用連續式蒸餾一次（約 52–60%），干邑是壺式蒸兩次。蒸一次保留更多原料香氣，常被形容比干邑更香、更有個性。","what":"雅馬邑（Armagnac）是法國西南部的葡萄白蘭地，1936 年獲 AOC。","why":[["蒸餾方式不同","1818 年一種連續式蒸餾器的專利，造成雅馬邑和干邑最大的差別。"],["蒸一次＝香氣保留多","酒精度較低就取酒，保留比較多葡萄與發酵的香氣。"]],"facts":[["蒸餾後度數","約 52–60%"],["VS","木桶至少 1 年"],["VSOP","至少 4 年"],["XO／Hors d'âge","10 年"]],"taste":"比較奔放：李子乾、烤蘋果、香料。","say":"「雅馬邑只蒸一次，味道比干邑更奔放、果香更重。」","rel":["cognac"],"src":[["Wikipedia：Armagnac","https://en.wikipedia.org/wiki/Armagnac"]],"p":[]},{"id":"kaoliang","s":"w","cat":"其他烈酒","t":"高粱酒為什麼用「固態發酵」？金門高粱是什麼香型？","en":"Baijiu / Kaoliang","short":"中式白酒是把高粱等穀物加上「麴」，在固體狀態下發酵、蒸餾，跟威士忌的液態發酵不同。台灣金門高粱屬於「清香型」。","what":"白酒（Baijiu）多以高粱為主，用小麥或米做的麴（Qū）發酵；酒精度約 35–60%。香型主要有清香、濃香、醬香、米香。","why":[["固態發酵","穀物和麴是濕的固體一起發酵（不是加很多水的醪液），再直接蒸餾，產生白酒特有的香氣。"],["香型由做法決定","清香型用石材容器發酵、乾淨爽口；濃香型帶果香（己酸乙酯）；醬香型在石窖發酵，有醬香、鮮味。"],["金門高粱","維基百科把台灣高粱列為清香型；1950 年葉華成創立金城酒廠，1956 年起用金門酒廠的名稱。"]],"facts":[["白酒度數","約 35–60%"],["金門高粱香型","清香型"]],"taste":"清香型：乾淨、穀物甜、梨子般的果香，尾韻乾爽。","say":"「金門高粱是清香型白酒，用固態發酵，所以很乾淨、清爽；免稅限定的龍騰九霄、釀酒大師都很受歡迎。」","rel":["cognac"],"link":[["知識庫：中式白酒與高粱","./#kb:kbs-chn-ov"]],"src":[["Wikipedia：Baijiu","https://en.wikipedia.org/wiki/Baijiu"],["Wikipedia：Kinmen Kaoliang Liquor","https://en.wikipedia.org/wiki/Kinmen_Kaoliang_Liquor"]],"p":["liyang-16y-06l","yushan-06l-2","yushan-3y-pingan","yushan-6y-06l","yushan","yushan-10y-huoshen","yushan-10y-huoshen-red","yushan-xo-066","luyu-blacktea-kaoliang","mizang-kaoliang-42","yuwujin-6y","yuwujin-8y","kkl-yuxi-horse","kkl-lx2","kkl-05l","kkl-06l","kkl-06l-2","kkl-06l-4","kkl-dianzang-zhenpin-075","kkl","kkl-06l-3","kkl-master-06l","kkl-8y-06l","kkl-12y-06l","kkl-15y-06l","kkl-22y-06l","kkl-06l-6","kkl-06l-7","kkl-06l-5","kkl-4","kkl-2","kkl-longteng-750","kkl-dragon-06l","kkl-dragon-06l-2","kkl-longteng-750-blue","kkl-yuxi-dragon","kkl-yuxi-snake","kkl-yuxi-rabbit"]},{"id":"sake","s":"w","cat":"其他烈酒","t":"清酒為什麼米磨得越多越貴？精米步合是什麼？","en":"Sake Polishing Ratio","short":"精米步合＝磨完後剩下的比例，70% 代表磨掉 30%。米的外層脂肪、蛋白質多，會讓酒有雜味；磨得越多越乾淨香，但越費米、越貴。吟釀 ≤60%、大吟釀 ≤50%。","what":"清酒用米、米麴、水釀造，酒精度約 15–22%。","why":[["外層是雜味來源","米的外層有較多脂肪、蛋白質、維生素，留著會帶來雜味與粗糙感。"],["磨越多越香越輕","高度精米的清酒香氣強、口感輕、沒有雜味；有酒廠磨掉超過六成。"],["吟釀要低溫慢發酵","吟釀、大吟釀在約 5–10°C 慢慢發酵，香氣更多。"]],"facts":[["吟釀","精米步合 ≤60%"],["大吟釀","≤50%"],["清酒度數","約 15–22%"]],"taste":"大吟釀：花香、果香（蘋果、哈密瓜）、輕盈；純米：米香、鮮味較重。","say":"「獺祭二割三分就是米磨到剩 23%，所以特別乾淨香。」","rel":["ume"],"link":[["知識庫：清酒等級","./#kb:kbs-sake-grade"]],"src":[["Wikipedia：Sake","https://en.wikipedia.org/wiki/Sake"]],"p":["choya-075l-8","choya-075l-7","hakkaisan","hakkaisan-18l","dewazakura-3","dewazakura-18l","dewazakura-072l","dewazakura","dassai-dassai-072l","dassai-072l-3","dassai-2","dassai","dassai-072l-2","dassai-072l","dewazakura-torokeru-yamagata-momo-720ml","dewazakura-torokeru-yamagata-budo-720ml"]},{"id":"ume","s":"w","cat":"其他烈酒","t":"梅酒是怎麼做的？為什麼會用冰糖？","en":"Umeshu","short":"把青梅、糖泡在燒酎等烈酒裡至少三個月（最好半年以上），酒精度約 10–15%。「本格梅酒」＝只用梅子、糖、酒，沒有其他添加物。","what":"梅酒（Umeshu）是日本的利口酒。傳統配方：梅子 1 公斤、冰糖 500 公克到 1 公斤、燒酎 1.8 公升。","why":[["用烈酒泡出梅子味","酒精把梅子的香氣、酸味萃取出來。"],["糖讓它好入口","加糖平衡梅子的酸；傳統配方用冰糖或方糖（原因資料沒寫，常見說法是溶得慢，這裡不當作定論）。"],["放越久越圓潤","至少 3 個月，最好 6 個月以上；有的熟成 9 個月以上。"]],"facts":[["酒精度","約 10–15%"],["最少浸泡","3 個月（建議 6 個月以上）"],["本格梅酒","只用梅、糖、酒"]],"taste":"青梅酸香、杏仁、蜂蜜；用威士忌桶熟成的（木內）會多煙燻、啤酒般的香氣。","say":"「梅酒是青梅泡在酒裡做的，酒精度只有十幾度，加冰或加蘇打都很好喝。」","rel":["sake","liqueur"],"link":[["知識庫：梅酒","./#kb:kbs-ume"]],"src":[["Wikipedia：Umeshu","https://en.wikipedia.org/wiki/Umeshu"]],"p":["choya-075l-4","choya-075l-5","choya-075l-3","choya-075l-8","choya-075l-6","choya-05l","choya-075l-7","choya-075l","choya-5","choya-03l","choya-ice-nouveau-2026","choya-gold-cny-05l","suntory-umeshu-richamber","homie-umeshu-trio","gori-1l","yushan-umeshu-07","kiuchi","kiuchi-whisky-cask"]},{"id":"liqueur","s":"w","cat":"其他烈酒","t":"利口酒是什麼？和加烈酒有什麼不同？","en":"Liqueur","short":"利口酒＝烈酒＋糖＋水果、香草、香料等風味，通常不陳年。歐盟規定至少 15%、每公升至少約 100 公克糖。加烈酒則是「葡萄酒」加烈酒。","what":"利口酒（Liqueur）例如貝禮詩（Baileys）、君度、咖啡酒、梅酒。酒精度大多 15–30%，有些到 55%。","why":[["基底不同","利口酒的基底是烈酒；加烈酒的基底是葡萄酒。"],["一定是甜的","歐盟要求多數利口酒每公升至少 100 公克糖（櫻桃類 70 公克）。"]],"facts":[["歐盟最低度數","15%"],["歐盟最低糖量","多數 100 g/L"],["常見度數","15–30%"]],"taste":"甜、香，適合加冰、調酒、加進咖啡或甜點。","say":"「利口酒是烈酒加糖和香料，甜甜的，很適合加冰或加咖啡。」","rel":["fortified","ume"],"src":[["Wikipedia：Liqueur","https://en.wikipedia.org/wiki/Liqueur"]],"p":["kahlua-1l","bottega-pistacchio","bottega-07l","baileys-1l","baileys-1l-2","baileys-baileys-07l","baileys-07l","dewazakura-torokeru-yamagata-momo-720ml","dewazakura-torokeru-yamagata-budo-720ml"]},{"id":"tequila","s":"w","cat":"其他烈酒","t":"龍舌蘭和梅斯卡爾差在哪？為什麼梅斯卡爾有煙燻味？","en":"Tequila / Mezcal","short":"龍舌蘭只能用藍色龍舌蘭、產在哈利斯科等指定地區；梅斯卡爾可以用 30 多種龍舌蘭，把龍舌蘭心放在土坑裡用熱石頭烤約三天，所以有煙燻味。","what":"Tequila 至少 35%，分 Mixto（至少 51% 龍舌蘭）與 100% 龍舌蘭。酒標上的 NOM 是酒廠編號。","why":[["原料與產區規定","Tequila 只能用藍色龍舌蘭；Mezcal 用多種龍舌蘭。"],["煙燻來自土坑烤","梅斯卡爾的龍舌蘭心在地下坑窯烤，帶出強烈煙燻。"],["熟成等級","Blanco 未熟成或 2 個月內；Reposado 2 個月到 1 年；Añejo 1–3 年；Extra Añejo 3 年以上。"]],"facts":[["Tequila 最低度數","35%"],["Mixto","至少 51% 龍舌蘭"],["Reposado","2 個月–1 年"],["Añejo","1–3 年"],["Mezcal 度數","約 40–55%"]],"taste":"Tequila：青椒、柑橘、胡椒（Blanco）→ 香草焦糖（Añejo）；Mezcal：煙燻、烤蔬菜。","say":"「Patrón 是 100% 藍色龍舌蘭；有煙燻味的是梅斯卡爾，做法是用土坑烤龍舌蘭。」","rel":["oak"],"link":[["知識庫：龍舌蘭","./#kb:kbs-teq"]],"src":[["Wikipedia：Tequila","https://en.wikipedia.org/wiki/Tequila"],["Wikipedia：Mezcal","https://en.wikipedia.org/wiki/Mezcal"]],"p":["donjulio-075l","patron-reposado-1l","patron-1l"]},{"id":"store_spirit","s":"w","cat":"客人常問","t":"威士忌開瓶後能放多久？要直放還是躺著放？","en":"Storing Spirits","short":"威士忌裝瓶後不會再熟成；避開陽光，開瓶也不太會壞。烈酒要直立放，高酒精會侵蝕軟木塞。剩不到三分之一時，氧化會變快，建議換小瓶或幾個月內喝完。","what":"蘇格蘭威士忌協會說：只要避開陽光直射，威士忌開瓶後也不會變質；威士忌不像葡萄酒會在瓶中熟成。","why":[["直立放","酒精度 40% 以上會慢慢侵蝕軟木塞，甚至溶解黏著劑；直放可避免。（葡萄酒只有 14% 左右，所以可以躺著。）"],["怕光怕溫差","紫外線會破壞香氣、讓顏色變淡；溫度忽冷忽熱會傷軟木塞。建議陰涼處，約 15–18°C。"],["剩少的時候要注意","瓶中空氣多，香氣會慢慢跑掉。剩不到三分之一可以換小瓶；酒廠建議開瓶後幾個月內喝完風味最好（也有人說半年到一年，但沒有科學定論）。"],["放冰會霧","太冷可能變霧，回到室溫就會清澈。"]],"facts":[["瓶中熟成","不會"],["擺放","直立"],["建議溫度","約 15–18°C、避光"]],"taste":"開瓶後一兩週到幾個月，有些酒會變得更柔和，這是正常的。","say":"「威士忌要直立放、避光就好，不用冰；開了也不會壞，剩一點點的時候盡量幾個月內喝完。」","rel":["store_wine","agestatement","bottle"],"src":[["Scotch Whisky Association：FAQ","https://www.scotch-whisky.org.uk/discover-scotch/faqs/"],["The Lakes Distillery：Whisky storage guide","https://lakesdistillery.com/pages/whisky-storage-guide"],["St. Kilian Distillers：Lagerung von Whiskyflaschen","https://www.stkiliandistillers.com/en/wissen/l-wie-lagerung-von-whiskyflaschen/"]],"p":[]},{"id":"store_wine","s":"w","cat":"客人常問","t":"葡萄酒為什麼要躺著放？要放冰箱嗎？","en":"Storing Wine","short":"躺著放是讓軟木塞一直接觸酒、保持濕潤不乾縮。專家建議 10–15°C、溫度穩定；一般冰箱太乾，會讓軟木塞變乾，不適合長期存放。","what":"葡萄酒酒架大多設計成讓酒躺著放。","why":[["軟木塞要濕","軟木塞接觸到酒比較不會乾縮漏氣；也有研究說稍微斜放更好。"],["溫度要穩","Jancis Robinson 等專家建議 10–15°C 恆溫；要陳年的酒 Karen MacNeil 建議約 13°C。"],["冰箱不適合長放","Tom Stevenson 提到冰箱會除濕，軟木塞容易變乾。"],["濕度","常被引用的理想值約 75%，但相關研究很少。"]],"facts":[["建議溫度","10–15°C（陳年約 13°C）"],["濕度","常見說法約 75%"]],"taste":"溫度太高、忽冷忽熱的酒會老得快，果香變少。","say":"「葡萄酒要躺著放、放陰涼的地方；要喝之前再冰一下就好。」","rel":["store_spirit","decant"],"src":[["Wikipedia：Storage of wine","https://en.wikipedia.org/wiki/Storage_of_wine"]],"p":[]},{"id":"dutyfree","s":"w","cat":"客人常問","t":"免稅店為什麼比較便宜？為什麼有「免稅限定」？","en":"Duty Free","short":"免稅店販售的商品免繳部分地方或國家稅，條件是要帶出境。不過「免稅」不保證一定最便宜，價格還受競爭、機場經營成本影響。旅遊零售常有 1L 或限定包裝。","what":"免稅店（Duty Free）商品免除部分稅負，但必須帶出國境使用。","why":[["省的是稅","烈酒在很多國家稅很重，免稅就差在這裡。"],["不一定都最便宜","維基百科提到免稅不保證是便宜貨，還要看競爭與機場成本。"],["為什麼有限定版","品牌會為旅遊零售（GTR）出專屬酒款、1L 容量、限定包裝，本店商品卡上「旅遊零售限定」就是這種。"],["轉機要注意","有轉機時，液體可能在轉機點被沒收，建議在最後一個轉機點購買，或請本店用防拆袋（STEB）。"]],"taste":"旅遊零售版有時是不同配方或不同桶型，請看商品卡的版本說明。","say":"「這支是旅遊零售限定，國內買不到；有轉機的話我幫您用防拆袋封好。」","rel":["bottle"],"link":[["知識庫：通關・客人問答","./#kb:duty"]],"src":[["Wikipedia：Duty-free shop","https://en.wikipedia.org/wiki/Duty-free_shop"]],"p":[]},{"id":"temper","s":"c","cat":"巧克力為什麼","t":"巧克力為什麼要「調溫」？為什麼好的巧克力會「啪」一聲斷開？","en":"Tempering","short":"可可脂有六種結晶型態，只有第五型（Form V，約 33.8°C 融化）會讓巧克力有光澤、脆脆斷開、入口即化。調溫就是控制溫度讓它結成第五型。","what":"調溫（Tempering）是把巧克力加熱融化、降溫、再微微回溫，讓可可脂結成穩定的 Form V 結晶。","why":[["光澤、脆、好保存","均勻的 Form V 結晶讓巧克力表面光亮、折斷有清脆聲、不容易白霜。"],["沒調溫會怎樣","表面霧霧的、軟軟的、容易出現白霜。"],["為什麼在嘴裡會化","Form V 約 33.8°C 融化，接近口腔溫度，所以拿在手上不化、放進嘴裡就化。"]],"steps":["加熱融化","降溫產生結晶","微微回溫留下 Form V","倒模、冷卻"],"facts":[["可可脂結晶型","六種"],["想要的","Form V"],["Form V 融點","約 33.8°C"]],"taste":"調溫好的巧克力：亮、脆、乾淨的斷面、入口均勻融化。","say":"「好的巧克力折的時候會『啪』一聲，表面亮亮的，這是調溫做得好。」","rel":["bloom","cocoabutter","couverture"],"link":[["知識庫：巧克力怎麼做","../chocolatewiki/#kb:cmake"]],"src":[["Wikipedia：Chocolate","https://en.wikipedia.org/wiki/Chocolate"],["Wikipedia：Cocoa butter","https://en.wikipedia.org/wiki/Cocoa_butter"]],"p":[]},{"id":"bloom","s":"c","cat":"巧克力為什麼","t":"巧克力表面白白的是發霉嗎？","en":"Chocolate Bloom","short":"不是發霉，叫「白霜」，可以吃。油霜＝溫度太高或忽冷忽熱，可可脂跑到表面；糖霜＝受潮（例如冰箱拿出來結露），糖溶解又結晶。","what":"白霜（Bloom）分兩種：油霜（Fat Bloom）與糖霜（Sugar Bloom）。兩種都安全，只是外觀和口感變差。","why":[["油霜","溫度太高或忽冷忽熱（超過約 24°C），可可脂中比較容易融的部分跑到表面再結晶。"],["糖霜","濕氣讓表面的糖溶解，水分乾了糖又結成白色粉狀；冰箱拿出來的結露最常見。"],["怎麼分","油霜用手指稍微溫熱會化掉、會讓水珠滾開；糖霜不會化，水會攤開。"]],"facts":[["油霜觸發","溫度超過約 24°C 或忽冷忽熱"],["糖霜觸發","低於約 15°C 結露、濕氣"],["能不能吃","可以，安全"]],"taste":"白霜的巧克力口感比較粗、香氣少一點，但不影響安全。","say":"「表面白白的不是發霉，是溫度變化讓可可脂或糖跑出來，可以吃；放在 15–17°C 陰涼處就不會。」","rel":["temper","cstore"],"link":[["知識庫：保存溫度與白霜圖解","../chocolatewiki/#kb:ctaste"]],"src":[["Wikipedia：Chocolate bloom","https://en.wikipedia.org/wiki/Chocolate_bloom"],["Wikipedia：Chocolate","https://en.wikipedia.org/wiki/Chocolate"]],"p":[]},{"id":"cstore","s":"c","cat":"巧克力為什麼","t":"巧克力要放冰箱嗎？最好放幾度？","en":"Storing Chocolate","short":"理想是 15–17°C、濕度 50% 以下。放冰箱容易吸濕產生糖霜，也會吸冰箱裡的味道；真的要冰，請密封包好，拿出來先別打開，回溫後再開。","what":"巧克力最怕高溫、溫差和濕氣。","why":[["冰箱太濕、味道多","沒包好的巧克力在冰箱會吸濕產生白色糖霜，也會吸其他食物的味道。"],["怕高溫溫差","超過約 24°C 或忽冷忽熱會出油霜。"],["夏天出國","本店保冷袋可以幫忙，盡量不要放在高溫的車內。"]],"facts":[["理想溫度","15–17°C"],["濕度","50% 以下"]],"taste":"保存得好的巧克力香氣完整、斷面光亮。","say":"「巧克力放陰涼處 15–17°C 最好；天氣熱要冰的話，密封包好，拿出來等回溫再打開。」","rel":["bloom","temper"],"link":[["知識庫：保存與白霜","../chocolatewiki/#kb:ctaste"]],"src":[["Wikipedia：Chocolate","https://en.wikipedia.org/wiki/Chocolate"]],"p":[]},{"id":"cocoabutter","s":"c","cat":"巧克力為什麼","t":"可可脂和「代可可脂」差在哪？","en":"Cocoa Butter vs Substitutes","short":"可可脂是可可豆的天然油脂，融點約 34–38°C、接近體溫，所以入口即化。代可可脂是其他植物油，比較便宜、不需調溫，但口感較蠟、不易化開。歐盟規定巧克力的其他植物油最多 5%。","what":"可可脂（Cocoa Butter）是可可豆壓榨出的天然油脂；可可脂替代品是其他植物油脂。","why":[["口感差別","可可脂融點接近口溫，在室溫是固體、在嘴裡就化。替代油脂融點不同，口感較黏、蠟。"],["法規","歐盟規定巧克力中可可脂以外的植物油不能超過總脂肪的 5%。"],["為什麼有人用替代品","便宜、不用調溫、耐熱。"]],"facts":[["可可脂融點","約 34–38°C"],["歐盟其他植物油上限","5%"]],"taste":"純可可脂：乾淨、入口即化；替代油脂：較黏、尾韻有油感。","say":"「好巧克力用的是可可脂，入口就化；看成分表，有寫代可可脂、植物油的口感會差一點。」","rel":["temper","percent","white"],"src":[["Wikipedia：Cocoa butter","https://en.wikipedia.org/wiki/Cocoa_butter"],["Wikipedia：Chocolate","https://en.wikipedia.org/wiki/Chocolate"]],"p":[]},{"id":"percent","s":"c","cat":"巧克力為什麼","t":"巧克力上的 70%、85% 是什麼意思？為什麼越高越苦？","en":"Cocoa Percentage","short":"百分比＝可可固形物＋可可脂加起來佔多少，剩下大多是糖（牛奶巧克力還有奶）。可可越多、糖越少，就越苦、越濃。","what":"包裝上的「可可 %」是可可成分總量，沒有分開寫可可粉和可可脂各多少。","why":[["% 越高糖越少","70% 巧克力大約 30% 是糖與其他成分；100% 就沒有糖。"],["牛奶讓苦味變柔和","牛奶巧克力的發明就是讓巧克力的苦味變柔和。"],["同樣 % 味道也不同","產地、烘焙、精煉時間都會影響風味。"]],"taste":"70%：濃郁微苦、果酸；85%：明顯苦、可可味重；100%：完全無糖。","say":"「70% 是可可佔七成，其他大多是糖；越高越苦、越不甜，怕苦可以從 55–70% 開始。」","rel":["cocoabutter","milk"],"link":[["知識庫：可可 % 法規最低","../chocolatewiki/#kb:cmake"]],"src":[["Wikipedia：Chocolate","https://en.wikipedia.org/wiki/Chocolate"],["Wikipedia：Milk chocolate","https://en.wikipedia.org/wiki/Milk_chocolate"]],"p":["c2732707300090","c2732707300140","c2732707300070","c2732707300120","c2732707300130","c2732707300150","c2732707300160","c2732707300170","c2732706011670","c2732706009970","c2732767000340","c2732702111450","c2732702111630","c2732713001220","c2732713000820","c2732713000010","c2732713000800","c2732702001020","c2732702111790","c2732709200020","c2732895001020","c2732713001270","c2732708000590","c2732895001010","c2732704200010","c2732704200020","c2732704200030","c2732704200040","c2732704200050","c2732704200060"]},{"id":"conche","s":"c","cat":"巧克力為什麼","t":"精煉（Conching）是什麼？為什麼瑞士巧克力特別滑順？","en":"Conching","short":"1879 年瑞士伯恩的 Rodolphe Lindt（瑞士蓮創辦人之一）發明精煉機：把巧克力長時間攪拌、摩擦、通風，顆粒磨到 20 微米以下、揮發掉酸味，口感變得絲滑。","what":"精煉（Conching）是巧克力製程中長時間攪拌加熱的步驟，傳統可長達 78 小時，現代工廠多在 12 小時內。","why":[["更滑","顆粒磨細（約 20 微米以下），舌頭就感覺不到顆粒。"],["更香、更不酸","摩擦加熱發展風味，通風帶走醋酸等酸味和水分。"],["瑞士的關鍵發明","精煉機發明後，瑞士成為牛奶巧克力的中心。"]],"facts":[["發明","1879 年，伯恩，Rodolphe Lindt"],["傳統時間","可長達 78 小時"],["顆粒","約 20 微米以下"]],"taste":"精煉久的巧克力：絲滑、香氣圓潤、沒有粗糙感。","say":"「瑞士蓮的創辦人發明了精煉機，把巧克力攪拌很久，所以特別滑順。」","rel":["milk","swissbelg","temper"],"src":[["Wikipedia：Conche","https://en.wikipedia.org/wiki/Conche"],["Wikipedia：Rodolphe Lindt","https://en.wikipedia.org/wiki/Rodolphe_Lindt"]],"p":[]},{"id":"milk","s":"c","cat":"巧克力為什麼","t":"牛奶巧克力是誰發明的？為什麼是瑞士？","en":"Milk Chocolate","short":"1875 年瑞士的 Daniel Peter 用鄰居好友 Henri Nestlé（雀巢創辦人）的煉乳做出牛奶巧克力。瑞士酪農業發達、鮮奶多，加上精煉機發明，成為牛奶巧克力中心。","what":"牛奶巧克力＝可可、可可脂、糖＋奶。Daniel Peter 花了約七年研究，1887 年推出第一款可直接吃的品牌 Gala Peter。","why":[["加奶讓苦味變柔和","當時的巧克力很苦，加入奶讓它更容易入口。"],["為什麼用煉乳","鮮奶水分多、容易壞，煉乳才能和巧克力好好結合。"],["為什麼在瑞士","酪農傳統長、鮮奶取得容易，工廠也設在鄉間牧場附近。"]],"facts":[["發明","1875 年，Daniel Peter"],["煉乳","Henri Nestlé"],["歐洲乳脂最低","多數國家至少 3.5%"]],"taste":"牛奶、焦糖、奶油香，甜而溫和。","say":"「牛奶巧克力是瑞士人用雀巢的煉乳發明的，所以瑞士牛奶巧克力最有名。」","rel":["conche","white","swissbelg","percent"],"src":[["Wikipedia：Milk chocolate","https://en.wikipedia.org/wiki/Milk_chocolate"],["Wikipedia：Swiss chocolate","https://en.wikipedia.org/wiki/Swiss_chocolate"]],"p":["c2732706011680","c2732706009960","c2732767000330","c2732713000330","c2732713001090","c2735713000010","c2735713000030","c2732713000020","c2732713001310","c2732713000790","c2732713001120","c2732702001010","c2732702111920","c2732702111930","c2732715000730","c2735702000080","c2732710600140","c2732702111960","c2732744100010","c2732713001250","c2732713001080","c2732704200000"]},{"id":"white","s":"c","cat":"巧克力為什麼","t":"白巧克力算是巧克力嗎？","en":"White Chocolate","short":"算。白巧克力用可可脂、糖、奶做成，只是不含深色的可可固形物（可可粉）。美國與國際標準規定至少 20% 可可脂、14% 乳固形物。","what":"白巧克力＝可可脂＋糖＋奶，沒有可可粉，所以是白色。一般認為 1936 年雀巢推出第一款商業白巧克力（Galak／Milkybar）。","why":[["為什麼是白的","巧克力的棕色和苦味來自可可固形物，白巧克力沒有這部分。"],["有法規下限","至少 20% 可可脂，所以不是隨便的白色糖果。"]],"facts":[["可可脂","至少 20%"],["乳固形物","至少 14%"],["乳脂","至少 3.5%（美國、歐盟）"],["第一款商業白巧","1936 年，雀巢（一般說法）"]],"taste":"奶香、香草、甜；常和抹茶、莓果、開心果搭配。","say":"「白巧克力也是巧克力，是用可可脂做的，只是沒有可可粉，所以奶香特別明顯。」","rel":["cocoabutter","milk"],"src":[["Wikipedia：White chocolate","https://en.wikipedia.org/wiki/White_chocolate"]],"p":["c2732707300060","c2732705000800","c2732705000820","c2732713001290","c2732713001300","c2732704200020"]},{"id":"praline","s":"c","cat":"巧克力為什麼","t":"比利時「帕林內」Praline 是什麼？和松露、榛果醬有什麼不同？","en":"Praline / Truffle / Gianduja","short":"比利時帕林內＝巧克力外殼包軟內餡，1912 年 Neuhaus 推出，1915 年發明了專用禮盒 Ballotin。松露＝甘納許內餡、撒可可粉，形狀像松露菇；Gianduja＝杜林的榛果巧克力（約 30% 榛果醬）。","what":"同一個字在不同地方意思不同：比利時的 Praline 是夾心巧克力；法國、美國的 Praline 是堅果糖；Praliné 則是焦糖榛果或杏仁磨成的醬。","why":[["比利時夾心","1912 年 Jean Neuhaus 二世推出帕林內，1915 年他太太 Louise Agostini 設計了紙盒 Ballotin，避免夾心巧克力被壓壞。"],["松露巧克力","手搓的甘納許（巧克力＋鮮奶油）球，外面撒可可粉，因為長得像松露菇而得名；據說 1895 年聖誕節法國尚貝里的甜點師 Louis Dufour 發明。"],["Gianduja","拿破崙時期在義大利杜林發明，巧克力加約 30% 榛果醬；1806 年大陸封鎖讓可可供應吃緊（但沒有證據說是因此發明）。"]],"facts":[["比利時帕林內","1912 年，Neuhaus"],["Ballotin 禮盒","1915 年"],["松露","1895 年，法國尚貝里（一般說法）"],["Gianduja 榛果比例","約 30%"]],"taste":"帕林內：外殼脆、內餡多變；松露：入口即化、可可粉微苦；Gianduja：濃郁榛果奶香（金莎、費列羅的親戚）。","say":"「比利時的帕林內就是夾心巧克力，那種專用紙盒 Ballotin 也是比利時人發明的，GODIVA、比利時巧克力都是這個傳統。」","rel":["swissbelg","couverture"],"src":[["Wikipedia：Belgian chocolate","https://en.wikipedia.org/wiki/Belgian_chocolate"],["Wikipedia：Chocolate truffle","https://en.wikipedia.org/wiki/Chocolate_truffle"],["Wikipedia：Gianduja (chocolate)","https://en.wikipedia.org/wiki/Gianduja_(chocolate)"]],"p":["c2732702000950","c2732702001180","c2732702111720","c2732707300190","c2732707300200","c2732705000800","c2732705000020","c2732706010260","c2732708000640","c2732713000190","c2732713000820","c2732713001190","c2732713000330","c2732713001230","c2732713001330","c2732713001090","c273271300  if(x.p&&x.p.length){var lim=40;h+='<div class="blk"><h3>本店這樣做的酒 '+x.p.length+' 支</h3><div class="ps">'+x.p.slice(0,lim).map(function(i){var p=D.P[i];return '<a class="p" href="'+href(i)+'"><span><img src="'+E(p[1])+'" alt="" loading="lazy"></span><i>'+E(p[0])+'</i></a>';}).join('')+(x.p.length>lim?'<span class="more">另 '+(x.p.length-lim)+' 支，用上方連結看完整清單</span>':'')+'</div></div>';}
 if(x.rel)h+='<div class="blk"><h3>接著看</h3><div class="rel">'+x.rel.filter(function(r){return BY[r];}).map(function(r){return '<a href="#'+r+'"><i style="background-image:url('+img(r)+')"></i>'+E(BY[r].t.split('？')[0])+'</a>';}).join('')+'</div></div>';
 if(x.link)h+='<div class="blk lk"><h3>本站延伸</h3>'+x.link.map(function(l){return '<a href="'+E(l[1])+'">'+E(l[0])+' ›</a>';}).join('')+'</div>';
 if(x.src)h+='<div class="blk src"><h3>資料來源</h3>'+x.src.map(function(s){return '<div>'+E(s[0])+'：<a href="'+E(s[1])+'" target="_blank" rel="noopener">'+E(s[1])+'</a></div>';}).join('')+'<div style="margin-top:6px">內容依上列來源整理；數字以來源為準，不同來源說法不一時已註明。</div></div>';
 document.getElementById('art').innerHTML=h;return true;}
function route(){var id=decodeURIComponent((location.hash||'').slice(1));if(id&&art(id)){document.body.classList.add('reading');window.scrollTo(0,0);document.title=BY[id].t+'｜為什麼百科';}else{document.body.classList.remove('reading');document.title='為什麼百科｜酒與巧克力的知識';list();}}
document.getElementById('cats').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.c=b.getAttribute('data-c');save();list();});

window.addEventListener('hashchange',route);route();
