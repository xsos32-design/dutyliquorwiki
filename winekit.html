","kit":true,"one":"Beaucastel 教皇新堡 2013：紅果、黑莓、百里香、薰衣草，豐厚細緻。"},{"i":"errazuriz-max-reserva-cabernet-sauvignon-2020","n":"伊拉蘇 Max Reserva 卡本內蘇維濃紅酒 2020","g":"https://xsos32-design.github.io/dutyliquorwiki/p/cb/errazuriz-max-reserva-cabernet-sauvignon-2020.webp","v":0,"pr":"以現場為準","c":"red","sw":false,"co":"am","cty":"智利","rn":"阿空加瓜谷 Aconcagua","band":"價格以現場為準","kit":true,"one":"伊拉蘇 Max Reserva 卡本內 2020：草莓、黑櫻桃、黑醋栗、雪松。"}],"scn":[["送禮最體面（大牌、外盒好看）",["veuveclicquot-075l-2","moet","pj-blason-rose","ruinart-bdb","dom-p-dom-075l","armanddebrignac-075l"]],["情侶・女生・生日（粉紅）",["moet-075l-2","veuveclicquot-075l","pj-blason-rose","ruinart-rose","inniskillin-075l-2","armanddebrignac-075l-3"]],["不太喝酒、喜歡甜一點",["bottega-petalo-manzoni-moscato-rose","moet-075l","moet-ice-075l","inniskillin-075l","inniskillin-vidal-sparkling","armanddebrignac-demisec"]],["派對・慶功・人多",["bottega","bottega-gold-prosecco-brut-3l","moet","armanddebrignac-075l","armanddebrignac-green"]],["懂酒的人・收藏",["krug-rose","domperignon-2008y-dom","vcp-lgd-2018","pj-belle-epoque-rose-2012","armanddebrignac-bdn-no4","armanddebrignac-bdn-2015"]],["配海鮮・生蠔・壽司",["ruinart-bdb","armanddebrignac-075l-2","veuveclicquot-075l-2","bottega"]]],"faq":[["香檳和氣泡酒差在哪？","香檳一定是法國香檳區、用傳統法（瓶中二次發酵）、至少熟成 15 個月做的；其他地方或做法的都叫氣泡酒，例如義大利普羅賽克、西班牙卡瓦。","#kb:kbsp-what"],["Brut 是甜的嗎？","不是。Brut 是每公升少於 12 克糖，屬於不甜；Extra Dry 反而比 Brut 甜一點。","#kb:kbsp-sweet"],["粉紅香檳比較甜嗎？","大多不甜。粉紅色來自紅酒或葡萄皮，不是糖。","#kb:kbsp-style"],["香檳要冰多久？","冰桶放冰塊加水約 20 分鐘；冰箱冷藏約 3 小時；無年份 8–10°C、頂級 10–12°C。","#kb:kbsp-serve"],["開了沒喝完怎麼辦？","用香檳瓶塞夾封好冷藏，1–3 天內喝完。湯匙放瓶口沒有效果。","#kb:kbsp-serve"],["為什麼香檳這麼貴？","每一瓶都要在瓶中發酵，再放 15 個月到好幾年，轉瓶、除渣都很費工；產區也只有香檳區。","#kb:kbsp-make"],["年份香檳和無年份差在哪？","無年份用多個年份調配，維持招牌風格；年份香檳只用一個好年份，至少放 3 年，只在好年份才出。","#kb:kbsp-style"],["白中白、黑中白是什麼？","白中白＝全部白葡萄（夏多內），清爽細緻；黑中白＝黑葡萄釀的白香檳，厚實有紅色水果味。","#kb:kbsp-style"],["紅酒要醒多久？","年輕、單寧重的紅酒（卡本內、巴羅洛）醒 30–60 分鐘；老酒和黑皮諾開瓶後倒進杯子慢慢喝就好，醒太久香氣會散。","#kb:wtaste"],["紅酒開了能放幾天？","塞回瓶塞冷藏，紅酒 3–5 天、白酒 3–5 天、氣泡酒 1–3 天；喝之前紅酒拿出來回溫一下。","#kb:wtaste"],["紅酒要不要冰？","紅酒 15–18°C 最好，台灣室溫太高，可以冰箱冰 15–20 分鐘再喝；白酒 8–12°C。","#kb:wtaste"],["葡萄酒越老越好嗎？","不是。大部分葡萄酒買來 1–5 年內喝最好；只有少數頂級酒（如列級酒莊、巴羅洛、頂級勃根地）適合陳放。","#kb:wtaste"],["瓶底有結晶或沉澱是壞掉嗎？","不是。白酒常見的透明結晶是酒石酸結晶；老紅酒的沉澱是色素和單寧，倒的時候慢一點就好。","#kb:wtaste"],["Dry 是什麼意思？","葡萄酒的 Dry 是「不甜」，和「乾澀」不同；澀感來自單寧。","#kb:wtaste"],["舊世界和新世界差在哪？","舊世界（歐洲）酒標寫產區、風格較內斂；新世界（美、澳、紐、智利）多寫品種、果香較直接。","#kb:wworld"]],"talk":[["開場三問","「今天是送禮還是自己喝？」「喜歡甜一點還是不甜？」「預算大概多少？」問完就能從下面的表直接挑。"],["解釋價格","香檳：瓶中發酵加長時間熟成；紅酒：產區等級、酒莊名氣、年份與數量。說「它貴在哪」，客人比較願意付。"],["往上推一階","「多一千左右可以到白中白／粉紅／一級園，風格更有特色，收到的人會更有感。」"],["成對送","一白一粉（凱歌黃標＋粉紅）、一紅一白（同酒莊紅白酒），送禮拍照好看。"],["不懂酒的客人","不用講太多術語：說「水果味重、好入口」「配海鮮」「配牛排」就夠了。"],["客人只認一個牌子","先肯定，再給一個同等級的對照：「香檳王很好；如果想要不同風格，凱歌貴婦九成黑皮諾、也是頂級特釀。」"]],"bands":["1,500 元以下","1,500–3,000 元","3,000–6,000 元","6,000–12,000 元","12,000 元以上","價格以現場為準"],"br":{"moet":{"n":"酩悅 Moët & Chandon","line":"全世界最多人認得的香檳：穩定、果香、好入口，送禮不會錯。","tier":"入門到中階（香檳王是同集團的頂級線）","since":"1743"},"dp":{"n":"香檳王 Dom Pérignon","line":"只做年份、只在好年份出：香檳界最有名的頂級代名詞。","tier":"頂級特釀 Prestige Cuvée","since":"首個年份 1921"},"vc":{"n":"凱歌 Veuve Clicquot","line":"黃標＝凱歌：故事最好講的香檳，黑皮諾為骨架、果香飽滿。","tier":"入門到頂級（貴婦 La Grande Dame）","since":"1772"},"ruinart":{"n":"瑞納特 Ruinart","line":"最老的香檳酒莊，夏多內專家：清爽、細緻、礦石感。","tier":"中高階","since":"1729"},"krug":{"n":"庫克 Krug","line":"每年一個版號的頂級香檳：厚實、複雜、儲備酒多。","tier":"頂級","since":"1843"},"pj":{"n":"巴黎之花 Perrier-Jouët","line":"花瓶最美的香檳：花香、優雅，女生送禮首選之一。","tier":"中階到頂級","since":"1811"},"adb":{"n":"黑桃王 Armand de Brignac","line":"金屬黑桃 A 瓶：派對與夜店最有排面的香檳。","tier":"頂級","since":"釀酒傳承 1763；品牌 2006"},"bottega":{"n":"波特嘉 Bottega","line":"金瓶普羅賽克：免稅店最暢銷的氣泡酒之一，果香、輕盈、價格親民。","tier":"入門","since":"1977（家族溯源 1635）"},"peller":{"n":"Peller Estates（台灣通路名「啄木鳥」）","line":"加拿大家族酒廠的冰酒：維達爾、卡本內弗朗都有。","tier":"中階（甜酒）","since":"1927 年家族創業"},"inniskillin":{"n":"雲嶺 Inniskillin","line":"讓世界認識加拿大冰酒的酒莊。","tier":"中階（甜酒）","since":"1975"},"penfolds":{"n":"奔富 Penfolds","line":"澳洲紅酒王：用「Bin 編號」就能從入門推到 Grange。","tier":"入門到頂級","since":"1844"},"jadot":{"n":"路易佳鐸 Louis Jadot","line":"一個品牌就能從地區級講到特級園：勃根地的教科書。","tier":"入門到頂級（地區級 → 特級園）","since":"1859（家族 1826 年購入伯恩一級園 Clos des Ursules）"},"bichot":{"n":"Albert Bichot","line":"家族經營近兩百年的勃根地酒商，夏布利一級園是招牌之一。","tier":"中階到高階","since":"1831"},"bdx":{"n":"波爾多 Bordeaux","line":"波爾多＝調配的藝術：先問左岸還是右岸，就猜得到味道。","tier":"入門到列級酒莊副牌","since":"產區"},"antinori":{"n":"安蒂諾里 Antinori","line":"六百多年、26 代的義大利酒業世家：超級托斯卡尼的開創者。","tier":"中階到頂級","since":"1385"},"frescobaldi":{"n":"花思蝶 Frescobaldi","line":"七百年、30 代的托斯卡尼貴族酒莊：從奇揚地到布魯奈羅都有。","tier":"入門到頂級","since":"約 700 年家族釀酒史"},"ornellaia":{"n":"歐尼拉雅 Ornellaia","line":"寶格利頂級名莊，每年一位藝術家的酒標。","tier":"頂級","since":"寶格利"},"chapoutier":{"n":"夏伯帝 M. Chapoutier","line":"北隆河希哈的代表酒廠，從入門到艾米達吉一路都有。","tier":"入門到頂級","since":"1808"},"beaucastel":{"n":"Château de Beaucastel","line":"教皇新堡的經典名莊：多品種調配、有機種植。","tier":"頂級","since":"Perrin 家族"},"hugel":{"n":"雨果家族 Famille Hugel","line":"阿爾薩斯代表酒莊：酒標直接寫品種，最好認。","tier":"入門到中階","since":"1639"},"lostal":{"n":"Domaine de L'Ostal（J-M Cazes）","line":"波爾多名莊主人在南法的酒莊：希哈、格那希調配，價格親民。","tier":"入門","since":"2002"},"luce":{"n":"Tenuta Luce","line":"義大利與加州兩大家族合作的超級托斯卡尼。","tier":"中高階到頂級","since":"1995"},"wente":{"n":"溫特 Wente","line":"美國最老的家族酒莊之一，加州夏多內的「祖先」。","tier":"入門到中階","since":"1883"},"cdf":{"n":"閃電 Coup de Foudre／Amuse Bouche 家族","line":"名字就是「一見鍾情」：送情侶、紀念日最好講的納帕紅酒。","tier":"中高階到頂級","since":"Napa"},"stags":{"n":"鹿躍 Stags' Leap Winery","line":"納帕谷 Stags Leap 產區的老酒廠，梅洛與夏多內圓潤好入口。","tier":"中階","since":"葡萄園 1893"},"newton":{"n":"Newton","line":"「未過濾」夏多內的代表作。","tier":"中階","since":"1977"},"bv":{"n":"Beaulieu Vineyard（BV）","line":"納帕卡本內的老牌名莊：拉瑟福塵土的故事。","tier":"中階到高階","since":"1900"},"beringer":{"n":"貝林格 Beringer","line":"納帕從 1876 年沒停過的酒莊，私藏卡本內拿過年度第一。","tier":"中階到頂級","since":"1876"},"mondavi":{"n":"Robert Mondavi","line":"讓世界認識納帕的名字：從日常款到納帕卡本內。","tier":"入門到中高階","since":"1966"},"cloudy":{"n":"雲霧之灣 Cloudy Bay","line":"紐西蘭白蘇維濃的代名詞：百香果、柑橘、青草。","tier":"中階到高階","since":"1985"},"errazuriz":{"n":"伊拉蘇 Errázuriz","line":"智利百年家族酒莊：MAX 系列以創辦人命名。","tier":"入門到中階","since":"1870"},"losboldos":{"n":"Château Los Boldos","line":"安地斯山下的「法式酒堡」：自有葡萄園、老藤卡本內。","tier":"入門到中階","since":"葡萄樹 1948"}},"brord":["moet","vc","ruinart","pj","dp","krug","adb","penfolds","bottega","peller","inniskillin"]};</script>
<script>(function(){
var D=window.__WK,app=document.getElementById('app');

var BY={};D.sp.forEach(function(x){BY[x.i]=x;});D.wn.forEach(function(x){BY[x.i]=x;});
function card(x){return '<a class="it" href="./#'+E(x.i)+'"><span class="im" style="background-image:url('+E(x.g)+')"></span><span class="tx"><b>'+E(x.n)+'</b><span class="pr">'+E(x.pr)+'</span>'+
 (x.ty?'<span class="tg">'+E(x.ty)+'</span>':'')+(x.sw?'<span class="tg">'+(x.sw===true?'甜':E(x.sw))+'</span>':'')+(x.one?'<p>'+E(x.one)+'</p>':'')+(x.pitch?'<span class="say">'+E(x.pitch)+'</span>':'')+'</span></a>';}
function mini(i){var x=BY[i];if(!x)return'';return '<a href="./#'+E(i)+'"><span class="im" style="background-image:url('+E(x.g)+')"></span>'+E(x.n)+'<i>'+E(x.pr)+'</i></a>';}
var st={who:'',sw:'',bud:''};try{st=JSON.parse(localStorage.getItem('xw_wkui'))||st;}catch(e){}
function save(){try{localStorage.setItem('xw_wkui',JSON.stringify(st));}catch(e){}}
function inBud(v,b){if(!b)return true;if(!v)return false;var r={a:[0,1500],b:[1500,3000],c:[3000,6000],d:[6000,12000],e:[12000,1e9]}[b];return v>=r[0]&&v<r[1];}
function pick(){var L=D.sp.filter(function(x){
  if(st.sw==='sweet'&&x.sw!=='甜')return false;if(st.sw==='dry'&&x.sw==='甜')return false;
  if(st.who==='pink'&&x.ty!=='粉紅')return false;if(st.who==='champ'&&x.ty==='氣泡酒')return false;
  return inBud(x.v,st.bud);});
 L.sort(function(a,b){return (a.v||9e9)-(b.v||9e9);});
 return L;}
function chips(k,opts){return '<div class="chips" data-k="'+k+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'"'+(st[k]===o[0]?' class="on"':'')+'>'+o[1]+'</button>';}).join('')+'</div>';}
function render(){var h='';
 h+='<div class="sec" id="ask"><em>ASK</em><h2>三個問題推得準</h2><span>點選後下面直接列出符合的香檳氣泡</span></div><div class="ask">';

 h+='<div class="q"><b>② 喜歡甜一點嗎？</b>'+chips('sw',[['','都可以'],['dry','不甜'],['sweet','甜一點']])+'</div>';
 h+='<div class="q"><b>③ 預算？</b>'+chips('bud',[['','不限'],['a','1,500 以下'],['b','1,500–3,000'],['c','3,000–6,000'],['d','6,000–12,000'],['e','12,000 以上']])+'</div></div>';
 var L=pick();h+='<div class="res"><div class="grid">'+(L.length?L.map(card).join(''):'<div class="empty">沒有符合的酒款，放寬一個條件試試。</div>')+'</div></div>';
 h+='<div class="sec" id="brand"><em>BRANDS</em><h2>香檳氣泡品牌地圖</h2><span>點圖放大</span></div><div class="brw">'+D.brord.map(function(b){return '<a href="img/wk/br_'+b+'.webp" target="_blank" rel="noopener"><img src="img/wk/br_'+b+'.webp" alt="'+E(D.br[b].n)+'" loading="lazy"></a>';}).join('')+'</div>';
 h+='<div class="sec" id="sp"><em>ALL</em><h2>本店香檳・氣泡酒</h2><span>'+D.sp.length+' 支，依價格分段；點了打開商品卡看銷售包</span></div>';
 var bands={};D.sp.forEach(function(x){(bands[x.band]=bands[x.band]||[]).push(x);});
 D.bands.forEach(function(b){var A=bands[b];if(!A)return;A.sort(function(a,c){return (a.v||0)-(c.v||0);});h+='<div class="band">'+E(b)+'<small>'+A.length+' 支</small></div><div class="grid">'+A.map(card).join('')+'</div>';});
 h+='<div class="sec" id="scene"><em>SCENES</em><h2>場景推薦</h2></div><div class="scn">'+D.scn.map(function(s){return '<div class="c"><h3>'+E(s[0])+'</h3><div class="row">'+s[1].map(mini).join('')+'</div></div>';}).join('')+'</div>';
